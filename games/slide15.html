<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>数字华容道 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;overflow:hidden;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.05rem;}
.back{margin-left:0;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stats{margin-left:auto;display:flex;gap:10px;font-size:.78rem;font-weight:800;white-space:nowrap;
  background:#fff;border-radius:999px;padding:7px 12px;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stats b{color:var(--accent);}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;}
.stage>*{flex:none;}
.prompt{font-size:.95rem;font-weight:800;text-align:center;}
.feedback{min-height:30px;font-size:1.05rem;font-weight:800;text-align:center;padding:0 4px;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@keyframes fall{to{transform:translateY(95vh) rotate(320deg);opacity:.15;}}
.cft{position:fixed;top:-26px;z-index:9;pointer-events:none;animation:fall 1.2s ease-in forwards;}

/* 棋盘：用绝对定位 + transform 实现滑动动画 */
.board{position:relative;flex:none;--n:3;--gap:8px;--pad:9px;
  width:calc(var(--n) * var(--cell) + (var(--n) - 1) * var(--gap) + 2 * var(--pad));
  height:calc(var(--n) * var(--cell) + (var(--n) - 1) * var(--gap) + 2 * var(--pad));
  background:linear-gradient(150deg,#dfe9ff,#efe6ff);border-radius:18px;
  box-shadow:0 8px 24px rgba(36,59,83,.14);}
.board[data-n="3"]{--n:3;--cell:clamp(80px,21vmin,102px);}
.board[data-n="4"]{--n:4;--cell:clamp(56px,15vmin,80px);}
@media (min-height:520px){ .board[data-n="4"]{--cell:clamp(56px,19vmin,86px);} }
.tile,.slot{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);
  border-radius:14px;transition:transform .16s ease;will-change:transform;}
.tile{border:none;background:linear-gradient(160deg,#ffffff,#f4f7ff);box-shadow:0 4px 10px rgba(36,59,83,.16);
  font-family:inherit;font-size:calc(var(--cell) * .4);font-weight:900;color:var(--ink);
  cursor:pointer;z-index:1;transition:transform .16s ease,filter .12s ease;}
.tile:active{filter:brightness(.94);}
.slot{background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 2px rgba(124,92,255,.20);z-index:0;}
/* 控制按钮 */
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.ctl{height:44px;min-width:44px;padding:0 14px;border:none;border-radius:14px;background:#fff;
  box-shadow:0 4px 12px rgba(36,59,83,.12);font-family:inherit;font-size:.9rem;font-weight:800;
  color:var(--ink);cursor:pointer;transition:transform .1s ease;}
.ctl:active{transform:scale(.95);}
.ctl.mode.on{background:linear-gradient(140deg,#7c5cff,#a98bff);color:#fff;}
.ctl.shuffle{background:#fff6e0;color:#9a6b00;}

@media (max-height:430px){
  body{padding:8px;gap:6px;}
  h1{font-size:.95rem;}
  .stats{font-size:.7rem;padding:5px 9px;gap:8px;}
  .back{padding:5px 11px;font-size:.76rem;}
  .stage{gap:6px;}
  .prompt{display:none;}
  .feedback{min-height:18px;font-size:.92rem;}
  .board{--gap:4px;--pad:4px;}
  .ctl{height:38px;padding:0 11px;font-size:.82rem;border-radius:12px;}
}
</style>
</head>
<body>
<header>
  <h1>🧩 数字华容道</h1>
  <div class="stats"><span>步数 <b id="steps">0</b></span><span>🏆 最佳 <b id="best">—</b></span></div>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <div class="prompt">点空格旁边的数字，让它滑过去</div>
  <div class="board" id="board" data-n="3"></div>
  <div class="controls">
    <button class="ctl shuffle" type="button" id="shuffleBtn">🔀 打乱</button>
    <button class="ctl" type="button" id="restartBtn">🔄 重来</button>
    <button class="ctl mode on" type="button" id="mode3">3×3</button>
    <button class="ctl mode" type="button" id="mode4">4×4</button>
  </div>
  <div class="feedback" id="feedback"></div>
</div>
<script>
var state={n:3,board:[],initial:[],steps:0,done:false};
var els={};
var boardEl=null;

/* ---------- 工具 ---------- */
function setFeedback(text,kind){var f=document.getElementById('feedback');f.className='feedback'+(kind?' '+kind:'');f.textContent=text;}
function replay(node,cls){node.classList.remove('pop','shake');void node.offsetWidth;node.classList.add(cls);}
function confetti(){
  var chars=['🎉','✨','🎊','⭐','🌟'];
  for(var i=0;i<16;i++){
    var s=document.createElement('span');
    s.className='cft';s.textContent=chars[i%chars.length];
    s.style.left=(8+Math.random()*84)+'vw';
    s.style.animationDelay=(Math.random()*.35)+'s';
    s.style.fontSize=(14+Math.random()*16)+'px';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1800);})(s);
  }
}
function bestKey(n){return 'slide15.best'+n;}
function loadBest(n){try{var v=parseInt(localStorage.getItem(bestKey(n)),10);return isNaN(v)?null:v;}catch(e){return null;}}
function saveBest(n,v){try{localStorage.setItem(bestKey(n),String(v));}catch(e){}}

/* ---------- 棋盘数据 ---------- */
function solvedBoard(n){
  var total=n*n,a=[];
  for(var i=1;i<total;i++)a.push(i);
  a.push(0);
  return a;
}
function neighbors(idx,n){
  var r=Math.floor(idx/n),c=idx%n,out=[];
  if(r>0)out.push(idx-n);
  if(r<n-1)out.push(idx+n);
  if(c>0)out.push(idx-1);
  if(c<n-1)out.push(idx+1);
  return out;
}
function isSolved(){
  var total=state.n*state.n;
  for(var i=0;i<total-1;i++)if(state.board[i]!==i+1)return false;
  return state.board[total-1]===0;
}

/* ---------- 渲染 ---------- */
function place(el,idx){
  var n=state.n,r=Math.floor(idx/n),c=idx%n;
  el.style.transform='translate(calc(var(--cell)*'+c+' + var(--gap)*'+c+' + var(--pad)),calc(var(--cell)*'+r+' + var(--gap)*'+r+' + var(--pad)))';
}
function renderBoard(){
  boardEl.innerHTML='';
  els={};
  var total=state.n*state.n;
  var slot=document.createElement('div');
  slot.className='slot';
  boardEl.appendChild(slot);
  els[0]=slot;
  for(var v=1;v<total;v++){
    var b=document.createElement('button');
    b.type='button';
    b.className='tile';
    b.textContent=v;
    b.dataset.v=v;
    b.setAttribute('aria-label','数字 '+v);
    b.addEventListener('click',onTileClick);
    boardEl.appendChild(b);
    els[v]=b;
  }
}
function layout(){
  for(var i=0;i<state.board.length;i++)place(els[state.board[i]],i);
}
function updateStats(){
  document.getElementById('steps').textContent=state.steps;
  var b=loadBest(state.n);
  document.getElementById('best').textContent=(b===null?'—':b);
}

/* ---------- 打乱：从已解状态随机走 200 步（必定可解） ---------- */
function scramble(attempt){
  attempt=attempt||0;
  state.board=solvedBoard(state.n);
  var prev=-1;
  for(var k=0;k<200;k++){
    var e=state.board.indexOf(0);
    var nb=neighbors(e,state.n).filter(function(x){return x!==prev;});
    if(!nb.length)nb=neighbors(e,state.n);
    var nx=nb[Math.floor(Math.random()*nb.length)];
    state.board[e]=state.board[nx];
    state.board[nx]=0;
    prev=e;
  }
  if(isSolved()&&attempt<5)return scramble(attempt+1);
  state.steps=0;
  state.done=false;
  state.initial=state.board.slice();
}

/* ---------- 移动 ---------- */
function onTileClick(e){
  var v=parseInt(e.currentTarget.dataset.v,10);
  tryMove(v);
}
function tryMove(v){
  if(state.done)return;
  var n=state.n;
  var i=state.board.indexOf(v);
  var e=state.board.indexOf(0);
  if(i<0||e<0)return;
  var ri=Math.floor(i/n),ci=i%n,re=Math.floor(e/n),ce=e%n;
  var ok=(ri===re&&Math.abs(ci-ce)===1)||(ci===ce&&Math.abs(ri-re)===1);
  if(!ok){
    replay(els[v],'shake');
    setFeedback('❌ 点空格旁边紧挨着的数字哦','bad');
    return;
  }
  state.board[e]=v;
  state.board[i]=0;
  state.steps++;
  layout();
  updateStats();
  setFeedback('','');
  if(isSolved())finish();
}
function finish(){
  state.done=true;
  var cur=loadBest(state.n);
  if(cur===null||state.steps<cur)saveBest(state.n,state.steps);
  updateStats();
  setFeedback('✅ 🎉 完成！用了 '+state.steps+' 步','ok');
  replay(boardEl,'pop');
  confetti();
}

/* ---------- 开局 / 重来 / 换模式 ---------- */
function newPuzzle(n){
  state.n=n;
  boardEl.dataset.n=n;
  renderBoard();
  scramble();
  layout();
  updateStats();
  setFeedback('','');
}
/* 重来：回到本局最初打乱的样子 */
function resetSlide15(){
  state.board=state.initial.slice();
  state.steps=0;
  state.done=false;
  layout();
  updateStats();
  setFeedback('','');
}
function setMode(n){
  document.getElementById('mode3').classList.toggle('on',n===3);
  document.getElementById('mode4').classList.toggle('on',n===4);
  newPuzzle(n);
}
function initSlide15(){
  boardEl=document.getElementById('board');
  document.getElementById('shuffleBtn').addEventListener('click',function(){
    newPuzzle(state.n);
  });
  document.getElementById('restartBtn').addEventListener('click',resetSlide15);
  document.getElementById('mode3').addEventListener('click',function(){
    if(state.n!==3)setMode(3);
  });
  document.getElementById('mode4').addEventListener('click',function(){
    if(state.n!==4)setMode(4);
  });
  setMode(3);
}
initSlide15();
</script>
</body>
</html>
