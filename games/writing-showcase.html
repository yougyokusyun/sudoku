}

allBtn.textContent = '全部 ' + TOTAL;
allBtn.addEventListener('click', function () { active = 'all'; paintCats(); render(); });
elCats.appendChild(allBtn);
GROUPS.forEach(function (g) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'cat';
  b.textContent = g.emoji + ' ' + g.name + ' ' + g.lines.length;
  b.dataset.k = g.k;
  b.addEventListener('click', function () { active = g.k; paintCats(); render(); });
  elCats.appendChild(b);
});
function paintCats() {
  Array.prototype.forEach.call(elCats.children, function (b) {
    var on = (active === 'all') ? (b === allBtn) : (b.dataset.k === active);
    b.className = 'cat' + (on ? ' on' : '');
  });
}

/* 渲染好句 */
function render() {
  var term = (elQ.value || '').trim().toLowerCase();
  elList.innerHTML = '';
  var shown = 0;
  var firstHead = true;

  GROUPS.forEach(function (g) {
    if (active !== 'all' && g.k !== active) return;
    var picked = g.lines.filter(function (l) {
      if (!term) return true;
      return (l[0] + ' ' + l[1] + ' ' + g.name).toLowerCase().indexOf(term) >= 0;
    });
    if (!picked.length) return;

    var head = document.createElement('div');
    head.className = 'ghead';
    var ge = document.createElement('span'); ge.className = 'ge'; ge.textContent = g.emoji;
    var gn = document.createElement('span'); gn.className = 'gn'; gn.textContent = g.name;
    var gc = document.createElement('span'); gc.className = 'gc'; gc.textContent = picked.length + ' 句';
    var gf = document.createElement('span'); gf.className = 'gf'; gf.textContent = g.focus;
    head.appendChild(ge); head.appendChild(gn); head.appendChild(gc); head.appendChild(gf);
    elList.appendChild(head);

    var tip = document.createElement('div');
    tip.className = 'gtip';
    tip.textContent = g.tip;
    elList.appendChild(tip);

    picked.forEach(function (l, i) {
      shown++;
      var row = document.createElement('div');
      row.className = 'line';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');

      var no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1);
      var body = document.createElement('div'); body.className = 'body';
      var t = document.createElement('div'); t.className = 't'; t.textContent = l[0];
      var meta = document.createElement('div'); meta.className = 'meta';
      var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = g.name;
      var use = document.createElement('span'); use.className = 'use'; use.textContent = l[1];
      meta.appendChild(tag); meta.appendChild(use);
      body.appendChild(t); body.appendChild(meta);
      if (l[2]) {
        var src = document.createElement('span'); src.className = 'src';
        src.textContent = '出处：' + l[2];
        body.appendChild(src);
      }
      var spk = document.createElement('button');
      spk.type = 'button'; spk.className = 'spk'; spk.textContent = '🔊';
      spk.setAttribute('aria-label', '朗读这句');

      function go(e) { if (e) { e.stopPropagation(); } say(l[0]); }
      row.addEventListener('click', go);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); say(l[0]); }
      });
      spk.addEventListener('click', go);

      row.appendChild(no); row.appendChild(body); row.appendChild(spk);
      elList.appendChild(row);
    });
    firstHead = false;
  });

  if (!firstHead && active === 'all' && !term) {
    var first = elList.querySelector('.ghead');
    if (first) {
      /* 让第一组不额外留出上面的大间距 */
      first.style.marginTop = '14px';
    }
  }
  elFound.textContent = term ? ('找到 ' + shown + ' 句') : ('全部 ' + shown + ' 句 · 共 ' + GROUPS.length + ' 类');
  if (!shown) {
    var empty = document.createElement('div');
    empty.className = 'gtip';
    empty.textContent = '没有找到相关的句子，换个词试试？';
    elList.appendChild(empty);
  }
}

elQ.addEventListener('input', render);
document.getElementById('clr').addEventListener('click', function () {
  elQ.value = '';
  active = 'all';
  paintCats();
  render();
  elQ.focus();
});

/* 场景词库渲染 */
var elSceneBody = document.getElementById('sceneBody');
var elSceneState = document.getElementById('sceneState');
SCENES.forEach(function (s) {
  var item = document.createElement('div');
  item.className = 'sitem';
  item.setAttribute('role', 'button');
  item.setAttribute('tabindex', '0');

  var title = document.createElement('div');
  title.className = 'stt';
  title.textContent = s.emoji + ' ' + s.who[0];

  var sen = document.createElement('div');
  sen.className = 'ssen';
  var sample = s.when[0] + '，' + s.who[0] + '在' + s.where[0] + s.what[0] + '。';
  sen.textContent = sample;

  var words = document.createElement('div');
  words.className = 'swords';
  words.textContent = '时间：' + s.when.join(' / ') + ' · 谁：' + s.who.join(' / ') + ' · 地点：' + s.where.join(' / ') + ' · 做什么：' + s.what.join(' / ') + ' · 怎么样：' + s.more.join(' / ');

  item.appendChild(title); item.appendChild(sen); item.appendChild(words);
  function go(e) { if (e) { e.stopPropagation(); } say(sample); }
  item.addEventListener('click', go);
  item.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); say(sample); }
  });
  elSceneBody.appendChild(item);
});

document.getElementById('sceneToggle').addEventListener('click', function () {
  var open = elSceneBody.hidden;
  elSceneBody.hidden = !open;
  elSceneState.textContent = open ? '收起' : '展开';
});

paintCats();
render();

window.WS = { GROUPS: GROUPS, SCENES: SCENES, TOTAL: TOTAL };
</script>
<script src="../homebtn.js"></script>
</body>
</html>
