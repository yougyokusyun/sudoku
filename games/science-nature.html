<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--bad:#ff5c5c;--accent:#2a9d8f;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#eafaf6,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#eef4ff,transparent 55%),
             linear-gradient(160deg,#f5fffb,#f3f7ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.82);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:12px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);overflow:hidden;}
.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:none;}
.cbtn{min-height:38px;padding:4px 14px;border-radius:999px;border:2px solid rgba(36,59,83,.10);background:#fff;
  font-family:inherit;font-weight:800;font-size:.8rem;color:#3b5370;cursor:pointer;}
.cbtn.on{border-color:var(--accent);background:#e8fbf5;color:#1c7a6f;}

.qcard{width:min(96vw,680px);background:#fff;border:2px solid rgba(42,157,143,.2);border-radius:18px;
  padding:14px 18px;box-shadow:0 8px 18px rgba(36,59,83,.08);flex:none;}
.qcard .tag{display:inline-block;background:#e8fbf5;color:#1c7a6f;border-radius:999px;font-size:.7rem;
  font-weight:800;padding:2px 10px;margin-bottom:8px;}
.qcard .txt{font-size:clamp(1.02rem,2.6vh,1.32rem);font-weight:800;line-height:1.7;}

.opts{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:9px;width:min(94vw,600px);flex:none;}
.opt{min-height:clamp(48px,9vh,62px);border-radius:16px;border:2px solid rgba(36,59,83,.12);background:#fff;
  font-family:inherit;font-size:clamp(.98rem,3vh,1.25rem);font-weight:900;color:var(--ink);cursor:pointer;
  box-shadow:0 5px 12px rgba(36,59,83,.08);text-align:left;padding:0 16px;}
.opt:active{transform:scale(.97);}
.opt.good{border-color:var(--ok);background:#e9fbee;}
.opt.bad{border-color:var(--bad);background:#ffeded;}
.opt.faded{opacity:.38;pointer-events:none;}

.feedback{min-height:24px;font-size:.92rem;font-weight:900;text-align:center;color:var(--muted);flex:none;}
.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);}
.exp{width:min(94vw,600px);background:#fffbe8;border:2px dashed #e0b23e;border-radius:16px;padding:10px 14px;
  font-size:clamp(.84rem,2.4vh,1rem);font-weight:800;line-height:1.65;color:#6e5410;flex:none;display:none;}
.exp.show{display:block;}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;flex:none;}
.btn{min-height:42px;padding:0 18px;border:2px solid rgba(36,59,83,.10);border-radius:999px;background:#fff;
  color:var(--ink);font-family:inherit;font-weight:800;font-size:.86rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(36,59,83,.10);}
.btn.primary{border-color:rgba(42,157,143,.5);color:#fff;background:linear-gradient(135deg,#4fc3ae,#2a9d8f);}
.btn.warn{border-color:rgba(240,161,26,.5);color:#a06a00;background:#fff7e0;}

@media (max-height:560px){
  body{padding:6px 10px;gap:5px;}
  .stage{gap:6px;padding:8px;}
  .qcard{padding:8px 12px;}
  .qcard .txt{font-size:.98rem;}
  .opt{min-height:42px;font-size:.95rem;}
  .feedback{min-height:16px;font-size:.8rem;}
  .btn{min-height:34px;font-size:.78rem;padding:0 14px;}
}

var V = (window.XNLY && window.XNLY.voice) || null;
function speak(t) {
  if (V && V.speak) { V.speak(t, { rate: 0.92 }); return; }
  if (!window.speechSynthesis) return;
  try {
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1.1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
function mark(kind) {
  if (window.XNLY && window.XNLY.mark) window.XNLY.mark(kind);
}

var state = { c: 0, streak: 0, qno: 0, order: [], pos: 0, cur: null, locked: false, timer: null, wrong: 0 };
var elQ = document.getElementById('qtext');
var elTag = document.getElementById('tag');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elExp = document.getElementById('exp');
var elStreak = document.getElementById('streak');
var elQno = document.getElementById('qno');

function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function setCat(c) {
  state.c = c;
  state.qno = 0;
  state.order = [];
  state.pos = 0;
  Array.prototype.forEach.call(document.querySelectorAll('.cbtn'), function (b) {
    b.classList.toggle('on', Number(b.dataset.c) === c);
  });
  newRound();
}
var sciDecks = {};
function sciDeckFor(cat) {
  if (!sciDecks[state.c]) {
    sciDecks[state.c] = XNLY.deck.make(
      cat.items.map(function (_, i) { return i; }),
      'science-nature.cat' + state.c, { head: 5 });
  }
  return sciDecks[state.c];
}
function newRound() {
  clearTimeout(state.timer);
  state.locked = false;
  var cat = CATS[state.c];
  var idx = sciDeckFor(cat).next();
  state.cur = cat.items[idx];
  state.qno++;
  elQno.textContent = state.qno;
  elTag.textContent = cat.emo + ' ' + cat.name + ' · 第 ' + state.qno + ' 题';
  elQ.textContent = state.cur[0];
  elExp.className = 'exp';
  elExp.textContent = '';
  elFb.className = 'feedback';
  elFb.textContent = '';
  var opts = shuffle([state.cur[1], state.cur[2], state.cur[3]]);
  elOpts.innerHTML = '';
  opts.forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = o;
    b.addEventListener('click', function () { tap(b, o); });
    elOpts.appendChild(b);
  });
  speak(state.cur[0]);
}
function tap(btn, v) {
  if (state.locked) return;
  var cur = state.cur;
  if (v === cur[1]) {
    state.locked = true;
    btn.classList.add('good');
    Array.prototype.forEach.call(elOpts.children, function (b) { if (b !== btn) b.classList.add('faded'); });
    state.streak++;
    elStreak.textContent = state.streak;
    mark('right');
    elFb.className = 'feedback ok';
    elFb.textContent = '✅ 答对啦！';
    elExp.textContent = '💡 ' + cur[4];
    elExp.className = 'exp show';
    speak('答对啦。' + cur[4]);
    state.timer = setTimeout(newRound, 3000);
  } else {
    btn.classList.add('bad', 'faded');
    state.streak = 0;
    elStreak.textContent = '0';
    mark('wrong');
    state.wrong++;
    elFb.className = 'feedback bad';
    elFb.textContent = '❌ 不对哦，正确答案是「' + cur[1] + '」';
    elExp.textContent = '💡 ' + cur[4];
    elExp.className = 'exp show';
    speak('不对哦。' + cur[4]);
    state.timer = setTimeout(newRound, 3200);
  }
}
document.getElementById('hear').addEventListener('click', function () {
  if (state.cur) speak(state.cur[0]);
});
document.getElementById('next').addEventListener('click', newRound);
Array.prototype.forEach.call(document.querySelectorAll('.cbtn'), function (b) {
  b.addEventListener('click', function () { setCat(Number(b.dataset.c)); });
});

setCat(0);
window.__science = CATS;
