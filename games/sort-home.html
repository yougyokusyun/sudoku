<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🛒 分类找一找 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--bad:#ff5c5c;--accent:#2a9d8f;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#eafaf6,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#fff6ea,transparent 55%),
             linear-gradient(160deg,#f6fffb,#fffaf3);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.chips{margin-left:auto;display:flex;gap:6px;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.76);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:10px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);}
.prompt{font-size:.96rem;font-weight:800;text-align:center;color:#4a5f78;}

/* 目标横幅：这一轮要找去哪里的东西 */
.target{display:flex;align-items:center;gap:10px;padding:10px 26px;border-radius:999px;
  background:linear-gradient(135deg,#e8fbf5,#e6f6ff);border:2px solid rgba(42,157,143,.35);
  box-shadow:0 6px 16px rgba(42,157,143,.15);}
.target .tico{font-size:2rem;line-height:1;}
.target .tname{font-size:1.15rem;font-weight:900;color:#1f7a6d;}

/* 物品：可多选 */
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,12px);
  width:min(92vw,420px);}
.item{position:relative;min-height:clamp(64px,17vw,88px);border-radius:18px;border:2px solid rgba(36,59,83,.10);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.9rem;
  box-shadow:0 6px 14px rgba(36,59,83,.10);transition:transform .14s ease,border-color .18s ease,background .18s ease;}
.item:active{transform:scale(.95);}
.item .ph{width:78%;height:56px;object-fit:cover;border-radius:12px;}
.item.good{border-color:var(--ok);background:#e9fbee;animation:pop .45s ease;}
.item.slot{visibility:hidden;}
.item.badd{border-color:var(--bad);background:#ffeded;animation:shake .45s ease;}

/* 点对的东西，飞进目标横幅 */
.fly{position:fixed;z-index:99;pointer-events:none;display:flex;align-items:center;justify-content:center;
  transition:transform .45s cubic-bezier(.3,.9,.4,1),opacity .45s ease;}
.fly img{width:72%;height:72%;object-fit:cover;border-radius:10px;}

.feedback{min-height:28px;font-size:1rem;font-weight:900;text-align:center;color:var(--muted);}
.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);animation:shake .45s ease;}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.btn{min-height:44px;padding:0 20px;border:2px solid rgba(36,59,83,.10);border-radius:999px;
  background:#fff;color:var(--ink);font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(36,59,83,.10);}
.btn.primary{border-color:rgba(42,157,143,.5);color:#fff;background:linear-gradient(135deg,#4fc3ae,#2a9d8f);}

@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* 平板：放大照片，方便孩子观察 */
@media (min-width:600px) and (min-height:600px){
  .target{padding:14px 32px;gap:12px;}
  .target .tico{font-size:2.6rem;}
  .target .tname{font-size:1.4rem;}
  .items{width:min(92vw,560px);gap:14px;}
  .item{min-height:124px;}
  .item .ph{height:88px;width:82%;border-radius:16px;}
  .prompt{font-size:1.1rem;}
}

/* iPad：物品卡与照片再放大一档 */
@media (min-width:700px){
  .items{width:min(92vw,700px);gap:14px;}
  .item{min-height:152px;}
  .item .ph{height:120px;width:84%;border-radius:18px;}
}

@media (max-height:430px){
  body{padding:6px 10px;gap:5px;}
  h1{font-size:.95rem;}
  .chip{padding:2px 8px;font-size:.68rem;}
  .stage{gap:6px;padding:7px;border-radius:16px;flex-direction:row;flex-wrap:wrap;}
  .prompt{flex:1 0 100%;font-size:.8rem;}
  .target{flex:1 1 40%;padding:5px 12px;justify-content:center;align-self:center;}
  .target .tico{font-size:1.3rem;}
  .target .tname{font-size:.85rem;}
  .items{flex:1 1 54%;width:auto;gap:6px;grid-template-columns:repeat(3,minmax(0,1fr));}
  .item{min-height:46px;font-size:1.35rem;border-radius:12px;}
  .item .ph{height:34px;border-radius:8px;}
  .feedback{flex:1 0 100%;min-height:18px;font-size:.84rem;}
  .controls{flex:1 0 100%;}
  .btn{min-height:32px;font-size:.76rem;padding:0 12px;}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png"><script src="../voice.js"></script>
<script src="../sound.js"></script>
<script src="../deck.js"></script>
</head>
<body>
<header>
  <a class="back" href="../index.html">🏠 首页</a>
  <h1>🛒 分类找一找</h1>
  <div class="chips">
    <span class="chip">🔥 连对 <b id="streak">0</b></span>
    <span class="chip">🏆 最佳 <b id="best">0</b></span>
  </div>
</header>

<div class="stage">
  <div class="prompt" id="prompt">点一点属于它的东西👇</div>
  <div class="target" id="target">
    <span class="tico" id="targetIco">🛒</span>
    <span class="tname" id="targetName">超市</span>
  </div>
  <div class="items" id="items"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="btn primary" id="next" type="button">🔄 换一批</button>
  </div>
</div>

<script>
/* 分类目标 + 物品池（f = 本地照片 img/<f>.jpg；yes = 属于这里；no = 干扰项） */
var CATS = [
  { key: 'market', ico: '🛒', name: '超市', tip: '超市里能买到的东西',
    yes: [ {e:'🍎',f:'apple'}, {e:'🍌',f:'banana'}, {e:'🍇',f:'grape'}, {e:'🥛',f:'milk'},
           {e:'🧀',f:'cheese'}, {e:'🍓',f:'strawberry'}, {e:'🥕',f:'carrot'}, {e:'🍊',f:'orange'},
           {e:'🍞',f:'bread'}, {e:'🍬',f:'candy'} ],
    no:  [ {e:'🧸',f:'teddy'}, {e:'🪁',f:'kite'}, {e:'🚂',f:'train'}, {e:'⚽',f:'soccer'},
           {e:'👚',f:'shirt'}, {e:'🧦',f:'socks'}, {e:'🐶',f:'dog'}, {e:'🐱',f:'cat'} ] },
  { key: 'zoo', ico: '🦁', name: '动物园', tip: '住在动物园里的动物',
    yes: [ {e:'🐘',f:'elephant'}, {e:'🦁',f:'lion'}, {e:'🐯',f:'tiger'}, {e:'🐵',f:'monkey'},
           {e:'🐼',f:'panda'}, {e:'🦒',f:'giraffe'}, {e:'🦊',f:'fox'}, {e:'🐻',f:'bear'},
           {e:'🐨',f:'koala'}, {e:'🐧',f:'penguin'} ],
    no:  [ {e:'🍎',f:'apple'}, {e:'🥛',f:'milk'}, {e:'🍞',f:'bread'}, {e:'🚗',f:'car'},
           {e:'👕',f:'shirt'}, {e:'🎈',f:'balloon'}, {e:'🌸',f:'flower'}, {e:'🏠',f:'house'} ] },
  { key: 'toybox', ico: '🧸', name: '玩具箱', tip: '放进玩具箱里的玩具',
    yes: [ {e:'🚗',f:'car'}, {e:'⚽',f:'soccer'}, {e:'🧸',f:'teddy'}, {e:'🪀',f:'yoyo'},
           {e:'🎈',f:'balloon'}, {e:'🪁',f:'kite'}, {e:'🧩',f:'puzzle'}, {e:'🚂',f:'train'} ],
    no:  [ {e:'🍌',f:'banana'}, {e:'🥛',f:'milk'}, {e:'🧀',f:'cheese'}, {e:'🥕',f:'carrot'},
           {e:'👖',f:'pants'}, {e:'👗',f:'dress'}, {e:'🐶',f:'dog'}, {e:'🐘',f:'elephant'} ] },
  { key: 'closet', ico: '👕', name: '衣柜', tip: '收进衣柜里的衣物',
    yes: [ {e:'🧦',f:'socks'}, {e:'👖',f:'pants'}, {e:'👚',f:'shirt'}, {e:'🧥',f:'coat'},
           {e:'👗',f:'dress'}, {e:'🧤',f:'gloves'}, {e:'👒',f:'hat'}, {e:'🩳',f:'shorts'} ],
    no:  [ {e:'🍎',f:'apple'}, {e:'🍬',f:'candy'}, {e:'🍞',f:'bread'}, {e:'🥛',f:'milk'},
           {e:'🚗',f:'car'}, {e:'🧸',f:'teddy'}, {e:'🐶',f:'dog'}, {e:'🐱',f:'cat'} ] }
];

var cur = null;                // 本轮目标分类
var picks = [];                // 本轮 6 件物品 {e,f,yes,el}
var leftCount = 0;             // 还剩几件没找到
var catOrder = [], catIdx = 0; // 打乱后的分类轮换
var streak = 0, best = readNum('phome.best');
var locked = false, timer = null;

var elTargetIco = document.getElementById('targetIco');
var elTargetName = document.getElementById('targetName');
var elItems = document.getElementById('items');
var elFb = document.getElementById('feedback');
var elPrompt = document.getElementById('prompt');
var elStreak = document.getElementById('streak');
var elBest = document.getElementById('best');

function readNum(k) { var v = parseInt(localStorage.getItem(k), 10); return isNaN(v) ? 0 : v; }
function writeNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function updateStats() { elStreak.textContent = streak; elBest.textContent = best; }
function feedback(t, cls) {
  elFb.className = 'feedback' + (cls ? ' ' + cls : '');
  elFb.textContent = t || '';
}

var canSpeak = typeof window.speechSynthesis !== 'undefined';
/* 读完语音再跳下一题：onend 不触发时按 字数×220ms+1500ms 兜底 */
function sayThen(t, cb) {
  if (window.XNLY && XNLY.voice && XNLY.voice.speakThen) return XNLY.voice.speakThen(String(t || ''), cb);
  t = String(t || '');
  try { if (window.XNLY && XNLY.voice && XNLY.voice.speak) XNLY.voice.speak(t); } catch (e) { }
  var ph = setTimeout(function () { try { if (cb) cb(); } catch (e) { } }, Math.max(1500, t.replace(/\s+/g, '').length * 220) + 1500);
  return { cancel: function () { clearTimeout(ph); } };
}

function say(text) {
  if (!canSpeak) return;
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.94;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { }
}

/* 本地照片，加载失败时回退 emoji */
function setPhoto(host, f, emoji) {
  host.innerHTML = '';
  var img = new Image();
  img.className = 'ph';
  img.alt = emoji;
  img.onerror = function () { host.innerHTML = ''; host.textContent = emoji; };
  img.src = 'img/' + f + '.jpg';
  host.appendChild(img);
}

var catDeck = XNLY.deck.make(CATS.map(function (c, i) { return i; }), 'sort-home', { head: 3 });

function newRound() {
  if (window.XNLY && XNLY.voice) { try { XNLY.voice.cancel(); } catch (e) { } }

  clearTimeout(timer);
  locked = false;
  feedback('');

  /* 分类轮换，洗牌抽完才重洗 */
  cur = CATS[catDeck.next()];
  elTargetIco.textContent = cur.ico;
  elTargetName.textContent = cur.name;
  elPrompt.textContent = '点一点属于「' + cur.name + '」的东西👇';

  /* 3 件属于 + 3 件不属于，打乱后展示 */
  var pool = [];
  shuffle(cur.yes).slice(0, 3).forEach(function (o) { pool.push({ e: o.e, f: o.f, yes: true }); });
  shuffle(cur.no).slice(0, 3).forEach(function (o) { pool.push({ e: o.e, f: o.f, yes: false }); });
  picks = shuffle(pool).map(function (o) { o.el = null; return o; });
  leftCount = picks.filter(function (o) { return o.yes; }).length;   // 只数「属于」的物品

  elItems.innerHTML = '';
  picks.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'item';
    b.setAttribute('aria-label', p.e);
    setPhoto(b, p.f, p.e);
    p.el = b;
    b.addEventListener('click', function () { tapItem(p); });
    elItems.appendChild(b);
  });

  window.__cat = cur.name;
  window.__left = leftCount;
  voiceSpeak('把属于' + cur.name + '的东西都找出来吧');
}

/* 点对：立即飞进目标横幅；点错：抖动弹回 */
function tapItem(p) {
  if (locked || p.el.classList.contains('slot')) return;
  if (p.yes) {
    flyToTarget(p);
    p.el.classList.add('slot');
    leftCount--;
    window.__left = leftCount;
    if (leftCount > 0) {
      feedback('✅ 对啦，它属于' + cur.name + '！还剩 ' + leftCount + ' 件', 'ok');
    } else {
      locked = true;
      streak++;
      if (streak > best) { best = streak; writeNum('phome.best', best); }
      updateStats();
      feedback('🎉 「' + cur.name + '」的东西全找到啦！', 'ok');
      elPrompt.textContent = '🎉 全部找对啦！';
      timer = sayThen('太棒了，全都找对啦！', newRound);
    }
  } else {
    p.el.classList.add('badd');
    setTimeout(function () { p.el.classList.remove('badd'); }, 500);
    voiceSpeak('它不属于' + cur.name + '，再想一想');
    feedback('❌ 它不属于' + cur.name + '，再看看', 'bad');
  }
}

/* 点对的东西，从原位飞进目标横幅并淡出 */
function flyToTarget(p) {
  var a = p.el.getBoundingClientRect(), b = document.getElementById('target').getBoundingClientRect();
  var f = document.createElement('div');
  f.className = 'fly';
  var img = new Image();
  img.alt = p.e;
  img.onerror = function () { f.innerHTML = ''; f.textContent = p.e; };
  img.src = 'img/' + p.f + '.jpg';
  f.appendChild(img);
  f.style.cssText += 'left:' + a.left + 'px;top:' + a.top + 'px;width:' + a.width + 'px;height:' + a.height + 'px;';
  document.body.appendChild(f);
  void f.offsetWidth;
  var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  var dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.4)';
  f.style.opacity = '.2';
  setTimeout(function () { f.remove(); }, 470);
}

document.getElementById('next').addEventListener('click', function () {
  streak = 0;
  updateStats();
  newRound();
});

function initSortHome() {
  best = readNum('phome.best');
  updateStats();
  newRound();
}
function resetSortHome() {
  streak = 0;
  updateStats();
  newRound();
}
initSortHome();

/* ===== 语音播报：进入游戏先读一遍玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '分类找一找。点一点属于目标地点的东西。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进入游戏自动朗读；若浏览器拦截自动播放，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  try {
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
  setTimeout(function () {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
    var once = function () {
      document.removeEventListener('pointerdown', once);
      voiceSpeak(VOICE_TEXT);
    };
    document.addEventListener('pointerdown', once);
  }, 900);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.10);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();

/* 顶栏「下一题」：跳过当前题，不判分、不显示答案、不清空连对 */
(function () {
  var busy = false;
  window.XNLY_NEXT = function () {
    if (busy) return;
    busy = true;
    try { if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel(); } catch (e) { }
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
    try { newRound(); } catch (e) { }   /* newRound 只换目标分类与物品，streak/best 不动 */
    setTimeout(function () { busy = false; }, 0);
  };
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>

</body>
