<html lang="zh-CN">

<title>📖 成语闯关 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--bad:#ff5c5c;--accent:#6a4bff;--warm:#f0a11a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 480px at 0% 0%,#f2eeff,transparent 60%),
             radial-gradient(900px 480px at 100% 0%,#fff4e3,transparent 55%),
             linear-gradient(160deg,#fbfaff,#fffaf3);
  height:100dvh;display:flex;flex-direction:column;padding:8px 12px 10px;gap:7px;user-select:none;overflow:hidden;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.12rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}
.chips{margin-left:auto;display:flex;gap:6px;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--warm);font-size:.86rem;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{flex:1 1 0;min-height:40px;border-radius:14px;border:2px solid rgba(36,59,83,.10);background:#fff;
  color:#4a6076;font-family:inherit;font-weight:800;font-size:.84rem;cursor:pointer;white-space:nowrap;}
.tab.on{border-color:rgba(106,75,255,.55);background:rgba(106,75,255,.10);color:#4a34c4;}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;
  background:rgba(255,255,255,.8);border:2px solid rgba(36,59,83,.08);border-radius:20px;padding:9px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);}
.hint{font-size:.8rem;font-weight:800;text-align:center;color:#7a6a4f;flex:none;}
.panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;}

/* 猜一猜：emoji 画面 + 谜面 */
.sceneCard{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  min-height:clamp(88px,26vh,190px);padding:8px 14px;border-radius:20px;
  border:3px solid rgba(240,161,26,.28);background:linear-gradient(160deg,#fffbef,#fff1d8);}
.sceneCard .s{font-size:clamp(2.1rem,9.5vh,4.4rem);line-height:1;}
/* 猜一猜：真实插画卡（图片加载失败时自动回退到上面的 emoji 场景） */
/* 竖屏：图片区固定按屏幕高度预留，加载/失败都不改变高度，题干不位移 */
.sceneImgWrap{flex:0 0 auto;height:46vh;min-height:140px;display:flex;align-items:center;justify-content:center;padding:6px;
  border-radius:20px;border:3px solid rgba(240,161,26,.28);
  background:linear-gradient(160deg,#fffbef,#fff1d8);overflow:hidden;}
.sceneImg{width:100%;height:100%;object-fit:contain;
  border-radius:16px;display:block;}
/* 图片未加载 / 加载失败：容器仍按预留高度占位，文字不位移 */
.imgPh{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;
  color:#b08a4a;font-weight:800;}
.imgPh .s{font-size:clamp(1.6rem,6vh,2.8rem);line-height:1;}
/* 填一填用紫色边框区分 */
.sceneImgWrap.violet{border-color:rgba(106,75,255,.22);background:linear-gradient(160deg,#faf8ff,#f0ecff);}
.riddle{font-size:clamp(.9rem,2.6vh,1.1rem);font-weight:800;text-align:center;color:#4a5f78;flex:none;
  line-height:1.45;padding:0 4px;}
.riddle.dim{color:#9aa8ba;}
.hintBtn{flex:none;min-height:42px;border:none;border-radius:14px;background:#fff7d6;color:#a06a00;
  font-weight:900;font-size:.88rem;padding:6px 18px;cursor:pointer;font-family:inherit;align-self:center;
  box-shadow:0 4px 12px rgba(160,106,0,.16);}
.hintBtn:disabled{opacity:.55;cursor:default;}

/* 选项 */
.opts{flex:1 1 auto;min-height:0;display:grid;gap:8px;}
.opts.c2{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);}
.opts.c3{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr;}
.opts.c4{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr;}
.opt{min-height:56px;border-radius:18px;border:3px solid rgba(36,59,83,.10);background:#fff;
  font-family:inherit;font-weight:900;color:#31465c;cursor:pointer;padding:6px 8px;
  font-size:clamp(.95rem,2.6vh,1.3rem);display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 5px 12px rgba(36,59,83,.07);transition:transform .12s ease,border-color .16s ease,background .16s ease;}
.opt:active{transform:scale(.97);}
.opt.good{border-color:var(--ok);background:#e9fbee;color:#1b7c33;}
.opt.bad{border-color:var(--bad);background:#ffeded;animation:shake .4s ease;}
/* 选错时：按钮自己闪三下，不用孩子再点任何东西 */
.opt.wrongFlash{animation:wrongFlash .42s ease 3;}
@keyframes wrongFlash{
  0%,100%{border-color:rgba(36,59,83,.10);background:#fff;color:#31465c;transform:translateX(0);}
  25%{border-color:var(--bad);background:#ffeded;color:#c0392b;transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{border-color:var(--bad);background:#ffeded;color:#c0392b;transform:translateX(-4px);}
}

/* 填一填：成语 + 空格 */
.fillCard{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:clamp(70px,18vh,130px);border-radius:20px;border:3px solid rgba(106,75,255,.22);
  background:linear-gradient(160deg,#faf8ff,#f0ecff);}
.fillCard .ch{font-size:clamp(1.9rem,7vh,3.2rem);font-weight:900;color:#3f3a63;letter-spacing:.03em;}
.fillCard .blank{display:inline-flex;align-items:center;justify-content:center;
  min-width:clamp(46px,10vh,74px);height:clamp(52px,11vh,84px);border-radius:14px;
  border:3px dashed #9c8bff;background:#fff;color:#6a4bff;font-size:clamp(1.6rem,6vh,2.6rem);}


/* 左右两栏用的内容列（竖屏时自然上下排，横屏时放右侧） */
.side{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;flex:1 1 auto;}

/* 结果卡：一句话解释 + 出处。浮在舞台底部，不挤压题干和选项 */
.stage{position:relative;}
.infoCard{position:absolute;left:10px;right:10px;bottom:40px;z-index:30;display:none;
  background:rgba(255,255,255,.97);border:2px solid rgba(106,75,255,.28);border-radius:16px;
  padding:10px 12px;box-shadow:0 10px 26px rgba(36,59,83,.18);max-height:46%;overflow:auto;text-align:left;}
.infoCard .ic-title{font-size:.9rem;font-weight:900;color:#5b3fd6;margin-bottom:4px;}
.infoCard .ic-exp{font-size:.9rem;font-weight:800;color:#31465c;line-height:1.45;}
.infoCard .ic-src{font-size:.78rem;font-weight:700;color:#7b8ea8;margin-top:4px;}

.feedback{min-height:30px;font-size:.95rem;font-weight:900;text-align:center;color:var(--muted);flex:none;}
.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);animation:shake .4s ease;}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}

@media (max-height:460px){
  body{padding:6px 10px;gap:5px;}
  h1{font-size:.95rem;}
  .tab{min-height:32px;font-size:.76rem;border-radius:11px;}
  .stage{gap:5px;padding:6px;border-radius:14px;}
  .hint{font-size:.7rem;}
  .sceneCard{min-height:70px;border-radius:14px;}
  .sceneCard .s{font-size:1.9rem;}
  .sceneImgWrap{border-radius:14px;padding:3px;}
  .sceneImg{border-radius:12px;}
  .riddle{font-size:.78rem;}
  .hintBtn{min-height:34px;font-size:.78rem;}
  .opt{min-height:42px;border-radius:12px;font-size:.82rem;}
  .fillCard{min-height:56px;border-radius:14px;}
  .fillCard .ch{font-size:1.4rem;}
  .fillCard .blank{min-width:36px;height:42px;border-radius:10px;font-size:1.2rem;}
  .sceneText{min-height:56px;border-radius:14px;font-size:.82rem;}
  .mcard .back{font-size:1.1rem;}
  .feedback{min-height:20px;font-size:.8rem;}
}

/* iPad 横屏：改为左右两栏（左图 / 右题干+选项）。
   图片素材是 1:1 正方形，用 aspect-ratio 先占位，加载前后高度一致，文字不位移。 */
@media (orientation:landscape) and (min-width:900px){
  .stage{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .panel.guess,.panel.fill{flex:0 0 auto;flex-direction:row;align-items:center;gap:12px;min-height:0;}
  .panel.guess>.sceneImgWrap,.panel.fill>.sceneImgWrap,
  .panel.guess>.sceneCard{
    flex:0 0 auto;width:min(46%,48vh);height:auto;aspect-ratio:1/1;min-height:0;align-self:center;}
  .panel>.side{flex:1 1 0;align-self:stretch;min-width:0;}
  .panel>.side .opts{flex:0 0 auto;}
  .panel>.side .opt{min-height:62px;}
  .sceneImg{width:100%;height:100%;object-fit:contain;}
}

/* 把解释与出处挂到每道题上：GUESSES / FILLS 每题都带 explain + source */
[GUESSES, FILLS].forEach(function (list) {
  list.forEach(function (q) {
    var info = INFO[q.a] || {};
    q.explain = info.e || '';
    q.source = info.s || '';
  });

/* ===== 状态 ===== */
var mode = 'guess';
var streak = 0, best = readNum('pidiom.best');
var cur = null;                 /* 当前题目 */
var lockQ = false;              /* 当前题是否已判定 */
var timer = null;               /* 自动换题计时 */
var lockT = null;               /* 换题后的输入锁计时 */

var elPanel = document.getElementById('panel');
var elHint = document.getElementById('hint');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');
var elBest = document.getElementById('best');

function readNum(k) { var v = parseInt(localStorage.getItem(k), 10); return isNaN(v) ? 0 : v; }
function writeNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function updateStats() { elStreak.textContent = streak; elBest.textContent = best; }
function feedback(t, cls) {
  elFb.className = 'feedback' + (cls ? ' ' + cls : '');
  elFb.textContent = t || '';
}
function bumpStreak() {
  streak++;
  if (streak > best) { best = streak; writeNum('pidiom.best', best); }
  updateStats();
}
function clearTimer() { clearTimeout(timer); timer = null; }
/* 换题后 800ms 输入锁：朗读还在播，防止连点把新题也点掉 */
function lockInput() {
  lockQ = true;
  clearTimeout(lockT);
  lockT = setTimeout(function () { lockQ = false; }, 800);
}

var canSpeak = typeof window.speechSynthesis !== 'undefined';
function say(text) {
  if (!text) return;
  if (window.XNLY && XNLY.voice && XNLY.voice.speak) {
    try { XNLY.voice.speak(String(text)); return; } catch (e) { }
  }
  if (!canSpeak) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.92;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 读完再跳：语音队列全部播完才执行 cb；onend 不触发时按「字数×220ms+1500ms」兜底 */
function sayThen(text, cb) {
  if (window.XNLY && XNLY.voice && XNLY.voice.speakThen) {
    try { return XNLY.voice.speakThen(String(text), cb); } catch (e) { }
  }
  say(text);
  var ms = Math.max(1500, String(text || '').replace(/\s+/g, '').length * 220) + 1500;
  var t = setTimeout(cb, ms);
  return { cancel: function () { clearTimeout(t); } };
}
/* 答对后的结果卡：一句话解释 + 出处（朗读只念解释，不念出处） */
function showInfo(name) {
  var info = INFO[name];
  var box = document.getElementById('infoCard');
  if (!box) {
    box = el('div', 'infoCard');
    box.id = 'infoCard';
    var stage = document.querySelector('.stage');
    (stage || document.body).appendChild(box);
  }
  if (!info) { box.style.display = 'none'; return; }
  box.innerHTML = '';
  box.appendChild(el('div', 'ic-title', '📖 ' + name));
  box.appendChild(el('div', 'ic-exp', '💡 ' + info.e));
  box.appendChild(el('div', 'ic-src', '📜 出处：' + info.s));
  box.style.display = 'block';
}
function hideInfo() {
  var b = document.getElementById('infoCard');
  if (b) b.style.display = 'none';
}
function pickWrong(pool, right, n) {
  var others = pool.filter(function (x) { return x !== right; });
  return shuffle(others).slice(0, n);
}
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* ===== 一、猜一猜 ===== */
/* 没有配图的题目：用 emoji 画面 */
function guessEmojiCard(q) {
  var card = el('div', 'sceneCard');
  q.sc.forEach(function (s) { card.appendChild(el('span', 's', s)); });
  return card;
}
/* 有配图的题目：先显示真实插画，加载失败自动换回 emoji 画面 */
function guessImgCard(q) {
  var wrap = el('div', 'sceneImgWrap');
  var img = document.createElement('img');
  img.className = 'sceneImg';
  img.alt = '看图猜成语';
  img.decoding = 'async';
  img.src = q.img;
  img.addEventListener('error', function () {
    /* 加载失败：容器保留原高度，换成 emoji 占位，文字位置不变 */
    if (img.parentNode) img.parentNode.removeChild(img);
    var ph = el('div', 'imgPh');
    (q.sc || []).forEach(function (s) { ph.appendChild(el('span', 's', s)); });
    wrap.appendChild(ph);
  });
  wrap.appendChild(img);
  return wrap;
}

/* 出题轮换：每个玩法一副牌，抽完一轮才重洗，同一轮内不会重复同一成语 */
var decks = { guess: [], fill: [] };
function deckTake(key, list, n) {
  var d = decks[key], out = [];
  if (!d.length) d.push.apply(d, shuffle(list.slice()));
  if (d.length < n) {
    out = d.splice(0, d.length);
    d.push.apply(d, shuffle(list.slice()));
    out = out.concat(d.splice(d.length - (n - out.length), n - out.length));
  } else {
    out = d.splice(d.length - n, n);
  }
  return out;
}

function newGuess() {
  clearTimer(); lockInput(); hideInfo();
  var q = deckTake('guess', GUESSES, 1)[0];
  var opts = shuffle([q.a].concat(pickWrong(GUESSES.map(function (g) { return g.a; }), q.a, 3)));
  cur = { a: q.a, sc: q.sc, img: q.img, r: q.r, explain: q.explain, source: q.source, o: opts };

  elHint.textContent = '看看图，猜猜是哪个成语';
  elPanel.className = 'panel guess';
  elPanel.innerHTML = '';
  elPanel.appendChild(q.img ? guessImgCard(q) : guessEmojiCard(q));

  var side = el('div', 'side');
  /* 谜面默认隐藏，点「提示」或猜错后才显示 */
  side.appendChild(el('div', 'riddle dim', '💡 图片里藏着什么故事？点「提示」看线索'));

  var hintBtn = el('button', 'hintBtn', '💡 提示 · 看看线索');
  hintBtn.type = 'button';
  hintBtn.onclick = function () { revealGuessRiddle(true); feedback(''); };
  side.appendChild(hintBtn);

  var optsBox = el('div', 'opts c2');
  opts.forEach(function (name) {
    var b = el('button', 'opt', name);
    b.type = 'button';
    b.onclick = function () { answerGuess(name, b); };
    optsBox.appendChild(b);
  });
  side.appendChild(optsBox);
  elPanel.appendChild(side);
  feedback('');
  say('看看图，猜猜是哪个成语。');
  window.__answer = q.a;
  window.__options = opts;
}

/* 揭示谜面线索：点提示按钮 或 猜错时自动触发 */
function revealGuessRiddle(speakIt) {
  if (!cur) return;
  var r = elPanel.querySelector('.riddle');
  if (!r || !r.classList.contains('dim')) return;
  r.textContent = cur.r;
  r.classList.remove('dim');
  var hb = elPanel.querySelector('.hintBtn');
  if (hb) { hb.disabled = true; hb.textContent = '💡 线索在这里'; }
  if (speakIt) say(cur.r);
}

function answerGuess(name, btn) {
  if (lockQ) return;
  if (name === cur.a) {
    lockQ = true;
    btn.classList.add('good');
    bumpStreak();
    feedback('✅ 就是' + cur.a, 'ok');
    revealGuessRiddle(false);
    showInfo(cur.a);
    Array.prototype.forEach.call(elPanel.querySelectorAll('.opt'), function (b) {
      if (b !== btn) b.style.opacity = '.5';
    });
    /* 语音全部读完后才换下一题；onend 不触发时由兜底超时放行。朗读不念出处 */
    sayThen('对啦，就是' + cur.a + '。' + (cur.explain || (MEAN[cur.a] || '')), newGuess);
  } else {
    /* 选错：按钮自己闪三下，同时亮出线索，孩子直接重新选就行 */
    btn.classList.add('wrongFlash');
    setTimeout(function () { btn.classList.remove('wrongFlash'); }, 1350);
    feedback('❌ 选错啦，请仔细看线索，重新选一个', 'bad');
    revealGuessRiddle(true);
  }
}

/* ===== 二、填一填 ===== */
/* 填空配图：加载失败显示占位块，容器高度不变 */
function fillImgCard(src) {
  var wrap = el('div', 'sceneImgWrap violet');
  var img = document.createElement('img');
  img.className = 'sceneImg';
  img.alt = '成语插图';
  img.decoding = 'async';
  img.src = src;
  img.addEventListener('error', function () {
    /* 加载失败：保留占位容器，避免下方成语卡和选项上跳 */
    if (img.parentNode) img.parentNode.removeChild(img);
    wrap.appendChild(el('div', 'imgPh', '🖼️ 图片暂时看不了'));
  });
  wrap.appendChild(img);
  return wrap;
}

function newFill() {
  clearTimer(); lockInput(); hideInfo();
  var q = deckTake('fill', FILLS, 1)[0];
  cur = { a: q.a, i: q.i, img: q.img, explain: q.explain, source: q.source, o: shuffle(q.o.slice()) };

  elHint.textContent = '看图，把成语缺的字选出来';
  elPanel.className = 'panel fill';
  elPanel.innerHTML = '';
  if (q.img) elPanel.appendChild(fillImgCard(q.img));

  var side = el('div', 'side');
  var card = el('div', 'fillCard');
  for (var i = 0; i < q.a.length; i++) {
    if (i === q.i) card.appendChild(el('span', 'blank', '？'));
    else card.appendChild(el('span', 'ch', q.a[i]));
  }
  side.appendChild(card);

  var optsBox = el('div', 'opts c3');
  cur.o.forEach(function (ch) {
    var b = el('button', 'opt', ch);
    b.type = 'button';
    b.onclick = function () { answerFill(ch, b); };
    optsBox.appendChild(b);
  });
  side.appendChild(optsBox);
  elPanel.appendChild(side);
  feedback('');
  say('看看图，这个成语缺了一个字，把它选出来。');
  window.__answer = q.a[q.i];
  window.__idiom = q.a;
  window.__options = cur.o;
}

function answerFill(ch, btn) {
  if (lockQ) return;
  if (ch === cur.a[cur.i]) {
    lockQ = true;
    btn.classList.add('good');
    bumpStreak();
    feedback('✅ 正是' + cur.a, 'ok');
    showInfo(cur.a);
    Array.prototype.forEach.call(elPanel.querySelectorAll('.opt'), function (b) {
      if (b !== btn) b.style.opacity = '.5';
    });
    sayThen('对啦，' + cur.a + '。' + (cur.explain || (MEAN[cur.a] || '')), newFill);
  } else {
    btn.classList.add('bad');
    setTimeout(function () { btn.classList.remove('bad'); }, 430);
    feedback('❌ 不对哦，再想一想', 'bad');
    say('不对哦，再想一想');
  }
}


/* ===== 模式切换与入口 ===== */
var MODE_TEXT = {
  guess: '成语猜猜猜。看看图，听听谜面，猜猜是哪个成语。',
  fill: '成语填一填。成语里缺了一个字，从下面把它选出来。',
};

var starts = {
  guess: function () { newGuess(); },
fill: function () { newFill(); }
};

function setMode(m, silent) {
  /* 切模式 = 用户手动换题：作废正在等待的自动跳转 */
  if (window.XNLY && XNLY.voice) { try { XNLY.voice.cancel(); } catch (e) { } }
  hideInfo();
  mode = m;
  clearTimer();
  streak = 0;
  updateStats();
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.classList.toggle('on', t.getAttribute('data-m') === m);
  });
  starts[m]();
  if (!silent) voiceSpeak(MODE_TEXT[m]);
  window.__mode = m;
}

document.getElementById('tabs').addEventListener('click', function (e) {
  var t = e.target.closest('.tab');
  if (!t) return;
  var m = t.getAttribute('data-m');
  if (m !== mode) setMode(m);
});

/* 键盘 1~2 切换模式 */
document.addEventListener('keydown', function (e) {
  if (e.key === '1') { if (mode !== 'guess') setMode('guess'); }
  else if (e.key === '2') { if (mode !== 'fill') setMode('fill'); }
});

updateStats();
setMode('guess', true);

/* ===== 语音播报：进入游戏先读一遍玩法，右上角 homebtn 工具条的 🔊 可随时重听 ===== */
function voiceSpeak(text) {
  if (!text) return;
  if (window.XNLY && XNLY.voice && XNLY.voice.speak) {
    try { XNLY.voice.speak(String(text)); return; } catch (e) { }
  }
  say(text);
}
/* 工具条 🔊 重听：读当前玩法说明（页面内不再保留第二个朗读按钮） */
window.replayCurrent = function () { voiceSpeak(MODE_TEXT[mode]); };
/* 进入时若自动播放被拦截，第一次碰屏幕补读当前模式说明 */
(function () {
  var started = false;
  try {
    var u = new SpeechSynthesisUtterance(MODE_TEXT[mode]);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.05;
    u.onstart = function () { started = true; };
    window.speechSynthesis.speak(u);
  } catch (e) { }
  setTimeout(function () {
    if (started) return;
    var once = function () {
      document.removeEventListener('pointerdown', once);
      voiceSpeak(MODE_TEXT[mode]);
    };
    document.addEventListener('pointerdown', once);
  }, 900);
})();

/* 顶栏「下一题」：跳过当前题，不判分、不显示答案、不清空连对 */
window.XNLY_NEXT = function () {
  try { if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel(); } catch (e) { }
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
  clearTimer(); hideInfo();
  if (mode === 'fill') newFill(); else newGuess();
};
