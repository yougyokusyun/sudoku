var DATA=RIDDLES.map(function(s){var i=s.indexOf('|');return{face:s.slice(0,i),ans:s.slice(i+1)};});
var ALLANS=(function(){var m={},r=[];DATA.forEach(function(d){if(d.ans&&!m[d.ans]){m[d.ans]=1;r.push(d.ans);}});return r;})();

var cur=-1,curAns='',locked=false,wrong=0,hintLv=0,score=0,streak=0,best=0;
var $=function(id){return document.getElementById(id);};
var riddleEl=$('riddle'),choicesEl=$('choices'),feedbackEl=$('feedback'),hintEl=$('hint'),hintBtn=$('hintBtn');

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function feedback(text,good){feedbackEl.className='feedback '+(good?'ok':'bad');feedbackEl.textContent=text;}
function replay(node,cls){node.classList.remove('pop','shake');void node.offsetWidth;node.classList.add(cls);}
function updateStats(){
  $('stat-score').textContent='✅ 答对 '+score;
  $('stat-streak').textContent='🔥 连对 '+streak;
  $('stat-best').textContent='🏆 最佳连对 '+best;
}
function saveBest(){try{localStorage.setItem('priddle.best',String(best));}catch(e){}}
function loadBest(){var v=0;try{v=parseInt(localStorage.getItem('priddle.best')||'0',10)||0;}catch(e){v=0;}return v;}

function makeOptions(ans){
  var pool=shuffle(ALLANS.filter(function(x){return x!==ans;}));
  var out=[ans],seen={};seen[ans]=1;
  for(var i=0;i<pool.length&&out.length<4;i++){
    if(!seen[pool[i]]){seen[pool[i]]=1;out.push(pool[i]);}
  }
  return shuffle(out);
}

function showHint(){
  if(!curAns)return;
  if(hintLv===0){
    hintEl.textContent='💡 答案有 '+curAns.length+' 个字';
    hintLv=1;
  }else if(hintLv===1){
    hintEl.textContent='💡 第一个字是「'+curAns.charAt(0)+'」';
    hintLv=2;
    hintBtn.disabled=true;
  }
}

function choose(btn,txt,ans){
  if(locked)return;
  if(txt===ans){
    locked=true;
    btn.classList.add('good');
    var all=choicesEl.querySelectorAll('.choice');
    for(var i=0;i<all.length;i++){if(all[i]!==btn)all[i].classList.add('dim');}
    streak++;score++;
    if(streak>best){best=streak;saveBest();}
    updateStats();
    feedback('🎉 猜对啦，答案就是 '+ans,true);
    replay(document.querySelector('.card'),'pop');
    setTimeout(function(){resetRiddle();},1500);
  }else{
    replay(btn,'shake');
    feedback('❌ 再想想～',false);
    wrong++;
    if(wrong>=2&&hintLv<1){showHint();}
  }
}

function resetRiddle(){
  var i=cur;
  if(DATA.length>1){while(i===cur){i=Math.floor(Math.random()*DATA.length);}}
  else{i=0;}
  cur=i;
  var d=DATA[cur];
  curAns=d.ans;
  wrong=0;hintLv=0;locked=false;
  hintBtn.disabled=false;
  hintEl.textContent='';
  feedbackEl.className='feedback';
  feedbackEl.textContent='';
  riddleEl.textContent=d.face;
  choicesEl.innerHTML='';
  makeOptions(d.ans).forEach(function(txt){
    var b=document.createElement('button');
    b.type='button';
    b.className='choice';
    b.textContent=txt;
    b.addEventListener('click',function(){choose(b,txt,d.ans);});
    choicesEl.appendChild(b);
  });
}

function initRiddle(){
  best=loadBest();
  updateStats();
  resetRiddle();
}

hintBtn.addEventListener('click',function(){showHint();});
$('nextBtn').addEventListener('click',function(){streak=0;updateStats();resetRiddle();});
initRiddle();
</script>
