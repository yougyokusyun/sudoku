<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>猜谜语 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;
  overflow-x:hidden;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;min-height:0;}
.prompt{font-size:1.1rem;font-weight:800;text-align:center;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 本游戏样式 */
.stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.chip{background:#fff;border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:800;
  box-shadow:0 3px 10px rgba(36,59,83,.10);white-space:nowrap;}
.card{width:100%;max-width:560px;background:#fff;border-radius:24px;padding:18px 18px;
  box-shadow:0 10px 26px rgba(36,59,83,.14);text-align:center;}
.tip{font-size:.8rem;font-weight:800;color:#7b8ea3;letter-spacing:3px;margin-bottom:8px;}
.riddle{font-size:clamp(1.12rem,4.4vw,1.55rem);font-weight:800;line-height:1.5;overflow-wrap:anywhere;}
.hint{min-height:20px;font-size:.85rem;font-weight:800;color:var(--accent);text-align:center;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px;}
.choice{min-height:54px;border:none;border-radius:16px;background:#fff;color:var(--ink);
  font-family:inherit;font-weight:800;font-size:clamp(1rem,4.2vw,1.3rem);cursor:pointer;
  padding:8px 6px;min-width:0;overflow-wrap:anywhere;box-shadow:0 5px 14px rgba(36,59,83,.12);
  transition:background .18s,color .18s,transform .1s,opacity .18s;}
.choice:active{transform:scale(.97);}
.choice.good{background:var(--ok);color:#fff;}
.choice.dim{opacity:.38;}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn{min-height:46px;min-width:112px;border:none;border-radius:14px;background:#fff;color:var(--ink);
  font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;padding:8px 16px;
  box-shadow:0 4px 12px rgba(36,59,83,.12);}
.btn.primary{background:var(--accent);color:#fff;}
.btn:disabled{opacity:.45;cursor:default;}
@media (max-height:430px){
  .stage{gap:7px;}
  .chip{padding:3px 9px;font-size:.72rem;}
  .card{padding:8px 12px;border-radius:16px;}
  .tip{font-size:.68rem;margin-bottom:2px;letter-spacing:2px;}
  .riddle{font-size:clamp(.95rem,2.6vh,1.08rem);line-height:1.35;}
  .hint{min-height:16px;font-size:.74rem;}
  .choices{gap:7px;max-width:440px;}
  .choice{min-height:42px;border-radius:12px;font-size:.95rem;padding:4px 6px;}
  .feedback{min-height:20px;font-size:.92rem;}
  .btn{min-height:40px;min-width:96px;font-size:.8rem;padding:4px 12px;border-radius:12px;}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png"><script src="../voice.js"></script>
<script src="../sound.js"></script>
</head>
<body>
<header>
  <h1>🧩 猜谜语</h1>
  <div class="stats">
    <span class="chip">✅ 答对 <b id="stat-score">0</b></span>
    <span class="chip">🔥 连对 <b id="stat-streak">0</b></span>
    <span class="chip">🏆 最佳连对 <b id="stat-best">0</b></span>
  </div>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <div class="card">
    <div class="tip">猜猜是什么？</div>
    <div class="riddle" id="riddle"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="btn" id="hintBtn" type="button">💡 提示</button>
    <button class="btn primary" id="nextBtn" type="button">🔄 换一题</button>
  </div>
</div>
<script>
var DATA=[],ALLANS=[];
function setPool(list){
  DATA=list.map(function(x){return{face:x.face,ans:x.ans};});
  var m={};ALLANS=[];
  DATA.forEach(function(d){if(d.ans&&!m[d.ans]){m[d.ans]=1;ALLANS.push(d.ans);}});
}

var cur=-1,curAns='',locked=false,wrong=0,hintLv=0,score=0,streak=0,best=0;
var $=function(id){return document.getElementById(id);};
var riddleEl=$('riddle'),choicesEl=$('choices'),feedbackEl=$('feedback'),hintEl=$('hint'),hintBtn=$('hintBtn');

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function feedback(text,good){feedbackEl.className='feedback '+(good?'ok':'bad');feedbackEl.textContent=text;}
function replay(node,cls){node.classList.remove('pop','shake');void node.offsetWidth;node.classList.add(cls);}
function updateStats(){
  $('stat-score').textContent=score;
  $('stat-streak').textContent=streak;
  $('stat-best').textContent=best;
}
function saveBest(){try{localStorage.setItem('priddle.best',String(best));}catch(e){}}
function loadBest(){var v=0;try{v=parseInt(localStorage.getItem('priddle.best')||'0',10)||0;}catch(e){v=0;}return v;}

function makeOptions(ans){
  var pool=shuffle(ALLANS.filter(function(x){return x!==ans;}));
  var out=[ans],seen={};seen[ans]=1;
  for(var i=0;i<pool.length&&out.length<4;i++){
    if(!seen[pool[i]]){seen[pool[i]]=1;out.push(pool[i]);}
  }
  return shuffle(out);
}

function showHint(){
  if(!curAns)return;
  if(hintLv===0){
    hintEl.textContent='💡 答案有 '+curAns.length+' 个字';
    hintLv=1;
  }else if(hintLv===1){
    hintEl.textContent='💡 第一个字是「'+curAns.charAt(0)+'」';
    hintLv=2;
    hintBtn.disabled=true;
  }
}

function choose(btn,txt,ans){
  if(locked)return;
  if(txt===ans){
    locked=true;
    btn.classList.add('good');
    var all=choicesEl.querySelectorAll('.choice');
    for(var i=0;i<all.length;i++){if(all[i]!==btn)all[i].classList.add('dim');}
    streak++;score++;
    if(streak>best){best=streak;saveBest();}
    updateStats();
    feedback('🎉 猜对啦，答案就是 '+ans,true);
    replay(document.querySelector('.card'),'pop');
    setTimeout(function(){resetRiddle();},1500);
  }else{
    replay(btn,'shake');
    feedback('❌ 再想想～',false);
    wrong++;
    if(wrong>=2&&hintLv<1){showHint();}
  }
}

function resetRiddle(){
  if(!DATA.length)return;
  var i=cur;
  if(DATA.length>1){while(i===cur){i=Math.floor(Math.random()*DATA.length);}}
  else{i=0;}
  cur=i;
  var d=DATA[cur];
  curAns=d.ans;
  wrong=0;hintLv=0;locked=false;
  hintBtn.disabled=false;
  hintEl.textContent='';
  feedbackEl.className='feedback';
  feedbackEl.textContent='';
  riddleEl.textContent=d.face;
  choicesEl.innerHTML='';
  makeOptions(d.ans).forEach(function(txt){
    var b=document.createElement('button');
    b.type='button';
    b.className='choice';
    b.textContent=txt;
    b.addEventListener('click',function(){choose(b,txt,d.ans);});
    choicesEl.appendChild(b);
  });
}

hintBtn.addEventListener('click',function(){showHint();});
$('nextBtn').addEventListener('click',function(){streak=0;updateStats();resetRiddle();});
function boot(){
  best=loadBest();
  updateStats();
  resetRiddle();
}
riddleEl.textContent='加载中…';
fetch('../data/riddles.json',{cache:'no-cache'}).then(function(r){
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
}).then(function(d){
  setPool(d.items||[]);
  boot();
}).catch(function(){
  riddleEl.textContent='谜语库加载失败，请通过网站（http）打开本页。';
});

/* 顶栏「下一题」：只重出一题，不判分、不改答对/连对 */
window.XNLY_NEXT = function () {
  try { if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel(); } catch (e) { }
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
  resetRiddle();
};
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
<script src="../homebtn.js"></script>
</body>
</html>
