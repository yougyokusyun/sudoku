<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>规律排序 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.prompt{font-size:1.1rem;font-weight:800;text-align:center;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 每个游戏自行补充样式，但保持上面的变量与动画不变 */
.seq{--d:clamp(56px,8vw,72px);display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:100%;}
.seq.two{max-width:calc(var(--d) * 3 + 32px);}
.dot{width:var(--d);height:var(--d);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.6rem,4.4vw,2.1rem);background:#fff;box-shadow:0 6px 16px rgba(36,59,83,.12);}
.q{border:3px dashed #9fb3c8;color:#8aa0b5;font-weight:900;}
.q.fill{border-style:solid;border-color:var(--ok);animation:flip .5s ease;}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.12)}100%{transform:rotateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 16px rgba(36,59,83,.12);}
  50%{transform:scale(1.16);box-shadow:0 0 0 8px rgba(124,92,255,.22);}}
.pulse{animation:pulse .7s ease both;}
.unit{outline:3px dashed var(--accent);outline-offset:4px;}
.pick{font-size:.95rem;font-weight:800;color:#7d8ea1;}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;}
.opt{width:84px;height:84px;border-radius:50%;background:#fdfbff;border:3px solid rgba(124,92,255,.28);
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;cursor:pointer;
  box-shadow:0 8px 18px rgba(124,92,255,.18);transition:transform .18s ease,border-color .18s ease;}
.opt:active{transform:scale(.95);}
.opt.hit{border-color:var(--ok);}
.opt.miss{border-color:var(--bad);animation:shake .45s ease;box-shadow:0 0 0 5px rgba(255,92,92,.18);}
.tools{display:flex;gap:16px;}
.tbtn{border:0;background:#fff;color:var(--ink);font-weight:800;font-size:.95rem;border-radius:999px;
  padding:12px 22px;min-height:48px;box-shadow:0 3px 10px rgba(36,59,83,.12);cursor:pointer;}
.tbtn:active{transform:scale(.96);}
@media (max-height:430px){
  .stage{gap:8px;}
  .seq.two{max-width:none;}
  .opt{width:80px;height:80px;font-size:2.1rem;}
}
</style>
</head>
<body>
<header>
  <h1>🔴 规律排序</h1>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <!-- 游戏内容 -->
  <div class="prompt">前面是怎么排的？下一个应该是什么？</div>
  <div class="seq" id="seq"></div>
  <div class="pick">👇 选一选，哪个才是下一个？</div>
  <div class="opts" id="opts"></div>
  <div class="feedback" id="feedback"></div>
  <div class="tools"><button class="tbtn" type="button" id="hint">💡 提示</button></div>
</div>
<script>
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function feedback(text,good){var f=document.getElementById('feedback');f.className='feedback '+(good?'ok':'bad');f.textContent=text;}
function replay(node,cls){node.classList.remove('pop','shake');void node.offsetWidth;node.classList.add(cls);}
/* 游戏逻辑 */
var PALETTE=['🔴','🔵','🟡','🟢','🟣'];
var COLOR_NAMES={'🔴':'红色','🔵':'蓝色','🟡':'黄色','🟢':'绿色','🟣':'紫色'};
var PATTERNS=[{base:[0,1]},{base:[0,0,1,1]},{base:[0,1,2]}]; // ABAB / AABB / ABC
var seqBox=document.getElementById('seq');
var optsBox=document.getElementById('opts');
var qcard=null, answer='', unitLen=2;
let locked=false, roundTimer=null, waitTimer=null, pulseTimer=null;

function clearTimers(){clearTimeout(roundTimer);clearTimeout(waitTimer);clearTimeout(pulseTimer);}

/* 出一题 */
function newRound(){
  clearTimers();
  locked=false;
  seqBox.innerHTML=''; optsBox.innerHTML=''; seqBox.className='seq';
  var unit=pick(PATTERNS).base;
  var need=unit.length>=3?3:2;
  var colors=shuffle(PALETTE).slice(0,need);
  unitLen=unit.length;
  var len=5+(Math.random()<0.5?0:1); // 5~6 个位置，最后一个换成问号
  var shown=len-1;
  for(var i=0;i<shown;i++){
    var d=document.createElement('div');
    d.className='dot';
    d.textContent=colors[unit[i%unitLen]];
    seqBox.appendChild(d);
  }
  answer=colors[unit[shown%unitLen]];
  qcard=document.createElement('div');
  qcard.className='dot q';
  qcard.textContent='?';
  seqBox.appendChild(qcard);

  var wrongs=shuffle(PALETTE.filter(function(c){return c!==answer;})).slice(0,2);
  shuffle([answer].concat(wrongs)).forEach(function(c){
    var b=document.createElement('button');
    b.type='button'; b.className='opt'; b.textContent=c;
    b.onclick=function(){choose(b,c);};
    optsBox.appendChild(b);
  });
  if(len===6) seqBox.classList.add('two');
  feedback('', true);
  voiceSpeak('看看前面是怎么排的，下一个是什么？');
}

/* 判断选择 */
function choose(btn,val){
  if(locked) return;
  if(val===answer){
    locked=true;
    btn.classList.add('hit');
    replay(btn,'pop');
    qcard.textContent=answer;
    qcard.classList.add('fill');
    feedback('✅ 规律找到啦！', true);
    voiceSpeak('对啦，是' + (COLOR_NAMES[answer] || ''));
    roundTimer=setTimeout(newRound,1100);
  }else{
    btn.classList.add('miss');
    feedback('看看前面的规律哦', false);
    voiceSpeak('再看看前面的规律');
    waitTimer=setTimeout(function(){btn.classList.remove('miss');},520);
  }
}

/* 提示：波纹脉冲整串，并用虚线框标出一组重复 */
document.getElementById('hint').onclick=function(){
  if(locked) return;
  voiceSpeak('前面是这样一组一组重复的');
  clearTimeout(pulseTimer);
  var dots=seqBox.querySelectorAll('.dot');
  for(var i=0;i<dots.length;i++){
    dots[i].classList.remove('pulse','unit');
    dots[i].style.animationDelay='';
    void dots[i].offsetWidth;
    dots[i].classList.add('pulse');
    dots[i].style.animationDelay=(i*0.16)+'s';
    if(i<unitLen) dots[i].classList.add('unit');
  }
  pulseTimer=setTimeout(function(){
    for(var i=0;i<dots.length;i++){
      dots[i].classList.remove('pulse','unit');
      dots[i].style.animationDelay='';
    }
  },1600);
};

newRound();

/* ===== 语音播报：进入先读玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '规律排序游戏。看看前面是什么颜色、怎么排的，再选出下一个。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进游戏自动朗读；若被浏览器拦截，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  try {
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);   /* 不打断正在读的题目，排队播报玩法 */
  } catch (e) { }
  setTimeout(function () {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
    var once = function () { document.removeEventListener('pointerdown', once); voiceSpeak(VOICE_TEXT); };
    document.addEventListener('pointerdown', once);
  }, 900);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.1);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();
</script>
</body>
</html>
