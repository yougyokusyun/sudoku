<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>反应小游戏 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
.stage-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  width:100%;margin:auto;padding:2px 0;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 本游戏补充样式 */
.hide{display:none!important;}
.pad{width:clamp(240px,68vw,420px);height:clamp(120px,32vh,280px);border-radius:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#fff;font-weight:900;text-align:center;cursor:pointer;touch-action:manipulation;
  box-shadow:0 10px 28px rgba(36,59,83,.16);transition:background .15s ease;}
.pad.gray{background:linear-gradient(160deg,#b7c3d0,#93a3b5);}
.pad.red{background:linear-gradient(160deg,#ff7a7a,#e63946);}
.pad.green{background:linear-gradient(160deg,#5fd67f,#2fb344);}
.pad-msg{font-size:clamp(1.2rem,5vw,1.7rem);}
.pad-sub{font-size:.84rem;opacity:.92;font-weight:700;}
.stat{font-size:1rem;font-weight:800;text-align:center;}
.stat b{color:var(--accent);}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn{border:none;border-radius:16px;padding:10px 18px;font-weight:900;font-size:1.02rem;
  min-height:52px;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(36,59,83,.12);
  cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.32);}
.btn:active{transform:scale(.97);}
@media (max-height:430px){
  .pad{height:104px;width:clamp(200px,58vw,330px);border-radius:18px;}
  .pad-msg{font-size:1rem;}
  .btn{min-height:44px;padding:7px 14px;font-size:.9rem;}
  .stage-inner{gap:6px;padding:0;}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png">
<script src="../voice.js"></script>
<script src="../sound.js"></script>
</head>
<body>
<header>
  <h1>⚡ 反应小游戏</h1>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <div class="stage-inner">
    <div class="pad gray" id="pad">
      <div class="pad-msg" id="padMsg">点下面的开始按钮</div>
      <div class="pad-sub" id="padSub">变绿了再点</div>
    </div>
    <div class="stat">🌟 点到 <b id="okCount">0</b> 次 · 🐣 抢跑 <b id="earlyCount">0</b> 次</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls">
      <button class="btn primary" id="startBtn" type="button">▶️ 开始 / 再来一次</button>
      <button class="btn" id="resetBtn" type="button">🔄 重新开始</button>
    </div>
  </div>
</div>
<script>
/* v16：去掉计时与名次，只练「等一等、变绿再点」，不给孩子时间压力 */
var state = 'idle';
var okCount = 0, earlyCount = 0;
var waitTimer = null;
var feedbackEl = document.getElementById('feedback');
var pad = document.getElementById('pad');
var padMsg = document.getElementById('padMsg');
var padSub = document.getElementById('padSub');

function feedback(text, good) {
  feedbackEl.className = 'feedback ' + (good ? 'ok' : 'bad');
  feedbackEl.textContent = text;
}
function clearFeedback() { feedbackEl.className = 'feedback'; feedbackEl.textContent = ''; }
function replay(node, cls) {
  node.classList.remove('pop', 'shake');
  void node.offsetWidth;
  node.classList.add(cls);
}
function setPad(cls, msg, sub) {
  pad.className = 'pad ' + cls;
  padMsg.textContent = msg;
  if (typeof sub === 'string') padSub.textContent = sub;
}
function renderCounts() {
  document.getElementById('okCount').textContent = okCount;
  document.getElementById('earlyCount').textContent = earlyCount;
}
function say(t) { if (window.XNLY) XNLY.voice.speak(t); }
function clearTimers() { clearTimeout(waitTimer); waitTimer = null; }

function beginWait() {
  state = 'waiting';
  setPad('red', '等一等，先不要点', '变绿了再点');
  clearFeedback();
  say('等一等，变绿了再点。');
  waitTimer = setTimeout(goGreen, 900 + Math.random() * 2600);
}
function goGreen() {
  if (state !== 'waiting') return;
  state = 'ready';
  setPad('green', '快点这里！', '');
  replay(pad, 'pop');
  say('点！');
}
function onPadDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (state === 'waiting') {
    clearTimers();
    state = 'cooldown';
    earlyCount++;
    renderCounts();
    setPad('red', '太早了', '再等一等');
    replay(pad, 'shake');
    feedback('❌ 还没变绿呢，等一等', false);
    if (window.XNLY) XNLY.mark('wrong');
    waitTimer = setTimeout(beginWait, 1400);
    return;
  }
  if (state === 'ready') {
    state = 'cooldown';
    okCount++;
    renderCounts();
    setPad('green', '点到啦！', '');
    replay(pad, 'pop');
    feedback('✅ 点到啦，真棒！', true);
    if (window.XNLY) XNLY.mark('right');
    say('点到啦！');
    waitTimer = setTimeout(beginWait, 1300);
  }
}
function startRound() {
  clearTimers();
  okCount = 0; earlyCount = 0;
  renderCounts();
  clearFeedback();
  beginWait();
}
function resetAll() {
  clearTimers();
  state = 'idle';
  okCount = 0; earlyCount = 0;
  renderCounts();
  setPad('gray', '点下面的开始按钮', '变绿了再点');
  clearFeedback();
  say('点开始，等它变绿了再点。');
}

function initReaction() {
  pad.addEventListener('pointerdown', onPadDown);
  document.getElementById('startBtn').addEventListener('click', startRound);
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  renderCounts();
  resetAll();
}

initReaction();

/* ===== 语音：进入先读玩法，右上角 🔊 可重听 ===== */
var VOICE_TEXT = '反应小游戏。看到红色就等一等，变成绿色再点一下。只数点到几次，不计时间。';
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.10);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { say(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) h.appendChild(b);
})();
setTimeout(function () {
  var s = window.speechSynthesis;
  if (s && (s.speaking || s.pending)) return;
  var once = function () { document.removeEventListener('pointerdown', once); say(VOICE_TEXT); };
  document.addEventListener('pointerdown', once);
}, 900);
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
<script src="../homebtn.js"></script>
</body>
</html>
