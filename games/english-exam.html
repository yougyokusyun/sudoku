<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#00897b;--line:rgba(36,59,83,.10);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#e6f7f4,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#fff3e8,transparent 55%),
             linear-gradient(160deg,#f7fcfb,#fffaf5);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;padding:7px 14px;font-weight:800;font-size:.85rem;
  box-shadow:0 3px 10px rgba(36,59,83,.10);}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-family:inherit;font-size:.74rem;font-weight:800;color:#6b7f95;box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tchip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-family:inherit;font-size:.75rem;font-weight:800;color:#4a6076;cursor:pointer;
  box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.tchip.on{background:linear-gradient(135deg,#00897b,#00695c);color:#fff;border-color:transparent;}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:0;overflow-y:auto;width:100%;}
.prompt{font-size:1rem;font-weight:800;text-align:center;color:#4a6076;line-height:1.5;}
.prompt span{display:block;font-size:.76rem;font-weight:700;color:#8aa0b8;margin-top:2px;}
.stem{width:min(560px,100%);background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:12px 14px;font-size:1.05rem;font-weight:800;color:var(--ink);line-height:1.6;
  box-shadow:0 5px 14px rgba(36,59,83,.08);text-align:left;}
.passage{display:none;width:min(560px,100%);background:#f2fbf9;border:2px solid rgba(0,137,123,.18);
  border-radius:16px;padding:12px 14px;font-size:.92rem;font-weight:700;color:#2f4a63;
  line-height:1.7;text-align:left;box-shadow:0 5px 14px rgba(36,59,83,.06);}
.passage.show{display:block;}
.passage .lab{display:block;font-size:.7rem;font-weight:900;color:#8aa0b8;margin-bottom:4px;}
.mainpic{display:none;width:min(280px,64%);background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:8px;box-shadow:0 5px 14px rgba(36,59,83,.08);}
.mainpic.show{display:block;}
.mainpic svg{display:block;width:100%;height:auto;}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(560px,100%);}
.opts.one{grid-template-columns:minmax(0,1fr);}
.opt{position:relative;min-height:52px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px 12px;
  font-family:inherit;font-size:1rem;font-weight:900;color:var(--ink);cursor:pointer;
  box-shadow:0 5px 14px rgba(36,59,83,.08);transition:transform .14s,border-color .18s,background .18s;}
.opt:active{transform:scale(.97);}
.opt .tag{position:absolute;top:6px;left:8px;font-size:.66rem;font-weight:900;color:#8aa0b8;z-index:1;}
.opt .txt{display:block;padding:4px 6px 2px 22px;line-height:1.45;text-align:left;}
.opt.la{padding:10px 12px 8px;}
.opt.la .txt{display:none;}
.opt svg{display:block;width:100%;height:auto;max-height:130px;}
.opt.sel{border-color:#ff9800;background:#fff7e6;}
.opt.good{border-color:var(--ok);background:#e9fbee;color:#1b7c33;}
.opt.bad{border-color:var(--bad);background:#ffeded;color:#b02a2a;}
.opt[disabled]{opacity:.55;cursor:default;}
.reveal{display:none;flex-direction:column;gap:6px;width:min(560px,100%);text-align:left;
  background:#fff;border:2px solid rgba(0,137,123,.25);border-radius:16px;padding:12px 14px;
  box-shadow:0 6px 16px rgba(36,59,83,.08);}
.reveal.show{display:flex;}
.reveal .row{font-size:.92rem;font-weight:700;color:#2f4a63;line-height:1.5;white-space:pre-line;}
.reveal .ans{font-size:.9rem;font-weight:900;}
.reveal .ans.good{color:var(--ok);} .reveal .ans.bad{color:var(--bad);}
.btns{display:flex;gap:8px;justify-content:center;margin-top:4px;flex-wrap:wrap;}
.btnr{min-height:42px;padding:0 16px;border-radius:999px;border:2px solid rgba(0,137,123,.3);
  background:#fff;color:#00796b;font-family:inherit;font-weight:900;font-size:.9rem;cursor:pointer;}
.btnr.pri{background:linear-gradient(135deg,#00897b,#00695c);color:#fff;border-color:transparent;}
.feedback{min-height:28px;font-size:1rem;font-weight:800;text-align:center;line-height:1.45;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
.sheetwrap{display:none;flex-direction:column;gap:8px;width:min(560px,100%);}
.sheetwrap.show{display:flex;}
.sheet{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0;
  font-family:inherit;font-size:.68rem;font-weight:800;color:#4a6076;cursor:pointer;}
.cell.done{background:var(--accent);color:#fff;border-color:transparent;}
.cell.cur{outline:2px solid #ff9800;outline-offset:-2px;}
.submit{min-height:44px;padding:0 20px;border-radius:999px;border:none;
  background:linear-gradient(135deg,#ff9800,#f57c00);color:#fff;font-family:inherit;
  font-weight:900;font-size:.95rem;cursor:pointer;box-shadow:0 5px 14px rgba(245,124,0,.25);}
.summary{display:none;flex-direction:column;align-items:center;gap:8px;width:min(560px,100%);
  background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;text-align:center;
  box-shadow:0 8px 22px rgba(36,59,83,.10);}
.summary.show{display:flex;}
.score{font-size:2.7rem;font-weight:900;color:var(--accent);line-height:1.1;}
.passline{font-size:1rem;font-weight:900;}
.passline.yes{color:var(--ok);} .passline.no{color:#b02a2a;}
.sumtitle{font-size:1.05rem;font-weight:900;}
.sumline{font-size:.95rem;font-weight:800;color:#2f4a63;}
.sumline b{color:var(--accent);font-size:1.1rem;}
.secstats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.secpill{background:#f2fbf9;border:1px solid rgba(0,137,123,.2);border-radius:999px;
  padding:4px 10px;font-size:.76rem;font-weight:800;color:#2f4a63;}
.secpill b{color:var(--accent);}
.detail{width:100%;max-height:38vh;overflow-y:auto;text-align:left;border-top:1px dashed var(--line);padding-top:8px;}
.drow{padding:6px 2px;border-bottom:1px dashed var(--line);font-size:.82rem;line-height:1.5;}
.drow .no{font-weight:900;color:#8aa0b8;margin-right:4px;}
.drow .mark{font-weight:900;margin-right:4px;}
.drow .dzh{color:#7b8ea8;font-weight:700;}
.sumagain{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid rgba(0,137,123,.3);
  background:#fff;color:#00796b;font-family:inherit;font-weight:900;font-size:.9rem;cursor:pointer;}
.sumagain.pri{background:linear-gradient(135deg,#00897b,#00695c);color:#fff;border-color:transparent;}
.hint{font-size:.72rem;font-weight:700;color:#93a7bd;text-align:center;line-height:1.4;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){
  body{padding:8px;gap:6px;}
  h1{font-size:1rem;}
  .stage{gap:8px;}
  .opt{min-height:44px;}
  .opt svg{max-height:100px;}
}

  if (BYSEC[q.g] && BYSEC[q.g][q.c]) BYSEC[q.g][q.c].push(i);
});

var PASS_LINE = 80;
var KEY = 'xnly.exam.v2';
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function load() { try { return JSON.parse(safeGet(KEY)) || null; } catch (e) { return null; } }
function fresh() { return { best: { 3: 0, 4: 0 }, passes: { 3: 0, 4: 0 } }; }
var DB = load() || fresh();
function save() { safeSet(KEY, JSON.stringify(DB)); }

var UI = { mode: 'exam', grade: 3, s: null, cur: null, answered: false, submitted: false, freeRight: 0 };
var elPrompt = document.getElementById('prompt');
var elPassage = document.getElementById('passage');
var elMain = document.getElementById('mainpic');
var elStem = document.getElementById('stem');
var elOpts = document.getElementById('opts');
var elReveal = document.getElementById('reveal');
var elFb = document.getElementById('feedback');
var elSum = document.getElementById('summary');
var elSheet = document.getElementById('sheet');
var elSheetWrap = document.getElementById('sheetwrap');
var elSubmit = document.getElementById('submit');
var elBest = document.getElementById('bestN');
var elPassN = document.getElementById('passN');
var elModeBar = document.getElementById('modeBar');
var elGradeBar = document.getElementById('gradeBar');
var elPlay = document.getElementById('playbar');
var elPlayHint = document.getElementById('playhint');
var elNav = document.getElementById('navbar');
var elPrev = document.getElementById('btnPrev');
var elNextQ = document.getElementById('btnNextQ');

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function secOf(k) { for (var i = 0; i < SEC_DEF.length; i++) if (SEC_DEF[i].k === k) return SEC_DEF[i]; return SEC_DEF[0]; }
function updateChips() {
  var b = DB.best[UI.grade] || 0, p = DB.passes[UI.grade] || 0;
  elBest.textContent = b > 0 ? b : '–';
  elPassN.textContent = p;
}
function hideAll() {
  elSum.classList.remove('show'); elSum.innerHTML = '';
  elReveal.classList.remove('show'); elReveal.innerHTML = '';
  elSheetWrap.classList.remove('show');
  elMain.classList.remove('show'); elMain.innerHTML = '';
  elPassage.classList.remove('show'); elPassage.innerHTML = '';
  elStem.style.display = 'none'; elStem.innerHTML = '';
  elPlay.style.display = 'none';
  elFb.innerHTML = ''; elFb.className = 'feedback';
}

function buildPaper() {
  var ids = [];
  SEC_DEF.forEach(function (d) {
    var pool = (BYSEC[UI.grade][d.k] || []).slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    /* 同一张卷内不出现重复题（题库存在同题干不同选项的变体）；
       看图选词（pic）题干相同但图不同，按 题干#图id 去重 */
    var taken = {}, picked = [];
    for (var i = 0; i < pool.length && picked.length < d.np; i++) {
      var qq = Q[pool[i]];
      var dk = qq.s + (qq.pic ? '#' + qq.pic : '');
      if (taken[dk]) continue;
      taken[dk] = 1;
      picked.push(pool[i]);
    }
    ids = ids.concat(picked);
  });
  return ids;
}

var LISTEN_END = 0;        /* 听力题在前 15 题，之后是笔试区 */
function isListenAt(i) {
  var s = UI.s;
  if (!s || i < 0 || i >= s.ids.length) return false;
  return !!secOf(Q[s.ids[i]].c).listen;
}
function startSession(kind) {
  UI.mode = kind; UI.submitted = false; UI.answered = false; UI.freeRight = 0;
  UI.s = { kind: kind, ids: buildPaper(), idx: -1, answers: {}, t0: Date.now() };
  LISTEN_END = 0;
  while (LISTEN_END < UI.s.ids.length && secOf(Q[UI.s.ids[LISTEN_END]].c).listen) LISTEN_END++;
  /* 换模式/重开考：先把题号表与导航条收起来 */
  elSheetWrap.classList.remove('show');
  elNav.style.display = 'none';
  buildModeBar();
  nextQ();
}

var pendNext = null;
function clearPend() { if (pendNext) { clearTimeout(pendNext); pendNext = null; } }
function nextSoon(ms) {
  clearPend();
  pendNext = setTimeout(function () { pendNext = null; nextQ(); }, ms);
}

function nextQ() {
  clearPend();
  audSeq++;
  if (window.XNLYSay) XNLYSay.stop();
  var s = UI.s;
  s.idx++;
  if (s.idx >= s.ids.length) {
    if (s.kind === 'exam') submitExam(true); else finishFree();
    return;
  }
  hideAll();
  elOpts.style.display = '';
  UI.answered = false;
  renderQ(s.idx, s.kind === 'exam' ? '第 ' + (s.idx + 1) + '/' + s.ids.length + ' 题 · ' + secOf(Q[s.ids[s.idx]].c).pt + ' 分' : '');
  if (s.kind === 'exam' && !UI.submitted) syncExamChrome();
}

/* 考试中：听力区不显示答题卡与题号，也不能回退；笔试区显示答题卡（只读）+ 上一题/下一题 */
function syncExamChrome() {
  var s = UI.s;
  var listening = isListenAt(s.idx);
  var written = !listening;
  elSheetWrap.classList.toggle('show', written);
  elNav.style.display = written ? 'flex' : 'none';
  if (written) { buildSheet(); updateNav(); }
  if (elPlayHint) {
    elPlayHint.textContent = listening
      ? '🎧 考试听力自动播 2 遍，不能重听、不能回退'
      : '🔊 点右上角 🔊 可重听';
  }
}
function updateNav() {
  var s = UI.s;
  if (!s) return;
  elPrev.disabled = s.idx <= LISTEN_END;          /* 不允许回退到听力 */
  elNextQ.disabled = s.idx >= s.ids.length - 1;
  elPrev.style.opacity = elPrev.disabled ? .45 : 1;
  elNextQ.style.opacity = elNextQ.disabled ? .45 : 1;
}

function renderQ(pos, extra) {
  var s = UI.s;
  var q = UI.cur = Q[s.ids[pos]];
  var d = secOf(q.c);
  var listening = !!d.listen;
  if (listening) elPlay.style.display = 'flex';
  elPrompt.innerHTML = esc(d.n + ' · ' + d.sub) + '<span>' + (extra || '第 ' + (pos + 1) + ' 题') + '</span>';
  /* 阅读理解：显示短文 */
  if (q.p && PASSAGES[q.p]) {
    elPassage.innerHTML = '<span class="lab">📖 短文</span>' + esc(PASSAGES[q.p].t) +
      '<span class="lab" style="margin-top:6px">🀄 译文</span>' + esc(PASSAGES[q.p].z);
    elPassage.classList.add('show');
  }
  if (q.pic && PICS[q.pic]) { elMain.innerHTML = PICS[q.pic]; elMain.classList.add('show'); }
  /* 听音选图：选项是 4 张插画 */
  var labels = ['A', 'B', 'C', 'D'];
  if (q.c === 'la') {
    elOpts.className = 'opts';
    elOpts.innerHTML = '';
    q.o.forEach(function (pid, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt la';
      b.innerHTML = '<span class="tag">' + labels[i] + '</span>' + (PICS[pid] || '');
      b.dataset.i = i;
      b.addEventListener('click', function () {
        if (UI.submitted) return;
        if (s.kind === 'exam') selectOpt(i, b); else answerOpt(i, b);
      });
      elOpts.appendChild(b);
    });
  } else {
    /* 题干：对话/判断/连词成句放在白色题干框里，选择类直接在选项上方 */
    var hasStemBox = q.c === 'dialogue' || q.c === 'order';
    if (hasStemBox) {
      elStem.innerHTML = esc(q.s);
      elStem.style.display = 'block';
    }
    elOpts.className = 'opts' + (q.c === 'tf' ? ' one' : '');
    elOpts.innerHTML = '';
    q.o.forEach(function (t, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.innerHTML = '<span class="txt">' + esc(t) + '</span>';
      b.dataset.i = i;
      b.addEventListener('click', function () {
        if (UI.submitted) return;
        if (s.kind === 'exam') selectOpt(i, b); else answerOpt(i, b);
      });
      elOpts.appendChild(b);
    });
    if (!hasStemBox && !listening && q.c !== 'read' && q.c !== 'pic') {
      elPrompt.innerHTML = esc(d.n + ' · ' + q.s) + '<span>' + (extra || '第 ' + (pos + 1) + ' 题') + '</span>';
    }
  }
  /* 听力题自动播放 */
  if (listening) speakQ();
}

function buildSheet() {
  var s = UI.s;
  elSheet.innerHTML = '';
  s.ids.forEach(function (_, i) {
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'cell' + (s.answers[i] !== undefined ? ' done' : '') + (i === s.idx ? ' cur' : '');
    c.textContent = i + 1;
    elSheet.appendChild(c);
  });
}

function renderExamIdx(i) {
  clearPend();
  audSeq++;
  if (window.XNLYSay) XNLYSay.stop();
  var s = UI.s;
  hideAll();
  UI.answered = false;
  s.idx = i;
  renderQ(i, '第 ' + (i + 1) + '/' + s.ids.length + ' 题 · 可改选');
  if (s.kind === 'exam' && !UI.submitted) syncExamChrome();
}

function selectOpt(i, btn) {
  var s = UI.s;
  s.answers[s.idx] = i;
  Array.prototype.forEach.call(elOpts.children, function (b) { b.classList.remove('sel'); });
  btn.classList.add('sel', 'pop');
  Array.prototype.forEach.call(elSheet.children, function (c, k) {
    c.classList.toggle('done', s.answers[k] !== undefined);
  });
  if (s.idx < s.ids.length - 1) nextSoon(550);
}

function srcText(q) {
  if (q.c === 'lc') return String(q.d).replace(/\n/g, ' / ') + '　问：' + q.s;
  if (q.c === 'la' || q.c === 'lb') return q.d || q.s;
  return '';
}

function answerOpt(i, btn) {
  if (UI.answered) return;
  UI.answered = true;
  var q = UI.cur, s = UI.s;
  var d = secOf(q.c);
  var right = i === q.a;
  if (right) UI.freeRight++;
  Array.prototype.forEach.call(elOpts.children, function (b, k) {
    if (k === q.a) b.classList.add('good');
    if (k !== i) b.disabled = true;
  });
  if (right) { btn.classList.add('good', 'pop'); } else { btn.classList.add('bad', 'shake'); }
  var labels = ['A', 'B', 'C', 'D'];
  elFb.className = 'feedback ' + (right ? 'ok' : 'bad');
  elFb.innerHTML = right ? '✅ 答对了！' : '❌ 正确答案是 ' + labels[q.a];
  var src = d.listen ? '<div class="row">🔊 原文：' + esc(srcText(q)) + '</div>' : '';
  var rows =
    '<div class="row ans ' + (right ? 'good' : 'bad') + '">' + (right ? '✅ 你选对了（' + labels[q.a] + '）' : '正确答案：' + labels[q.a]) + '</div>' +
    src +
    '<div class="row">💡 ' + esc(q.z) + '</div>' +
    '<div class="btns"><button class="btnr pri" id="btnNext" type="button">下一题 →</button></div>';
  elReveal.innerHTML = rows;
  elReveal.classList.add('show');
  document.getElementById('btnNext').addEventListener('click', function () {
    clearPend();
    if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel();
    nextQ();
  });
  if (right) nextSoon(1100);
}

function finishFree() {
  hideAll();
  elOpts.style.display = 'none';
  var s = UI.s;
  var n = s.ids.length, r = UI.freeRight;
  elSum.innerHTML =
    '<div class="sumtitle">👏 本轮练习完成</div>' +
    '<div class="score">' + r + '<small style="font-size:1.2rem;color:#8aa0b8"> / ' + n + '</small></div>' +
    '<div class="sumline">答对 <b>' + r + '</b> / ' + n + ' · 想拿分数就去「过关考试」</div>' +
    '<div class="btns"><button class="sumagain pri" id="sumAgain" type="button">🔁 再来一组</button>' +
    '<button class="sumagain" id="sumExam" type="button">📝 去考试</button></div>';
  elSum.classList.add('show');
  elPrompt.innerHTML = '📖 自由练习结束<span>错过的解析都在前面，可以往上翻</span>';
  document.getElementById('sumAgain').addEventListener('click', function () { elOpts.style.display = ''; startSession('free'); });
  document.getElementById('sumExam').addEventListener('click', function () { elOpts.style.display = ''; startSession('exam'); });
}

function submitExam(auto) {
  var s = UI.s;
  if (UI.submitted) return;
  if (!auto) {
    var un = s.ids.filter(function (_, i) { return s.answers[i] === undefined; }).length;
    if (un > 0 && !window.confirm('还有 ' + un + ' 题没作答，确定交卷批改吗？')) return;
  }
  UI.submitted = true;
  hideAll();
  elOpts.style.display = 'none';
  elSheetWrap.classList.remove('show');
  /* 批改 */
  var score = 0, secStat = {}, rows = '';
  SEC_DEF.forEach(function (d) { secStat[d.k] = { r: 0, n: 0 }; });
  var labels = ['A', 'B', 'C', 'D'];
  s.ids.forEach(function (id, i) {
    var q = Q[id], a = s.answers[i], ok = a === q.a;
    var d = secOf(q.c);
    secStat[q.c].n++;
    if (ok) { secStat[q.c].r++; score += d.pt; }
    var p = q.p && PASSAGES[q.p] ? '<br><span class="dzh">📖 ' + esc(PASSAGES[q.p].t) + '</span>' : '';
    if (d.listen) p += '<br><span class="dzh">🔊 原文：' + esc(srcText(q)) + '</span>';
    rows += '<div class="drow"><span class="no">' + (i + 1) + '.</span><span class="mark">' + (ok ? '✅' : '❌') + '</span>' +
      (d.listen ? '' : esc(q.s)) + p + '<br>' +
      (ok ? '' : '你的答案：' + (a === undefined ? '未作答' : (q.c === 'la' ? labels[a] : esc(q.o[a]))) + ' · ') +
      '正确答案：' + (q.c === 'la' ? labels[q.a] : esc(q.o[q.a])) + '<br><span class="dzh">💡 ' + esc(q.z) + '</span></div>';
  });
  var passed = score >= PASS_LINE;
  if (score > (DB.best[UI.grade] || 0)) { DB.best[UI.grade] = score; }
  if (passed) { DB.passes[UI.grade] = (DB.passes[UI.grade] || 0) + 1; }
  save();
  updateChips();
  var secs = Math.round((Date.now() - s.t0) / 1000);
  var pills = SEC_DEF.map(function (d) {
    var st = secStat[d.k];
    return '<span class="secpill">' + d.n + ' <b>' + st.r + '</b>/' + st.n + '</span>';
  }).join('');
  var gname = UI.grade === 3 ? '三年级' : '四年级';
  elSum.innerHTML =
    '<div class="sumtitle">📝 ' + gname + '过关考试批改 · ' + s.ids.length + ' 题 · 满分 100</div>' +
    '<div class="score">' + score + '</div>' +
    '<div class="passline ' + (passed ? 'yes' : 'no') + '">' + (passed ? '🎉 过关！达到 ' + PASS_LINE + ' 分标准' : '还差 ' + (PASS_LINE - score) + ' 分过关，再接再厉！') + '</div>' +
    '<div class="secstats">' + pills + '</div>' +
    '<div class="sumline">用时 <b>' + Math.floor(secs / 60) + ' 分 ' + (secs % 60) + ' 秒</b> · ' + gname + '最佳 <b>' + (DB.best[UI.grade] || 0) + '</b> · 累计过关 <b>' + (DB.passes[UI.grade] || 0) + '</b> 次</div>' +
    '<div class="detail">' + rows + '</div>' +
    '<div class="btns"><button class="sumagain pri" id="examAgain" type="button">🔁 再考一次</button>' +
    '<button class="sumagain" id="examFree" type="button">📖 自由练习</button></div>';
  elSum.classList.add('show');
  elPrompt.innerHTML = '✏️ 批改完成<span>' + (passed ? '恭喜过关！错题解析在下面，往上翻看' : '看看错题的解析，再来一次') + '</span>';
  document.getElementById('examAgain').addEventListener('click', function () { elOpts.style.display = ''; startSession('exam'); });
  document.getElementById('examFree').addEventListener('click', function () { elOpts.style.display = ''; startSession('free'); });
}

function buildModeBar() {
  elModeBar.innerHTML = '';
  var list = [
    { m: 'exam', n: '📝 过关考试 50 题 · 满分 100' },
    { m: 'free', n: '📖 自由练习' }];
  list.forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (UI.mode === o.m ? ' on' : '');
    b.textContent = o.n;
    b.addEventListener('click', function () {
      if (UI.mode === o.m) return;
      clearPend();
      try { if (window.XNLYSay) XNLYSay.stop(); } catch (e) { }
      if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel();
      startSession(o.m);
    });
    elModeBar.appendChild(b);
  });
}

function buildGradeBar() {
  elGradeBar.innerHTML = '';
  GRADES.forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (UI.grade === o.g ? ' on' : '');
    b.textContent = o.n + '卷';
    b.addEventListener('click', function () {
      if (UI.grade === o.g) return;
      clearPend();
      try { if (window.XNLYSay) XNLYSay.stop(); } catch (e) { }
      if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel();
      UI.grade = o.g;
      buildGradeBar();
      updateChips();
      startSession(UI.mode);
    });
    elGradeBar.appendChild(b);
  });
}

function audioTextOf(q) {
  if (!q) return '';
  if (q.c === 'lc') return (q.d || '') + '\nQuestion: ' + (q.s || '');
  if (q.c === 'la' || q.c === 'lb') return q.d || q.s || '';
  return '';
}

/* 连播 n 遍；换题/交卷时 audSeq 自增，旧序列自动作废 */
var audSeq = 0;
function playTimes(text, times, rateFallback) {
  var my = ++audSeq;
  var n = 0;
  function once() {
    if (my !== audSeq || n >= times) return;
    n++;
    var nxt = function () {
      if (my !== audSeq) return;
      setTimeout(function () { if (my === audSeq) once(); }, 450);
    };
    if (window.XNLYSay) { XNLYSay.play(text, { rate: 1, onend: nxt }); return; }
    if (window.XNLY && XNLY.voice) {
      XNLY.voice.speak(text.replace(/^[AB]:\s*/gm, '').replace(/[—]/g, ', '), {
        lang: 'en-US', rate: rateFallback
      });
    }
    setTimeout(nxt, 4000);
  }
  once();
}

function speakQ() {
  if (!UI.cur) return;
  var q = UI.cur;
  var text = audioTextOf(q);
  if (!text) {
    /* 非听力题（判断/阅读/连词成句等）题干是中文，继续用系统语音 */
    if (window.XNLY && XNLY.voice) XNLY.voice.speak(String(q.s || ''), { lang: 'zh-CN' });
    return;
  }
  var examListen = (UI.mode === 'exam' && !UI.submitted && !!secOf(q.c).listen);
  playTimes(text, examListen ? 2 : 1, q.g === 3 ? 0.8 : 0.85);
}

/* 顶栏 🔊：考试听力期间不允许重听 */
window.replayCurrent = function () {
  if (UI.mode === 'exam' && !UI.submitted && UI.cur && secOf(UI.cur.c).listen) {
    elFb.className = 'feedback bad';
    elFb.innerHTML = '⛔ 考试听力每题只播 2 遍，不能重听';
    setTimeout(function () {
      if (elFb.innerHTML.indexOf('⛔') === 0) { elFb.innerHTML = ''; elFb.className = 'feedback'; }
    }, 1800);
    return;
  }
  speakQ();
};

window.XNLY_NEXT = function () {
  clearPend();
  try { if (window.XNLYSay) XNLYSay.stop(); } catch (e) { }
  try { if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel(); } catch (e) { }
  var s = UI.s;
  if (!s) return;
  if (s.kind === 'exam' && !UI.submitted) {
    if (s.idx + 1 < s.ids.length) renderExamIdx(s.idx + 1);
    return;
  }
  nextQ();
};

elPrev.addEventListener('click', function () {
  var s = UI.s;
  if (!s || UI.submitted || UI.mode !== 'exam') return;
  if (s.idx - 1 >= LISTEN_END) renderExamIdx(s.idx - 1);
});
elNextQ.addEventListener('click', function () {
  var s = UI.s;
  if (!s || UI.submitted || UI.mode !== 'exam') return;
  if (s.idx + 1 < s.ids.length) renderExamIdx(s.idx + 1);
});
elSubmit.addEventListener('click', function () { submitExam(false); });

(function init() {
  buildGradeBar();
  buildModeBar();
  updateChips();
  startSession('exam');
  var firstTap = false;
  document.addEventListener('pointerdown', function () {
    if (firstTap) return;
    firstTap = true;
    if (window.XNLYSay) { try { XNLYSay.unlock(); } catch (e) { } }
    if (window.XNLY && XNLY.voice && XNLY.voice.unlock) {
      try { XNLY.voice.unlock(); } catch (e) { }
    }
  }, { passive: true });
})();
</script>

}
</script>
