var lastId = -1;

var elPrompt = document.getElementById('prompt');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');
var elBest = document.getElementById('best');
var elReplay = document.getElementById('replay');
var elBar = document.getElementById('gradeBar');
var elMode = document.getElementById('modeBar');
var elSummary = document.getElementById('summary');

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* 题目池：mode=all 为全部题，mode=detail 只含细节辨图；grade=all 或 3/4/5/6 */
function pool(g, mode) {
  mode = mode || state.mode;
  return ITEMS.filter(function (it) {
    return (mode === 'all' || it.type === 'detail') && (g === 'all' || it.grade === g);
  });
}

function take() {
  var key = state.mode + ':' + state.grade;
  var d = decks[key];
  if (!d) {
    /* 每档一副牌：抽完才重洗，新局开头避开上一局开头 */
    d = decks[key] = XNLY.deck.make(pool(state.grade, state.mode).map(function (it) { return it.id; }),
      'english-listening.' + key, { head: 5 });
  }
  var id = d.next();
  lastId = id;
  return ITEMS[id];
}

function speakEn(t) {
  if (window.XNLY && XNLY.voice) XNLY.voice.speak(t, { lang: 'en-US', rate: 0.9 });
}
function speakZh(t) {
  if (window.XNLY && XNLY.voice) XNLY.voice.speak(t, { lang: 'zh-CN' });
}

function replayNow() {
  if (state.cur) speakEn(state.cur.audio);
}

function setFb(html, good, sub) {
  elFb.className = 'feedback ' + (good === true ? 'ok' : good === false ? 'bad' : '');
  elFb.innerHTML = html + (sub ? '<small>' + sub + '</small>' : '');
}

function buildBar() {
  if (state.mode === 'detail') { elBar.style.display = 'none'; state.grade = 'all'; return; }
  elBar.style.display = '';
  elBar.innerHTML = '';
  var list = [{ g: 'all', n: '全部' }, { g: 3, n: '3 年级' }, { g: 4, n: '4 年级' },
              { g: 5, n: '5 年级' }, { g: 6, n: '6 年级' }];
  list.forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (state.grade === o.g ? ' on' : '');
    b.textContent = o.n + ' ' + pool(o.g, 'all').length;
    b.addEventListener('click', function () {
      if (state.grade === o.g) return;
      state.grade = o.g;
      state.streak = 0;
      resetSession();
      updateStats();
      buildBar();
      nextQuestion();
    });
    elBar.appendChild(b);
  });
}

function buildModeBar() {
  elMode.innerHTML = '';
  var list = [{ m: 'all', n: '全部 ' + ITEMS.length + ' 题' },
              { m: 'detail', n: '细节辨图 ' + pool('all', 'detail').length + ' 题' }];
  list.forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (state.mode === o.m ? ' on' : '');
    b.textContent = o.n;
    b.addEventListener('click', function () { setMode(o.m); });
    elMode.appendChild(b);
  });
}

function setMode(m) {
  if (state.mode === m) return;
  state.mode = m;
  state.grade = 'all';
  state.streak = 0;
  if (m === 'detail') { delete decks['detail:all']; lastId = -1; }
  resetSession();
  updateStats();
  buildModeBar();
  buildBar();
  hideSummary();
  try {
    var u = new URL(location.href);
    if (m === 'detail') u.searchParams.set('type', 'detail'); else u.searchParams.delete('type');
    history.replaceState(null, '', u.href);
  } catch (e) { }
  nextQuestion();
}

function resetSession() {
  state.session = { n: 0, right: 0, by: {} };
}
function noteAnswer(grade, right) {
  if (!state.session) resetSession();
  var s = state.session;
  s.n++;
  if (right) s.right++;
  var g = s.by[grade] || (s.by[grade] = { n: 0, right: 0 });
  g.n++;
  if (right) g.right++;
}
function hideSummary() {
  elSummary.classList.remove('show');
  elSummary.innerHTML = '';
  elOpts.style.display = '';
  elReplay.style.display = '';
}
function showSummary() {
  clearTimeout(state.timer);
  var s = state.session, total = s.n, acc = total ? Math.round(s.right / total * 100) : 0;
  var rows = [3, 4, 5, 6].map(function (g) {
    var d = s.by[g];
    return d ? g + ' 年级 ' + d.right + '/' + d.n : g + ' 年级 暂无';
  });
  elSummary.innerHTML =
    '<div class="sumtitle">🎉 ' + pool('all', 'detail').length + ' 道细节辨图练完啦</div>' +
    '<div class="sumline">答对 <b>' + s.right + '</b> / ' + total + ' · 正确率 <b>' + acc + '%</b></div>' +
    '<div class="sumgrades">按年级：' + rows.join(' · ') + '</div>' +
    '<button class="sumagain" id="sumAgain" type="button">🔁 再练一轮</button>';
  elSummary.classList.add('show');
  elOpts.style.display = 'none';
  elReplay.style.display = 'none';
  elPrompt.innerHTML = '🎧 细节辨图完成<span>看看哪一档还需要多听几遍</span>';
  setFb('', null);
  speakZh('这一轮答对了' + s.right + '题，正确率百分之' + acc + '。');
  document.getElementById('sumAgain').addEventListener('click', function () {
    delete decks['detail:all'];
    lastId = -1;
    resetSession();
    hideSummary();
    nextQuestion();
  });
}

function finishOrNext() {
  if (state.mode === 'detail' && state.session.n >= pool('all', 'detail').length) showSummary();
  else nextQuestion();
}

function updateStats() {
  elStreak.textContent = state.streak;
  elBest.textContent = state.best;
}

function nextQuestion() {
  clearTimeout(state.timer);
  hideSummary();
  state.answered = false;
  state.cur = take();
  var q = state.cur;

  elPrompt.innerHTML = TYPE_PROMPT[q.type] +
    '<span>' + q.grade + ' 年级 · ' + q.topic + '</span>';
  elOpts.innerHTML = '';
  setFb('', null);

  var opts = shuffle([q.answer].concat(q.wrong));
  opts.forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (q.type === 'detail' ? ' sceneopt'
      : q.type === 'img' ? ' imgopt' : q.type === 'reply' ? ' replyopt'
      : q.type === 'cn' ? ' longopt' : '');
    b.textContent = v;
    b.dataset.val = v;
    b.addEventListener('click', function () { answer(v, b); });
    elOpts.appendChild(b);
  });

  setTimeout(replayNow, 220);
}

function answer(v, btn) {
  if (state.answered) return;
  state.answered = true;
  var q = state.cur;
  var right = v === q.answer;
  noteAnswer(q.grade, right);

  Array.prototype.forEach.call(elOpts.children, function (b) {
    if (b.dataset.val === q.answer) b.classList.add('good');
    if (b !== btn) b.disabled = true;
  });

  if (right) {
    btn.classList.add('good', 'pop');
    state.streak++;
    if (state.streak > state.best) { state.best = state.streak; safeSet(KEY_BEST, state.best); }
    if (window.XNLY && XNLY.mark) XNLY.mark('right');
    setFb('✅ 答对了！', true, q.zh);
    speakZh('答对了。' + q.zh);
    updateStats();
    state.timer = setTimeout(finishOrNext, 1900);
  } else {
    btn.classList.add('bad', 'shake');
    state.streak = 0;
    if (window.XNLY && XNLY.mark) XNLY.mark('wrong');
    setFb('❌ 正确答案是 ' + q.answer, false, q.zh);
    speakEn(q.audio);
    speakZh(q.zh);
    updateStats();
    state.timer = setTimeout(finishOrNext, 2400);
  }
}

elReplay.addEventListener('click', replayNow);

(function init() {
  var b = parseInt(safeGet(KEY_BEST), 10);
  state.best = isNaN(b) || b < 0 ? 0 : b;
  var tp = '';
  try { tp = new URLSearchParams(location.search).get('type') || ''; } catch (e) { }
  if (tp === 'detail') { state.mode = 'detail'; delete decks['detail:all']; }
  resetSession();
  buildModeBar();
  buildBar();
  updateStats();
  nextQuestion();

  /* 首题照常显示；第一次任意点击解锁音频并补读当前题 */
  var firstTap = false;
  document.addEventListener('pointerdown', function () {
    if (firstTap) return;
    firstTap = true;
    if (window.XNLY && XNLY.voice && XNLY.voice.unlock) {
      try { XNLY.voice.unlock(); } catch (e) { }
    }
    if (!state.answered) replayNow();
  }, { passive: true });
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
