.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;}

.opt{min-height:66px;border:2px solid rgba(36,59,83,.10);border-radius:16px;background:#fff;

.opt:active{transform:scale(.97);}
.opt.good{border-color:var(--ok);background:#eaf8ee;color:#1b7c33;animation:pop .45s ease;}
.opt.bad{border-color:var(--bad);background:#ffeded;animation:shake .45s ease;}
.opt.faded{opacity:.45;}
.feedback{min-height:28px;font-size:1.02rem;font-weight:900;text-align:center;}
.feedback.ok{color:var(--ok);} .feedback.bad{color:var(--bad);}
.exp{display:none;width:100%;max-width:760px;background:#fffdf3;border:2px solid #ffe4a3;border-radius:16px;

.exp.show{display:block;}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn{min-height:44px;padding:0 20px;border:2px solid rgba(36,59,83,.10);border-radius:999px;background:#fff;

  body{padding:18px 26px;gap:13px;}
  h1{font-size:1.4rem;}
  .qtext{font-size:1.55rem;}
  .opt{min-height:80px;font-size:1.12rem;}
}
@media (max-height:430px){ body{padding:8px;gap:5px;} h1{font-size:1rem;} .opt{min-height:52px;} }

  [3,3,'「行」在「银行」里是什么意思？',['行业','行走','可以','行列'],'行业','银行是一种行业机构。'],
  [3,3,'「行」在「行走」里是什么意思？',['走路','行业','银行','不行'],'走路','行走就是走路。'],
  [3,3,'「只」在「一只鸟」里是什么意思？',['量词','只有','只是','只好'],'量词','一只的「只」是量词。'],
  [3,3,'「只」在「只有」里是什么意思？',['仅仅','量词','一只','只好'],'仅仅','只有就是仅仅有。'],
  [3,3,'「为」在「因为」里是什么意思？',['表示原因','为了','作为','成为'],'表示原因','因为用来引出原因。']
];

var state = { cat: -1, tier: 0, pool: [], pos: 0, right: 0, locked: false };
var elCat = document.getElementById('catChips');
var elTier = document.getElementById('tierChips');
var elQtag = document.getElementById('qtag');
var elQ = document.getElementById('qtext');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elExp = document.getElementById('exp');

function buildChips() {
  elCat.innerHTML = '';
  var all = document.createElement('button');
  all.type = 'button'; all.className = 'chip' + (state.cat < 0 ? ' on' : '');
  all.innerHTML = '全部 <span class="n">100</span>';
  all.addEventListener('click', function () { state.cat = -1; rebuild(); });
  elCat.appendChild(all);
  CATS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (state.cat === i ? ' on' : '');
    var cnt = Q.filter(function (q) { return q[0] === i; }).length;
    b.innerHTML = c + ' <span class="n">' + cnt + '</span>';
    b.addEventListener('click', function () { state.cat = i; rebuild(); });
    elCat.appendChild(b);
  });
  elTier.innerHTML = '';
  ['全部年级', '1~2 年级', '3~4 年级', '5~6 年级'].forEach(function (label, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (state.tier === i ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', function () { state.tier = i; rebuild(); });
    elTier.appendChild(b);
  });
}

function rebuild() {
  state.pool = Q.filter(function (q) {
    return (state.cat < 0 || q[0] === state.cat) && (state.tier === 0 || q[1] === state.tier);
  });
  state.deck = XNLY.deck.make(state.pool, 'chinese-basics.' + state.cat + '.' + state.tier, { head: 5 });
  state.cur = state.deck.next();
  state.pos = 0; state.right = 0; state.locked = false;
  buildChips();
  render();
}

function cur() { return state.cur; }

function render() {
  var q = state.cur;
  if (!q) { elQ.textContent = '这个分类没有题目啦～'; elOpts.innerHTML = ''; return; }
  state.locked = false;
  elQtag.textContent = CATS[q[0]] + ' · ' + ['1~2 年级', '3~4 年级', '5~6 年级'][q[1] - 1] +
    '　第 ' + (state.pos + 1) + ' / ' + state.pool.length + ' 题';
  elQ.innerHTML = q[2].replace(/（\s*）/g, '<u>　　</u>');
  elFb.className = 'feedback'; elFb.textContent = '';
  elExp.className = 'exp'; elExp.textContent = '';
  elOpts.innerHTML = '';
  shuffle(q[3]).forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.textContent = o;
    b.addEventListener('click', function () { choose(b, o, q); });
    elOpts.appendChild(b);
  });
  say(q[2].replace(/（\s*）/g, '什么'));
}

function choose(btn, o, q) {
  if (state.locked) return;
  if (o === q[4]) {
    state.locked = true;
    btn.classList.add('good');
    Array.prototype.forEach.call(elOpts.children, function (b) { if (b !== btn) b.classList.add('faded'); });
    state.right++;
    mark('right');
    elFb.className = 'feedback ok'; elFb.textContent = '✅ 答对啦！';
    elExp.textContent = '💡 ' + q[5]; elExp.className = 'exp show';
    say('答对啦。' + q[5]);
  } else {
    btn.classList.add('bad');
    setTimeout(function () { btn.classList.remove('bad'); }, 500);
    mark('wrong');
    elFb.className = 'feedback bad'; elFb.textContent = '❌ 再想想～';
    elExp.textContent = '💡 ' + q[5]; elExp.className = 'exp show';
    say('再想想。' + q[5]);
  }
}

function nextQ() {
  state.pos++;
  if (state.pos >= state.pool.length) {
    state.pos = 0;
  }
  state.cur = state.deck.next();
  render();
}
document.getElementById('next').addEventListener('click', nextQ);

buildChips();
state.pool = Q.slice();
state.deck = XNLY.deck.make(state.pool, 'chinese-basics.all.all', { head: 5 });
state.cur = state.deck.next();
render();
window.__chinese = { list: Q, state: state, cats: CATS, rebuild: rebuild };

/* 顶栏「下一题」：跳过当前题，不判分、不显示答案、不清空连对 */
(function () {
  var busy = false;
  window.XNLY_NEXT = function () {
    if (busy) return;
    busy = true;
    try { if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel(); } catch (e) { }
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
    try { nextQ(); } catch (e) { }   /* nextQ：只从牌堆取下一题并 render，state.right 不动；到末题 pos 归零回绕 */
    setTimeout(function () { busy = false; }, 0);
  };
})();
</script>

}
