:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#2563eb;--line:rgba(36,59,83,.10);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#e8f0ff,transparent 60%),

  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;padding:7px 14px;font-weight:800;font-size:.85rem;
  box-shadow:0 3px 10px rgba(36,59,83,.10);}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-family:inherit;font-size:.74rem;font-weight:800;color:#6b7f95;box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip.on{background:linear-gradient(135deg,#2f7ed8,#2563eb);color:#fff;border-color:transparent;}
.chip b{color:var(--accent);font-size:.86rem;}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tchip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-family:inherit;font-size:.75rem;font-weight:800;color:#4a6076;cursor:pointer;
  box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.tchip.on{background:linear-gradient(135deg,#2f7ed8,#2563eb);color:#fff;border-color:transparent;}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  min-height:0;overflow-y:auto;width:100%;}
.prompt{font-size:clamp(1.15rem,2.4vw,1.4rem);font-weight:800;text-align:center;color:#4a6076;line-height:1.5;}
.qline{display:block;}
.cn{display:block;font-size:clamp(1.7rem,7vw,2.2rem);font-weight:900;color:#1d4ed8;margin-top:2px;}
.bigpic{display:block;width:clamp(260px,48vw,340px);height:clamp(260px,48vw,340px);margin:8px auto 0;}
.picbox{display:block;width:100%;height:100%;overflow:hidden;border-radius:16px;background:#eef4ff;
  border:1px solid rgba(36,59,83,.08);}
.picbox img{width:100%;height:100%;object-fit:cover;display:block;}
.picbox svg{width:100%;height:100%;display:block;}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(640px,100%);}
.opt{min-height:64px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:4px;
  font-family:inherit;font-size:1.4rem;font-weight:900;color:var(--ink);cursor:pointer;
  box-shadow:0 5px 14px rgba(36,59,83,.08);transition:transform .14s,border-color .18s,background .18s;}
.opt:active{transform:scale(.97);}
.opt.pic-opt{padding:8px;}
.opt.pic-opt .picbox{aspect-ratio:1/1;height:auto;}
.opt.good{border-color:var(--ok);background:#e9fbee;color:#1b7c33;}
.opt.bad{border-color:var(--bad);background:#ffeded;color:#b02a2a;}
.opt[disabled]{opacity:.45;cursor:default;}
.feedback{min-height:36px;font-size:clamp(1.05rem,2.2vw,1.3rem);font-weight:800;text-align:center;line-height:1.45;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
.feedback small{display:block;font-size:.85rem;font-weight:700;color:#7b8ea8;margin-top:2px;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){
  body{padding:8px;gap:6px;}
  h1{font-size:1rem;}
  .stage{gap:8px;}
  .opt{min-height:46px;font-size:1.05rem;}
  .prompt{font-size:1rem;}
  .bigpic{width:170px;height:170px;}
}

function artKind(w) { return KIND[w.en] || THEME_KIND[w.theme] || 'house'; }
function artSVG(w) {
  var k = artKind(w), f = ART[k] || ART.house;
  return '<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><rect width="512" height="512" fill="#f3f7ff"/>' + f(w) + '</svg>';

var curTheme = '全部';
function pool() {
  return curTheme === '全部' ? WORDS : WORDS.filter(function (w) { return w.theme === curTheme; });
}

var KEY_BEST = 'pew.best';
var state = { streak: 0, best: 0, cur: null, locked: false, timer: null };

var elPrompt = document.getElementById('prompt');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function pick(a) { return a[rand(a.length)]; }
function speak(text, opts) { if (window.XNLY && XNLY.voice) XNLY.voice.speak(text, opts || {}); }

/* 中文先读，再排队读英文（英文强制 en-US，避免读成中文腔） */
function speakWord(w) {
  speak(w.cn);
  speak(w.en, { queue: true, lang: 'en-US' });
}

function updateStats() {
  elStreak.textContent = state.streak;
  elBest.textContent = state.best;
}

function setFb(html, good, sub) {
  elFb.className = 'feedback ' + (good === true ? 'ok' : good === false ? 'bad' : '');
  elFb.innerHTML = html + (sub ? '<small>' + sub + '</small>' : '');
}

var wordDecks = {};
function targetDeck() {
  if (!wordDecks[curTheme]) {
    wordDecks[curTheme] = XNLY.deck.make(pool(), 'english-words.' + curTheme, {
      head: 5, id: function (w) { return w.en; }
    });
  }
  return wordDecks[curTheme];
}

function artNode(w) {
  var s = document.createElement('span');
  s.style.display = 'block';
  s.style.width = '100%';
  s.style.height = '100%';
  s.innerHTML = artSVG(w);
  return s;
}
function makePic(w, cls) {
  var box = document.createElement('span');
  box.className = 'picbox' + (cls ? ' ' + cls : '');
  var src = PHOTOS[slugOf(w.en)];
  if (src) {
    var img = new Image();
    img.alt = w.cn;
    img.src = '../' + src;
    img.onerror = function () { box.innerHTML = ''; box.appendChild(artNode(w)); };
    box.appendChild(img);
  } else {
    box.appendChild(artNode(w));
  }
  return box;
}

function pickOthers(P, target) {
  var others = shuffle(P.filter(function (w) { return w !== target; }));
  var out = [], used = {};
  used[artKind(target)] = 1;
  others.forEach(function (w) {
    if (out.length >= 2) return;
    var k = artKind(w);
    if (used[k]) return;
    used[k] = 1;
    out.push(w);
  });
  if (out.length < 2) {
    others.forEach(function (w) { if (out.length < 2 && out.indexOf(w) < 0) out.push(w); });
  }
  if (out.length < 2) {
    shuffle(WORDS.filter(function (w) { return w !== target && out.indexOf(w) < 0; })).slice(0, 2 - out.length).forEach(function (w) { out.push(w); });
  }
  return out;
}

function makeQuestion() {
  var type = rand(3);           /* 0 中文选英文 · 1 图选英文 · 2 听音选图 */
  var target = targetDeck().next();
  var others = pickOthers(pool(), target);
  if (others.length < 3) others = pickOthers(WORDS, target);
  return { type: type, w: target, opts: shuffle([target].concat(others)) };
}

function nextQuestion() {
  clearTimeout(state.timer);
  state.locked = false;
  state.cur = makeQuestion();
  var q = state.cur;
  elOpts.innerHTML = '';
  window.replayCurrent = null;

  if (q.type === 0) {
    elPrompt.innerHTML = '“<span class="cn">' + q.w.cn + '</span>” 用英语怎么说？';
    elPrompt.setAttribute('data-speak', q.w.cn + '，用英语怎么说？');
    q.opts.forEach(addOptText);
    var say0 = q.w.cn + '，用英语怎么说？';
    speak(say0);
    window.replayCurrent = function () { speak(say0); };
  } else if (q.type === 1) {
    elPrompt.innerHTML = '<span class="qline">这个用英语怎么说？</span>';
    elPrompt.appendChild(makePic(q.w, 'bigpic'));
    var say1 = '看图片，' + q.w.cn + '，用英语怎么说？';
    elPrompt.setAttribute('data-speak', say1);
    q.opts.forEach(addOptText);
    speak(say1);
    window.replayCurrent = function () { speak(say1); };
  } else {
    elPrompt.innerHTML = '<span class="qline">听一听，点出听到的东西</span>';
    elPrompt.setAttribute('data-speak', '听一听，点出听到的东西');
    q.opts.forEach(addOptPic);
    var say2 = function () { speak(q.w.en, { lang: 'en-US' }); };
    window.replayCurrent = say2;
    setTimeout(say2, 260);
  }
  setFb('', null);
}

function addOptText(w) {

  b.className = 'opt';
  b.textContent = w.en;
  b.dataset.en = w.en;
  b.addEventListener('click', function () { answer(w, b); });
  elOpts.appendChild(b);
}

function addOptPic(w) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'opt pic-opt';
  b.dataset.en = w.en;
  b.appendChild(makePic(w));
  b.addEventListener('click', function () { answer(w, b); });
  elOpts.appendChild(b);
}

function answer(w, btn) {
  if (state.locked || !state.cur) return;
  var q = state.cur;
  if (w === q.w) {
    state.locked = true;
    btn.classList.add('good');
    Array.prototype.forEach.call(elOpts.children, function (b) { if (b !== btn) b.disabled = true; });
    state.streak++;
    if (state.streak > state.best) { state.best = state.streak; safeSet(KEY_BEST, state.best); }
    if (window.XNLY && XNLY.mark) XNLY.mark('right');
    setFb('✅ ' + q.w.cn + ' — ' + q.w.en, true, '连对 ' + state.streak + ' 题');
    updateStats();
    /* 中文 + 英文读完再跳下一题 */
    state.timer = XNLY.voice.speakThen('', nextQuestion, { parts: [{ text: q.w.cn, lang: 'zh-CN' }, { text: q.w.en, lang: 'en-US' }] });
  } else {
    state.locked = true;
    state.streak = 0;
    btn.classList.add('bad', 'shake');
    Array.prototype.forEach.call(elOpts.children, function (b) {
      if (b.dataset.en === q.w.en) b.classList.add('good');
      b.disabled = true;
    });
    if (window.XNLY && XNLY.mark) XNLY.mark('wrong');
    setFb('❌ 正确答案是 ' + q.w.en + ' · ' + q.w.cn, false);
    updateStats();
    state.timer = XNLY.voice.speakThen('', nextQuestion, { parts: [{ text: q.w.cn, lang: 'zh-CN' }, { text: q.w.en, lang: 'en-US' }] });
  }
}

(function init() {
  var b = parseInt(safeGet(KEY_BEST), 10);
  state.best = isNaN(b) || b < 0 ? 0 : b;
  buildThemeBar();
  updateStats();
  loadPhotos(function () { nextQuestion(); });
})();

function buildThemeBar() {
  var bar = document.getElementById('themeBar');
  var names = ['全部', '颜色', '动物', '数字', '食物', '文具', '身体', '家庭', '动作', '更多'];
  bar.innerHTML = '';
  names.forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (curTheme === n ? ' on' : '');
    var cnt = n === '全部' ? WORDS.length : WORDS.filter(function (w) { return w.theme === n; }).length;
    b.textContent = n + ' ' + cnt;
    b.addEventListener('click', function () {
      curTheme = n;
      buildThemeBar();
      state.streak = 0;
      updateStats();
      nextQuestion();
    });
    bar.appendChild(b);
  });
}

/* 顶栏「下一题」：跳过当前题，不判分、不显示答案、不清空连对 */
window.XNLY_NEXT = function () {
  try { if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel(); } catch (e) { }
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
  nextQuestion();
};
