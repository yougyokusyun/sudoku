<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🔢 数字配对 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#eef2ff,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#fff2f6,transparent 55%),
             linear-gradient(160deg,#f8faff,#fff5f8);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.chips{margin-left:auto;display:flex;gap:6px;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,.76);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:8px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);}
.prompt{font-size:1rem;font-weight:800;text-align:center;color:#4a5f78;}

/* 上方大数字 */
.big{
  width:min(30vh,225px);height:min(30vh,225px);border-radius:32px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#a78bfa,#6d4bff);color:#fff;font-size:6.3rem;font-weight:900;
  box-shadow:0 12px 26px rgba(109,75,255,.32);font-family:'Courier New',monospace;
  transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s ease;
}
.big.pop{transform:scale(1.12);box-shadow:0 16px 32px rgba(109,75,255,.42);}

/* 4 张数量卡 */
.cards{display:flex;justify-content:center;align-items:stretch;gap:clamp(8px,2vw,14px);flex-wrap:wrap;}
.card{
  width:clamp(114px,23vw,165px);height:clamp(114px,23vw,165px);border-radius:26px;border:2px solid rgba(36,59,83,.10);
  background:#fff;cursor:pointer;box-shadow:0 6px 14px rgba(36,59,83,.10);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px;padding:8px;
  transition:transform .14s ease,border-color .18s ease,background .18s ease;
}
.card:active{transform:scale(.95);}
.card .it{line-height:1;font-size:2.25rem;}
.card[data-c="3"] .it,.card[data-c="4"] .it{font-size:1.83rem;}
.card[data-c="5"] .it{font-size:1.575rem;}
.card.good{border-color:var(--ok);background:#e9fbee;animation:pop .45s ease;}
.card.badd{border-color:var(--bad);background:#ffeded;animation:shake .45s ease;}
.card.gone{opacity:0;transform:scale(.4);transition:opacity .3s ease,transform .3s ease;}

.feedback{min-height:26px;font-size:1.05rem;font-weight:800;text-align:center;color:var(--muted);}
.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);animation:shake .45s ease;}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;width:100%;}
.btn{min-height:46px;padding:0 20px;border:2px solid rgba(36,59,83,.10);border-radius:999px;
  background:#fff;color:var(--ink);font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(36,59,83,.10);}
.btn.primary{border-color:rgba(124,92,255,.5);color:#fff;background:linear-gradient(135deg,#8b6bff,#6a4bff);}

/* 飞向数字的卡片 */
.fly{position:fixed;z-index:99;pointer-events:none;border-radius:16px;background:#fff;
  border:2px solid rgba(47,179,68,.5);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 8px 18px rgba(36,59,83,.18);
  transition:transform .42s cubic-bezier(.3,.9,.4,1),opacity .42s ease;}
.fly .it{line-height:1;}

@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

@media (max-height:430px){
  body{padding:6px 10px;gap:5px;}
  h1{font-size:.95rem;}
  .chip{padding:2px 8px;font-size:.68rem;}
  .stage{gap:7px;padding:8px;border-radius:16px;flex-direction:row;flex-wrap:wrap;}
  .prompt{flex:1 0 100%;font-size:.82rem;}
  .big{width:min(34vh,96px);height:min(34vh,96px);border-radius:20px;font-size:2.6rem;}
  .cards{gap:8px;}
  .card{width:clamp(56px,13vw,76px);height:clamp(56px,13vw,76px);border-radius:14px;padding:5px;}
  .card .it{font-size:1.05rem;}
  .card[data-c="3"] .it,.card[data-c="4"] .it{font-size:.9rem;}
  .card[data-c="5"] .it{font-size:.8rem;}
  .feedback{flex:1 0 100%;min-height:18px;font-size:.86rem;}
  .controls{flex:1 0 100%;justify-content:center;}
  .btn{min-height:34px;font-size:.78rem;padding:0 14px;}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png"><script src="../voice.js"></script>
<script src="../sound.js"></script>
<script src="../deck.js"></script>
</head>
<body>
<header>
  <a class="back" href="../index.html">🏠 首页</a>
  <h1>🔢 数字配对</h1>
  <div class="chips">
    <span class="chip">🔥 连对 <b id="streak">0</b></span>
    <span class="chip">🏆 最佳 <b id="best">0</b></span>
    <span class="chip">⭐ 第 <b id="lvl">1</b> 档 <span id="rng">1~5</span></span>
  </div>
</header>

<div class="stage">
  <div class="prompt" id="prompt">哪张卡片的数量和这个数字一样？👇</div>
  <div class="big" id="big">3</div>
  <div class="cards" id="cards"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="btn primary" id="next" type="button">🔄 换一个数字</button>
  </div>
</div>

<script>
/* 数量卡用到的 emoji（每轮 4 张各用一种，避免同图案干扰判断） */
var FRUITS = ['🍎', '🍌', '🍓', '🍇', '🍊', '🍑', '🍐', '🍉', '🥕', '🍋', '🌸', '🐟'];

/* 难度档位：连对 3 题升一档，错 2 题降一档
 *   1 档：1~5（默认）  2 档：1~8  3 档：1~10 */
var LEVELS = [{ max: 5, txt: '1~5' }, { max: 8, txt: '1~8' }, { max: 10, txt: '1~10' }];
var level = 1, MAX = LEVELS[0].max, okRun = 0, badRun = 0;

var target = 3;
var streak = 0, best = readNum('pnum.best');
var locked = false, timer = null, lockTimer = null;

var elBig = document.getElementById('big');
var elCards = document.getElementById('cards');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');
var elBest = document.getElementById('best');

function readNum(k) { var v = parseInt(localStorage.getItem(k), 10); return isNaN(v) ? 0 : v; }
function writeNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function updateStats() { elStreak.textContent = streak; elBest.textContent = best; }
function feedback(t, cls) {
  elFb.className = 'feedback' + (cls ? ' ' + cls : '');
  elFb.textContent = t || '';
}

var canSpeak = typeof window.speechSynthesis !== 'undefined';
/* 读完语音再跳下一题：onend 不触发时按 字数×220ms+1500ms 兜底 */
function sayThen(t, cb) {
  if (window.XNLY && XNLY.voice && XNLY.voice.speakThen) return XNLY.voice.speakThen(String(t || ''), cb);
  t = String(t || '');
  try { if (window.XNLY && XNLY.voice && XNLY.voice.speak) XNLY.voice.speak(t); } catch (e) { }
  var ph = setTimeout(function () { try { if (cb) cb(); } catch (e) { } }, Math.max(1500, t.replace(/\s+/g, '').length * 220) + 1500);
  return { cancel: function () { clearTimeout(ph); } };
}

function say(text) {
  if (!canSpeak) return;
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { }
}

var targetDeck = null, targetKey = '';
function targetDeckFor() {
  var k = 'number-match.' + level;
  if (!targetDeck || targetKey !== k) {
    var pool = [];
    for (var v = 1; v <= MAX; v++) pool.push(v);
    targetDeck = XNLY.deck.make(pool, k, { head: 5, id: function (n) { return 'n' + n; } });
    targetKey = k;
  }
  return targetDeck;
}
var fruitDeck = XNLY.deck.make(FRUITS, 'number-match.fruits', { head: 5 });

function newRound() {
  if (window.XNLY && XNLY.voice) { try { XNLY.voice.cancel(); } catch (e) { } }

  clearTimeout(timer);
  locked = true;                 /* 800ms 输入锁：题刚出来时朗读还没结束，防连点 */
  clearTimeout(lockTimer);
  lockTimer = setTimeout(function () { locked = false; }, 800);

  target = targetDeckFor().next();
  elBig.textContent = target;
  elBig.classList.remove('pop');

  /* 4 张卡：1 张数量 = 目标，另外 3 张数量互不相同且 ≠ 目标 */
  var all = [];
  for (var v = 1; v <= MAX; v++) all.push(v);
  var others = shuffle(all.filter(function (x) { return x !== target; })).slice(0, 3);
  var counts = shuffle([target].concat(others));
  var fruits = [];
  for (var fi = 0; fi < 4; fi++) fruits.push(fruitDeck.next());

  elCards.innerHTML = '';
  counts.forEach(function (c, idx) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.setAttribute('data-c', c);
    b.setAttribute('aria-label', '数量' + c);
    var html = '';
    for (var i = 0; i < c; i++) html += '<span class="it">' + fruits[idx] + '</span>';
    b.innerHTML = html;
    b.addEventListener('click', function () { tap(b, c); });
    elCards.appendChild(b);
  });

  window.__target = target;
  window.__counts = counts.slice();
  feedback('');
  voiceSpeak('数字' + target + '，哪一张卡片和它一样多？');
}

function tap(btn, c) {
  if (locked) return;
  if (c === target) {
    locked = true;
    btn.classList.add('good');
    flyTo(btn);
    setTimeout(function () {
      btn.classList.add('gone');
      elBig.classList.add('pop');
      setTimeout(function () { elBig.classList.remove('pop'); }, 320);
    }, 340);
    streak++;
    if (streak > best) { best = streak; writeNum('pnum.best', best); }
    updateStats();
    okRun++; badRun = 0;
    if (okRun >= 3 && level < LEVELS.length) { okRun = 0; setLevel(level + 1); if (window.XNLY) XNLY.sound.win(); }

    feedback('🎉 对啦，' + target + '个！', 'ok');
    timer = sayThen('对啦，' + target + '个！', newRound);
  } else {
    btn.classList.add('badd');
    setTimeout(function () { btn.classList.remove('badd'); }, 450);
    badRun++; okRun = 0;
    if (badRun >= 2 && level > 1) { badRun = 0; setLevel(level - 1); }
    voiceSpeak('再数一数，哪一张一样多');
    feedback('❌ 这张不是 ' + target + ' 个，再数一数', 'bad');
  }
}

function setLevel(n) {
  level = Math.min(LEVELS.length, Math.max(1, n));
  MAX = LEVELS[level - 1].max;
  var l = document.getElementById('lvl');
  var r = document.getElementById('rng');
  if (l) l.textContent = level;
  if (r) r.textContent = LEVELS[level - 1].txt;
  try { localStorage.setItem('pnum.level', String(level)); } catch (e) { }
}

/* 卡片飞向大数字并合并 */
function flyTo(btn) {
  var a = btn.getBoundingClientRect(), b = elBig.getBoundingClientRect();
  var f = document.createElement('div');
  f.className = 'fly';
  f.style.cssText += 'left:' + a.left + 'px;top:' + a.top + 'px;width:' + a.width + 'px;height:' + a.height +
    'px;padding:8px;box-sizing:border-box;';
  f.innerHTML = btn.innerHTML;
  Array.prototype.forEach.call(f.querySelectorAll('.it'), function (x) {
    x.style.fontSize = '1.2rem';
  });
  document.body.appendChild(f);
  void f.offsetWidth;
  var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  var dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.35)';
  f.style.opacity = '.25';
  setTimeout(function () { f.remove(); }, 440);
}

document.getElementById('next').addEventListener('click', function () {
  streak = 0;
  updateStats();
  newRound();
  feedback('换了一个新数字～');
});

function initNumberMatch() {
  best = readNum('pnum.best');
  var saved = readNum('pnum.level');
  setLevel(saved >= 1 && saved <= LEVELS.length ? saved : 1);
  updateStats();
  newRound();
}
function resetNumberMatch() {
  streak = 0;
  updateStats();
  newRound();
}
initNumberMatch();

/* ===== 语音播报：进入游戏先读一遍玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '数字配对游戏。找出和上面数字一样多的那张卡片。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进入游戏自动朗读；若浏览器拦截自动播放，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  try {
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
  setTimeout(function () {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
    var once = function () {
      document.removeEventListener('pointerdown', once);
      voiceSpeak(VOICE_TEXT);
    };
    document.addEventListener('pointerdown', once);
  }, 900);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.10);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>

</body>
</html>
