<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>📌 成语分类 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--bad:#ff5c5c;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe8f0,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e4f2ff,transparent 55%),
             linear-gradient(160deg,#fff8f2,#f2f8ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:#e63946;font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}
.chips{margin-left:auto;display:flex;gap:6px;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:#e63946;font-size:.86rem;}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;
  background:rgba(255,255,255,.76);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:10px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);overflow:hidden;}

.bar{height:6px;border-radius:4px;background:rgba(36,59,83,.08);overflow:hidden;flex:none;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#e63946,#7c5cff);border-radius:4px;transition:width .3s;}

.qprompt{flex:none;font-size:.95rem;font-weight:900;text-align:center;color:#31465c;}
.idiom{flex:none;font-size:clamp(1.6rem,5.5vh,2.4rem);font-weight:900;text-align:center;letter-spacing:.08em;color:#c2185b;}
.hint{flex:none;font-size:.82rem;color:#8aa0b8;text-align:center;}

.opts{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.opt{min-height:56px;border-radius:16px;border:2px solid rgba(36,59,83,.10);background:#fff;
  font-family:inherit;font-weight:900;color:#31465c;cursor:pointer;padding:6px 8px;
  font-size:clamp(.9rem,2.4vh,1.15rem);display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 5px 12px rgba(36,59,83,.07);transition:transform .12s,border-color .18s,background .18s;}
.opt:active{transform:scale(.97);}
.opt.good{border-color:var(--ok);background:#e9fbee;color:#1b7c33;}
.opt.bad{border-color:var(--bad);background:#ffeded;animation:shake .4s ease;}

.qfb{min-height:30px;font-size:.88rem;font-weight:900;text-align:center;color:var(--muted);flex:none;padding:0 4px;}
.qfb.ok{color:var(--ok);} .qfb.bad{color:var(--bad);animation:shake .4s;}
.controls{display:flex;justify-content:center;gap:8px;flex:none;}
.btn{min-height:40px;padding:0 18px;border-radius:999px;border:2px solid rgba(36,59,83,.12);background:#fff;
  font-weight:800;font-size:.86rem;color:var(--ink);cursor:pointer;font-family:inherit;}
.btn.on{background:#e63946;color:#fff;border-color:transparent;}
.btn[disabled]{opacity:.5;cursor:default;}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

@media (max-height:480px){
  .opts .opt{min-height:44px;font-size:.8rem}
  .idiom{font-size:1.3rem}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png"></head>
<body>
<header>
  <a class="back" href="../index.html">🏠 首页</a>
  <h1>📌 成语分类</h1>
  <div class="chips">
    <span class="chip">🔥 连对 <b id="streak">0</b></span>
    <span class="chip">🏆 最佳 <b id="best">0</b></span>
  </div>
</header>

<div class="stage">
  <div class="bar"><i id="bar"></i></div>
  <div class="qprompt" id="qprompt">这个成语属于哪一类？</div>
  <div class="idiom" id="idiom"></div>
  <div class="hint" id="hint"></div>
  <div class="opts" id="opts"></div>
  <div class="qfb" id="qfb"></div>
  <div class="controls">
    <button class="btn" id="btnStart">🚀 开始</button>
    <button class="btn" id="btnNext" disabled>下一题 →</button>
  </div>
</div>

<script>
/* 6 个类别，每类 8 个成语，共 48 题 */
var CATS = [
  {k:'yuyan',n:'寓言故事',emoji:'📖',
   list:['画蛇添足','井底之蛙','守株待兔','亡羊补牢','掩耳盗铃','狐假虎威','刻舟求剑','对牛弹琴']},
  {k:'lishi',n:'历史故事',emoji:'🏛️',
   list:['卧薪尝胆','完璧归赵','纸上谈兵','负荆请罪','四面楚歌','背水一战','指鹿为马','破釜沉舟']},
  {k:'shenhua',n:'神话传说',emoji:'🐉',
   list:['精卫填海','夸父追日','女娲补天','羿射九日','愚公移山','嫦娥奔月','八仙过海','开天辟地']},
  {k:'dongwu',n:'带动物',emoji:'🐾',
   list:['狐假虎威','画蛇添足','鸡犬不宁','对牛弹琴','井底之蛙','亡羊补牢','狗仗人势','狼吞虎咽']},
  {k:'qiantiao',n:'带数字',emoji:'🔢',
   list:['一心一意','三心二意','三长两短','一箭双雕','一举两得','一诺千金','一帆风顺','十全十美','百发百中','千钧一发','万紫千红','五光十色','七上八下','八仙过海','九牛一毛','四通八达']},
  {k:'sijiseason',n:'四季风景',emoji:'🌸',
   list:['百花齐放','春光明媚','草长莺飞','莺歌燕舞','硕果累累','秋高气爽','天高云淡','银装素裹','冰天雪地','鹅毛大雪','滴水成冰','春暖花开']}
];

/* 每个成语的释义（用于答完后展示） */
var MEAN = {
  '画蛇添足':'多此一举，反而坏事','井底之蛙':'见识短浅','守株待兔':'死守经验不知变通','亡羊补牢':'出了问题及时补救',
  '掩耳盗铃':'自己骗自己','狐假虎威':'借别人的威风吓唬人','刻舟求剑':'情况变了还照老办法','对牛弹琴':'白费口舌',
  '卧薪尝胆':'刻苦自励，报仇雪恨','完璧归赵':'完好地归还','纸上谈兵':'空谈理论，不会实践','负荆请罪':'主动向人认错',
  '四面楚歌':'陷入孤立无援的境地','背水一战':'没有退路，只有拼命','指鹿为马':'故意颠倒黑白','破釜沉舟':'下定决心拼死一战',
  '精卫填海':'意志坚定，不怕困难','夸父追日':'人有宏大志向，但也不自量力','女娲补天':'补救很大的损失','羿射九日':'为民除害',
  '愚公移山':'不怕困难，坚持到底','嫦娥奔月':'美女飞向月亮','八仙过海':'各有各的本领','开天辟地':'开创前所未有的事业',
  '鸡犬不宁':'被扰得不得安宁','狗仗人势':'仗着主人欺负人','狼吞虎咽':'吃东西又快又凶',
  '一心一意':'专心致志','三心二意':'不专心','三长两短':'意外的灾祸','一箭双雕':'一件事两份好处','一举两得':'一次做两件好事',
  '一诺千金':'说话算数','一帆风顺':'一路顺利','十全十美':'十分完美','百发百中':'每次都射中','千钧一发':'非常危险','万紫千红':'百花齐放','五光十色':'颜色鲜艳','七上八下':'心里紧张','九牛一毛':'数量极少','四通八达':'到处都有',
  '百花齐放':'各种花同时开放','春光明媚':'春天阳光明丽','草长莺飞':'春天生机勃勃','莺歌燕舞':'一派欢乐','硕果累累':'大果子一串串','秋高气爽':'秋天天高气爽','天高云淡':'天空高远云彩淡','银装素裹':'大雪后的白色','冰天雪地':'到处冰和雪','鹅毛大雪':'像鹅毛一样大的雪','滴水成冰':'天非常冷','春暖花开':'春天花开放'
};

var elBar=document.getElementById('bar'),elQp=document.getElementById('qprompt'),elIdiom=document.getElementById('idiom');
var elHint=document.getElementById('hint'),elOpts=document.getElementById('opts'),elFb=document.getElementById('qfb');
var btnStart=document.getElementById('btnStart'),btnNext=document.getElementById('btnNext');
var elStreak=document.getElementById('streak'),elBest=document.getElementById('best');

var state = {quiz:[],idx:0,score:0,streak:0,best:+localStorage.getItem('ic.best')||0};
elBest.textContent = state.best;

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function buildQuiz(){
  // 每类抽 2 个，凑约 12-14 题
  var pool = [];
  CATS.forEach(function(c){ shuffle(c.list.slice()).slice(0,2).forEach(function(t){ pool.push({cat:c.k,idiom:t,catName:c.n}); }); });
  pool = shuffle(pool);
  state.quiz = pool; state.idx=0;state.score=0;state.streak=0;
  updateStats(); btnNext.disabled=true; btnStart.textContent='🔄 再来一轮';
  renderQ();
}
function updateStats(){elStreak.textContent=state.streak;elBest.textContent=state.best;}

function renderQ(){
  if(state.idx>=state.quiz.length){
    elQp.textContent='🎉 分类完成！'; elIdiom.textContent=''; elHint.textContent='答对 '+state.score+' / '+state.quiz.length+' 题，连对最多 '+state.streak+' 次';
    elOpts.innerHTML='';elFb.textContent='';btnNext.disabled=true;return;
  }
  var it = state.quiz[state.idx];
  elBar.style.width = Math.round(state.idx/state.quiz.length*100)+'%';
  elQp.textContent = '第 '+(state.idx+1)+'/'+state.quiz.length+' 题 · 这个成语属于哪一类？';
  elIdiom.textContent = it.idiom;
  elHint.textContent = MEAN[it.idiom] || '';
  elOpts.innerHTML='';elFb.textContent='';elFb.className='qfb';btnNext.disabled=true;
  var opts = shuffle(CATS.slice());
  opts.forEach(function(c){
    var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=c.emoji+' '+c.n;
    b.addEventListener('click',function(){ansQ(b,c);});
    elOpts.appendChild(b);
  });
}
function ansQ(btn,c){
  var it=state.quiz[state.idx]; var done=btn.disabled;
  if(done) return;
  var correct = it.cat===c.k;
  if(correct){
    state.score++; state.streak++;
    if(state.streak>state.best){state.best=state.streak;localStorage.setItem('ic.best',state.best);}
    Array.prototype.forEach.call(elOpts.children,function(b){b.disabled=true;});
    btn.classList.add('good'); elFb.textContent = '✅ 对啦！属于「'+c.n+'」'; elFb.className='qfb ok';
    btnNext.disabled=false; updateStats();
  } else {
    btn.classList.add('bad'); btn.disabled=true;
    elFb.textContent = '❌ 不是这一类，再想想～'; elFb.className='qfb bad';
  }
}
btnStart.addEventListener('click',buildQuiz);
btnNext.addEventListener('click',function(){state.idx++;renderQ();});
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
</body>
</html>
