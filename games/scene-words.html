<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🖼️ 看图说话 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--accent:#2a9d8f;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#e8f7ff,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#fff5e8,transparent 55%),
             linear-gradient(160deg,#f7fcff,#fffaf2);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.chips{margin-left:auto;display:flex;gap:6px;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;
  background:rgba(255,255,255,.76);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:10px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);}
.prompt{font-size:.98rem;font-weight:800;text-align:center;color:#4a5f78;}

/* 场景画布：背景按场景切换 */
.scene{position:relative;flex:1 1 auto;min-height:0;border-radius:18px;overflow:hidden;
  transition:background .3s ease;box-shadow:inset 0 2px 10px rgba(36,59,83,.10);}
.scene.park   {background:linear-gradient(#bfe9ff 0%,#dff6ff 55%,#c8ecc0 55%,#a8dda0 100%);}
.scene.farm   {background:linear-gradient(#cdeaff 0%,#e8f6ff 52%,#f6e7b8 52%,#e8d495 100%);}
.scene.sea    {background:linear-gradient(#c9ecff 0%,#e3f7ff 50%,#ffeac2 50%,#f7dda4 100%);}
.scene.home   {background:linear-gradient(#efe3ff 0%,#f7f0ff 55%,#e6d9c8 55%,#d8c5ad 100%);}
.scene.forest {background:linear-gradient(#d5f0d8 0%,#e9fae9 55%,#b6dfa6 55%,#9ccb8a 100%);}
.scene.shop   {background:linear-gradient(#ffeef6 0%,#fff7fb 55%,#efe6f7 55%,#e2d6f2 100%);}

/* 场景里的元素 */
.thing{position:absolute;border:0;background:transparent;padding:2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  transform:translate(-50%,-50%);
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),filter .2s ease;}
.thing .ph{width:clamp(44px,11vw,66px);height:clamp(44px,11vw,66px);border-radius:50%;object-fit:cover;
  border:3px solid #fff;background:#eef3f8;display:block;
  box-shadow:0 4px 10px rgba(36,59,83,.25);transition:box-shadow .2s ease;}
.thing .e{font-size:clamp(1.8rem,7vw,3rem);line-height:1.05;
  filter:drop-shadow(0 4px 6px rgba(36,59,83,.22));}
.thing .lb{font-size:.62rem;font-weight:800;color:#3f5871;background:rgba(255,255,255,.82);
  border-radius:999px;padding:0 6px;opacity:0;transition:opacity .18s ease;white-space:nowrap;}
.thing:active{transform:translate(-50%,-50%) scale(.94);}
.thing.active{transform:translate(-50%,-50%) scale(1.3);z-index:5;}
.thing.active .ph{box-shadow:0 0 0 3px rgba(255,196,77,.95),0 0 16px rgba(255,196,77,.9),0 4px 10px rgba(36,59,83,.25);}
.thing.active .e{filter:drop-shadow(0 0 12px rgba(255,196,77,.95)) drop-shadow(0 4px 6px rgba(36,59,83,.22));}
.thing.active .lb{opacity:1;}

.feedback{min-height:30px;font-size:1.1rem;font-weight:900;text-align:center;color:var(--muted);}
.feedback.ok{color:var(--ok);}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.btn{min-height:44px;padding:0 18px;border:2px solid rgba(36,59,83,.10);border-radius:999px;
  background:#fff;color:var(--ink);font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(36,59,83,.10);}
.btn.primary{border-color:rgba(42,157,143,.5);color:#fff;background:linear-gradient(135deg,#4fc3ae,#2a9d8f);}

@media (max-height:430px){
  body{padding:6px 10px;gap:5px;}
  h1{font-size:.95rem;}
  .chip{padding:2px 8px;font-size:.68rem;}
  .stage{gap:5px;padding:7px;border-radius:16px;}
  .prompt{font-size:.8rem;}
  .thing .ph{width:clamp(32px,7.5vw,46px);height:clamp(32px,7.5vw,46px);border-width:2px;}
  .thing .e{font-size:clamp(1.3rem,4.4vw,1.9rem);}
  .thing .lb{font-size:.55rem;}
  .feedback{min-height:18px;font-size:.86rem;}
  .btn{min-height:32px;font-size:.76rem;padding:0 12px;}
}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">🏠 首页</a>
  <h1>🖼️ 看图说话</h1>
  <div class="chips">
    <span class="chip">👆 点一点，听词语</span>
  </div>
</header>

<div class="stage">
  <div class="prompt" id="prompt">点一下图里的东西，听听它叫什么👇</div>
  <div class="scene park" id="scene"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="btn primary" id="next" type="button">🔄 换一个场景</button>
  </div>
</div>

<script>
/* 场景：每个元素带 emoji、名称、位置（百分比）与本地照片（img/ 目录下） */
var SCENES = [
  {
    key: 'park', name: '公园', bg: 'park',
    things: [
      { e: '🌳', n: '大树', x: 8, y: 46, f: 'tree' },
      { e: '🏠', n: '房子', x: 44, y: 40, f: 'house' },
      { e: '🐕', n: '小狗', x: 70, y: 62, f: 'dog' },
      { e: '🌸', n: '小花', x: 26, y: 74, f: 'flower' },
      { e: '🚲', n: '自行车', x: 52, y: 70, f: 'bicycle' },
      { e: '☁️', n: '白云', x: 76, y: 8, f: 'cloud' }
    ]
  },
  {
    key: 'farm', name: '农场', bg: 'farm',
    things: [
      { e: '🐄', n: '奶牛', x: 10, y: 56, f: 'dairycow' },
      { e: '🐔', n: '小鸡', x: 34, y: 72, f: 'chick' },
      { e: '🌾', n: '麦子', x: 62, y: 60, f: 'wheat' },
      { e: '🚜', n: '拖拉机', x: 18, y: 20, f: 'tractor' },
      { e: '☀️', n: '太阳', x: 74, y: 6, f: 'sun' },
      { e: '🐑', n: '小羊', x: 48, y: 44, f: 'sheep' }
    ]
  },
  {
    key: 'sea', name: '海边', bg: 'sea',
    things: [
      { e: '🌊', n: '海浪', x: 8, y: 36, f: 'waves' },
      { e: '⛱️', n: '沙滩伞', x: 66, y: 58, f: 'umbrella' },
      { e: '🐚', n: '贝壳', x: 26, y: 74, f: 'seashell' },
      { e: '⛵', n: '帆船', x: 44, y: 22, f: 'sailboat' },
      { e: '🐟', n: '小鱼', x: 30, y: 12, f: 'fish' },
      { e: '☁️', n: '白云', x: 76, y: 6, f: 'cloud' }
    ]
  },
  {
    key: 'home', name: '家里', bg: 'home',
    things: [
      { e: '🛋️', n: '沙发', x: 10, y: 56, f: 'sofa' },
      { e: '📺', n: '电视', x: 44, y: 40, f: 'tv' },
      { e: '🚪', n: '门', x: 70, y: 48, f: 'door' },
      { e: '🪑', n: '椅子', x: 26, y: 74, f: 'chair' },
      { e: '💡', n: '台灯', x: 58, y: 74, f: 'lamp' },
      { e: '🐱', n: '小猫', x: 80, y: 74, f: 'cat' }
    ]
  },
  {
    key: 'forest', name: '森林', bg: 'forest',
    things: [
      { e: '🌲', n: '松树', x: 6, y: 46, f: 'pinetree' },
      { e: '🦌', n: '小鹿', x: 42, y: 62, f: 'deer' },
      { e: '🐿️', n: '松鼠', x: 66, y: 44, f: 'squirrel' },
      { e: '🍄', n: '蘑菇', x: 26, y: 76, f: 'mushroom' },
      { e: '🐦', n: '小鸟', x: 74, y: 16, f: 'bird' },
      { e: '🌈', n: '彩虹', x: 38, y: 6, f: 'rainbow' }
    ]
  },
  {
    key: 'shop', name: '超市', bg: 'shop',
    things: [
      { e: '🛒', n: '购物车', x: 8, y: 58, f: 'cart' },
      { e: '🍞', n: '面包', x: 22, y: 20, f: 'bread' },
      { e: '🥛', n: '牛奶', x: 44, y: 20, f: 'milk' },
      { e: '🍎', n: '苹果', x: 66, y: 20, f: 'apple' },
      { e: '🧀', n: '奶酪', x: 32, y: 72, f: 'cheese' },
      { e: '🐟', n: '小鱼', x: 62, y: 72, f: 'fish' }
    ]
  }
];

var curIdx = -1, curScene = null, activeEl = null;
var elScene = document.getElementById('scene');
var elFb = document.getElementById('feedback');
var elPrompt = document.getElementById('prompt');

var canSpeak = typeof window.speechSynthesis !== 'undefined';
function say(text) {
  if (!canSpeak) return;
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.92;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { }
}

function newScene() {
  var idx;
  do { idx = Math.floor(Math.random() * SCENES.length); } while (SCENES.length > 1 && idx === curIdx);
  curIdx = idx;
  curScene = SCENES[idx];
  activeEl = null;

  elScene.className = 'scene ' + curScene.bg;
  elScene.innerHTML = '';

  curScene.things.forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'thing';
    b.setAttribute('data-n', t.n);
    b.setAttribute('aria-label', t.n);
    b.style.left = t.x + '%';
    b.style.top = t.y + '%';

    /* 真实照片圆形卡片，加载失败时回退到 emoji */
    var img = document.createElement('img');
    img.className = 'ph';
    img.src = 'img/' + t.f + '.jpg';
    img.alt = t.n;
    img.decoding = 'async';
    img.addEventListener('error', function () {
      var em = document.createElement('span');
      em.className = 'e';
      em.textContent = t.e;
      if (img.parentNode) img.parentNode.replaceChild(em, img);
    });
    b.appendChild(img);

    var lb = document.createElement('span');
    lb.className = 'lb';
    lb.textContent = t.n;
    b.appendChild(lb);

    b.addEventListener('click', function () { tap(b, t); });
    elScene.appendChild(b);
  });

  elPrompt.textContent = '这是「' + curScene.name + '」，点一下里面的东西👇';
  elFb.className = 'feedback';
  elFb.textContent = '';
  window.__scene = curScene.name;
  window.__things = curScene.things.map(function (t) { return t.n; });
  voiceSpeak('新的一幅图，点一点里面的东西吧');
}

function tap(btn, t) {
  if (activeEl === btn) {
    btn.classList.remove('active');
    activeEl = null;
    elFb.className = 'feedback';
    elFb.textContent = '';
    return;
  }
  if (activeEl) activeEl.classList.remove('active');
  btn.classList.add('active');
  activeEl = btn;
  say(t.n + '！');
  elFb.className = 'feedback ok';
  elFb.textContent = t.n;
  window.__last = t.n;
}

document.getElementById('next').addEventListener('click', newScene);

function initSceneWords() { newScene(); }
function resetSceneWords() { newScene(); }
initSceneWords();

/* ===== 语音播报：进入游戏先读一遍玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '看图说话游戏。点一点图里的东西，听一听它叫什么。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进入游戏自动朗读；若浏览器拦截自动播放，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  try {
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
  setTimeout(function () {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
    var once = function () {
      document.removeEventListener('pointerdown', once);
      voiceSpeak(VOICE_TEXT);
    };
    document.addEventListener('pointerdown', once);
  }, 900);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.10);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();
</script>
</body>
</html>
