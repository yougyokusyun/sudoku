    { t: '一次意外的帮助', ty: 'order', g: 5, x: 'A. 她蹲下来，帮我把散落的书一本本捡起。\nB. 我抱着书往教室走，拐角处不小心撞到了人。\nC. 我连声道谢，她摆摆手说没关系。\nD. 书撒了一地，我一下子慌了神。',
      q: [
        ['正确的排列顺序是？', ['B→D→A→C', 'D→B→A→C', 'B→A→D→C', 'B→D→C→A'], 0, '先撞到人，书撒了，对方帮捡，最后道谢。'],
        ['哪一句交代了事情的起因？', ['A', 'B', 'C', 'D'], 1, '“不小心撞到了人”是起因。'],
        ['哪一句应该紧跟在“书撒了一地”之后？', ['A', 'B', 'C', 'D'], 0, '书撒了，对方才蹲下帮忙捡。']

  ],
  6: [
    { t: '桥', ty: 'center', g: 6, x: '村口有一座石桥，桥面被来来往往的脚步磨得发亮。春天，桥下流水潺潺；夏天，孩子们在桥洞里躲太阳；秋天，落叶一片片飘过桥栏。桥不说话，却记得每一个从这里走过的人：记得挑着担子赶集的汉子，记得背着书包上学的孩子，记得拄着拐杖探亲的老人。如今新桥修好了，老石桥仍静静地卧在那里。它早已不只是一座桥，而是村庄的一页记忆。',
      q: [
        ['短文的中心句是哪一句？', ['村口有一座石桥，桥面被来来往往的脚步磨得发亮。', '它早已不只是一座桥，而是村庄的一页记忆。', '春天，桥下流水潺潺；夏天，孩子们在桥洞里躲太阳。'], 1, '最后一句点明老桥的意义。'],
        ['中心句在短文的什么位置？', ['开头', '中间', '结尾'], 2, '中心句是最后一句，放在结尾。'],
        ['“桥不说话，却记得每一个从这里走过的人”这句在文中起什么作用？', ['用具体的人事说明桥承载着村庄的记忆', '说明桥真的会说话', '说明过桥的人非常多'], 0, '“记得”是把桥当作村庄记忆的见证。'],
        ['本文的中心句表达了作者怎样的情感？', ['对老桥的珍惜与怀念', '对新桥的不满', '对赶集的向往'], 0, '“一页记忆”写出珍惜和怀念。']
      ] },
    { t: '一封没有寄出的信', ty: 'gist', g: 6, x: '整理抽屉时，我翻出一封没贴邮票的信，信封上写着“给十年后的我”。那是小学毕业前写的，字歪歪扭扭。信里说，希望自己还能记得后操场的梧桐树，记得同桌借橡皮时说的那句“下次还你”，记得班主任站在门口送我们放学的样子。我读完，忽然笑了，又有点想哭。十年过去了，梧桐树还在，同桌早已去了别的城市，班主任也退休了。原来有些东西会走远，有些记忆却一直留在原地等我。',
      q: [
        ['这段话主要写了什么？', ['“我”重读十年前写给自己的信，有所感触', '梧桐树的样子', '同桌去了别的城市'], 0, '全文由一封旧信引出回忆和感受。'],
        ['最适合的段意是哪一项？', ['一封旧信引出的回忆', '毕业前的日子', '班主任退休了'], 0, '旧信是线索，重点是回忆。'],
        ['这段话表达了怎样的情感？', ['对童年时光的怀念', '对同桌的抱怨', '对写信的后悔'], 0, '“笑了又想哭”“留在原地等我”都是怀念。']
      ] },
    { t: '渡口', ty: 'word', g: 6, x: '镇子边上有个老渡口，一只木船，一位船工。河水涨的时候，船工把篙撑得稳稳的，一趟一趟把人送过河；河水落的时候，他蹲在船头补网，嘴里哼着不成调的小曲。有人劝他到城里找活干，他笑了笑，说这河上总得有人守着。黄昏，最后一班船靠岸，他把缆绳在木桩上绕了三圈，才慢慢往家走。暮色里，渡口安静得像一句没说完的话。',
      q: [
        ['“船工把篙撑得稳稳的”中的“稳稳的”是什么意思？', ['撑得很稳当，船不晃', '撑得很快', '撑得很轻'], 0, '“稳稳的”写的是船行得平稳。'],
        ['“不成调的小曲”是什么意思？', ['随意哼唱，没有固定曲调', '非常难听的歌', '别人写好的歌'], 0, '“不成调”是随口哼，没有固定曲调。'],
        ['“这河上总得有人守着”的“守”是什么意思？', ['留在这里照看渡口', '看守犯人', '守着钱财'], 0, '船工留在渡口，是为了照看它、方便过河的人。'],
        ['“暮色”指的是什么时候？', ['傍晚天快黑的时候', '清晨天刚亮的时候', '半夜'], 0, '前面写“黄昏，最后一班船靠岸”，暮色就是傍晚。']
      ] },
    { t: '修好的闹钟', ty: 'order', g: 6, x: 'A. 我拆开外壳，发现里面有一根细线断了。\nB. 这只小闹钟是爸爸送我的生日礼物，前几天它忽然不走了。\nC. 我找来一根细线，照着原来的样子接好。\nD. 上紧发条，秒针又“嗒嗒”地走起来，我心里一下子踏实了。',
      q: [
        ['正确的排列顺序是？', ['B→A→C→D', 'A→B→C→D', 'B→C→A→D', 'B→A→D→C'], 0, '先写闹钟不走了，再拆开发现问题、接好线，最后恢复走动。'],
        ['哪一句写的是闹钟修好后的样子？', ['A', 'B', 'C', 'D'], 3, '“秒针又嗒嗒地走起来”说明修好了。'],
        ['哪一句应该排在 C 的前面？', ['A', 'B', 'D'], 0, '先发现细线断了，才能照着原样接好。'],
        ['如果把 D 放到最前面，这段话会怎样？', ['不合逻辑，因为还没修好', '更通顺', '意思完全不变'], 0, 'D 是结果，不能放在开头。']
      ] }
  ]
};

var KEY_BEST = 'prc.best', KEY_TIER = 'prc.tier', KEY_RIGHT = 'prc.right';
var KEY_MODE = 'prc.mode', KEY_GRADE = 'prc.grade', KEY_TYPE = 'prc.type';
var TIER_LABEL = ['', '第 1 档 · 1~2 年级', '第 2 档 · 3~4 年级', '第 3 档 · 5~6 年级'];
var GRADE_LABEL = ['全部年级', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级'];
var TYPE_LABEL = { center: '找中心句', gist: '概括段意', word: '词义语境', order: '句子排序' };
var TYPE_ORDER = ['center', 'gist', 'word', 'order'];

var state = { mode: 'basic', tier: 1, grade: 0, type: 'all', order: [], pos: 0, qi: 0, streak: 0, best: 0, right: 0, locked: false, timer: null, cur: null };
var firstTapDone = false;

var elMode = document.getElementById('modeBar');
var elGrade = document.getElementById('gradeBar');
var elType = document.getElementById('typeBar');
var elTitle = document.getElementById('storyTitle');
var elText = document.getElementById('storyText');
var elQno = document.getElementById('qno');
var elQp = document.getElementById('qprompt');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');
var elRight = document.getElementById('right');
var elPno = document.getElementById('pno');
var elPtotal = document.getElementById('ptotal');

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function speak(t, o) { if (window.XNLY && XNLY.voice) XNLY.voice.speak(t, o || {}); }

function updateStats() {
  elStreak.textContent = state.streak;
  elRight.textContent = state.right;
  elPno.textContent = String(state.pos + 1);
  elPtotal.textContent = String(state.total);
}

function makeBtn(label, on, fn) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'tier' + (on ? ' on' : '');
  b.textContent = label;
  b.addEventListener('click', fn);
  return b;
}

/* 三行：模式 / 年级（或基础档位）/ 题型 */
function renderBars() {
  elMode.innerHTML = '';
  elMode.appendChild(makeBtn('📚 基础 60 篇', state.mode === 'basic', function () {
    if (state.mode === 'basic') return;
    state.mode = 'basic'; safeSet(KEY_MODE, state.mode);
    startRound();
  }));
  elMode.appendChild(makeBtn('🧠 新题型 100 题', state.mode === 'new', function () {
    if (state.mode === 'new') return;
    state.mode = 'new'; safeSet(KEY_MODE, state.mode);
    startRound();
  }));

  elGrade.innerHTML = '';
  elType.innerHTML = '';

  if (state.mode === 'basic') {
    [1, 2, 3].forEach(function (k) {
      elGrade.appendChild(makeBtn(TIER_LABEL[k], k === state.tier, function () {
        if (k === state.tier) return;
        state.tier = k; safeSet(KEY_TIER, state.tier);
        startRound();
      }));
    });
  } else {
    GRADE_LABEL.forEach(function (label, g) {
      elGrade.appendChild(makeBtn(label, g === state.grade, function () {
        if (g === state.grade) return;
        state.grade = g; safeSet(KEY_GRADE, state.grade);
        startRound();
      }));
    });
    elType.appendChild(makeBtn('全部题型', state.type === 'all', function () {
      if (state.type === 'all') return;
      state.type = 'all'; safeSet(KEY_TYPE, state.type);
      startRound();
    }));
    TYPE_ORDER.forEach(function (k) {
      elType.appendChild(makeBtn(TYPE_LABEL[k], k === state.type, function () {
        if (k === state.type) return;
        state.type = k; safeSet(KEY_TYPE, state.type);
        startRound();
      }));
    });
  }

  elGrade.style.display = elGrade.children.length ? '' : 'none';
  elType.style.display = elType.children.length ? '' : 'none';
}

/* 当前一轮的篇目池：基础=当前档 20 篇；新题型=年级 + 题型交叉筛选 */
function getPool() {
  if (state.mode === 'basic') return P[state.tier] || [];
  var arr = [];
  var gs = state.grade ? [state.grade] : [1, 2, 3, 4, 5, 6];
  gs.forEach(function (g) {
    (P2[g] || []).forEach(function (p) {
      if (state.type === 'all' || p.ty === state.type) arr.push(p);
    });
  });
  return arr;
}

function startRound() {
  clearTimeout(state.timer);
  var pool = getPool();
  state.deck = XNLY.deck.make(pool,
    'read-comp.' + state.mode + '.' + state.tier + '.' + state.grade + '.' + state.type,
    { head: 5, id: function (p, i) { return String(p.t || p.title || p[0] || ('#' + i)); } });
  state.total = pool.length;
  state.pos = 0; state.qi = 0; state.streak = 0; state.locked = false; state.right = 0;
  renderBars(); updateStats(); renderPassage();
}

function renderPassage() {
  clearTimeout(state.timer);
  state.locked = false;
  if (state.pos >= state.total) {
    elTitle.textContent = state.mode === 'basic' ? '🎉 这一档读完啦！' : '🎉 这一组读完啦！';
    if (state.mode === 'basic') {
      elText.textContent = '答对 ' + state.right + ' 题，连对最多 ' + state.best + ' 次。换一档再试试吧！';
      elFb.textContent = '点击上面的档位，可以换一档重新读。';
    } else {
      elText.textContent = '这一组共 ' + state.total + ' 篇，答对 ' + state.right + ' 题，连对最多 ' + state.best + ' 次。';
      elFb.textContent = '点上面的年级或题型，可以换一组继续读。';
    }
    elQp.textContent = ''; elOpts.innerHTML = ''; elQno.textContent = '';
    elFb.className = 'feedback ok';
    if (window.XNLY && XNLY.sound) XNLY.sound.win();
    speak('这一组读完啦，真棒！');
    return;
  }
  state.cur = state.deck.next();
  state.qi = 0;
  elTitle.textContent = state.cur.t;
  elText.textContent = state.cur.x;
  updateStats();
  if (firstTapDone) speak(state.cur.x);
  renderQuestion();
}

function renderQuestion() {
  clearTimeout(state.timer);
  state.locked = false;
  var qs = state.cur.q;
  var q = qs[state.qi];
  elQno.textContent = '第 ' + (state.qi + 1) + ' 题 / 共 ' + qs.length + ' 题';
  elQp.innerHTML = String(q[0]).replace(/\n/g, '<br>');
  elOpts.innerHTML = '';
  q[1].forEach(function (text, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = text;
    b.dataset.i = String(i);
    b.addEventListener('click', function () { answer(i, b, q); });
    elOpts.appendChild(b);
  });
  elFb.className = 'feedback';
  elFb.textContent = '';
}

function answer(i, btn, q) {
  if (state.locked) return;
  state.locked = true;
  var correct = (i === q[2]);
  if (correct) {
    btn.classList.add('good');
    state.streak++;
    state.right++;
    if (state.streak > state.best) { state.best = state.streak; safeSet(KEY_BEST, state.best); }
    if (window.XNLY && XNLY.mark) XNLY.mark('right');
    elFb.className = 'feedback ok';
    elFb.innerHTML = '✅ 答对啦！<small>' + q[3] + '</small>';
    speak('答对啦。' + q[3]);
  } else {
    btn.classList.add('bad', 'shake');
    state.streak = 0;
    if (window.XNLY && XNLY.mark) XNLY.mark('wrong');
    Array.prototype.forEach.call(elOpts.children, function (b) {
      if (Number(b.dataset.i) === q[2]) b.classList.add('good');
    });
    elFb.className = 'feedback bad';
    elFb.innerHTML = '❌ 再读一读短文～正确答案是：' + q[1][q[2]] + '<small>' + q[3] + '</small>';
    speak('再读一读。' + q[3]);
  }
  Array.prototype.forEach.call(elOpts.children, function (b) { b.disabled = true; });
  updateStats();

  state.qi++;
  state.timer = setTimeout(function () {
    if (state.qi >= state.cur.q.length) {
      state.pos++;
      renderPassage();
    } else {
      renderQuestion();
    }
  }, correct ? 2000 : 2600);
}

document.getElementById('spBtn').addEventListener('click', function () {
  if (state.cur) speak(state.cur.x);
});

/* 首点补读：进页面自动朗读可能被浏览器拦截，第一次点击/触摸时补读当前短文 */
function firstTap() {
  if (firstTapDone) return;
  firstTapDone = true;
  if (window.XNLY && XNLY.voice && XNLY.voice.unlock) XNLY.voice.unlock();
  if (state.cur) speak(state.cur.x);
}
document.addEventListener('pointerdown', firstTap, true);
if (!window.PointerEvent) document.addEventListener('touchstart', firstTap, { capture: true, passive: true });

(function init() {
  var m = safeGet(KEY_MODE);
  state.mode = (m === 'new') ? 'new' : 'basic';
  var t = parseInt(safeGet(KEY_TIER), 10);
  state.tier = (t >= 1 && t <= 3) ? t : 1;
  var g = parseInt(safeGet(KEY_GRADE), 10);
  state.grade = (g >= 0 && g <= 6) ? g : 0;
  var ty = safeGet(KEY_TYPE);
  state.type = TYPE_LABEL[ty] ? ty : 'all';
  var b = parseInt(safeGet(KEY_BEST), 10);
  state.best = isNaN(b) || b < 0 ? 0 : b;
  state.right = 0;
  startRound();
})();
</script>
