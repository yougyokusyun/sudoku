      q: [

    { t: '母亲的白发', x: '一天，我帮母亲梳头，忽然发现她鬓角有了几根白发。我愣住了：在我心里，母亲一直很年轻。她却笑着说，人都会老的。那一刻，我有点想哭，也忽然懂得了该多为她做点什么。',

    { t: '蚂蚁的智慧', x: '科学家发现，蚂蚁虽然很小，却很会合作。遇到搬不动的大食物，它们会叫来同伴，一起用力。遇到下雨，它们会提前把家搬到高处。它们没有语言，却能用触角传递信息。小小的蚂蚁，藏着大大的智慧。',

    { t: '那双布鞋', x: '奶奶给我做过一双布鞋，针脚密密的，穿在脚上很暖。后来我长大了，布鞋穿不下了，就被放在柜子最底层。有一次整理东西，我又看见了它，鞋底已经磨得很薄。我舍不得扔，因为那里面有奶奶一针一线的时光。',

        ['为什么舍不得扔？', ['里面有奶奶的爱和时光', '鞋子很贵', '还能再穿'], 0, '最后一句说明了原因。']

    { t: '萤火虫', x: '夏夜的田野里，萤火虫一闪一闪地飞。它们的光并不亮，却能照亮脚边的一小片草叶。小时候，我总想抓几只放进瓶子里。长大后才明白，最美的光，应该留在它自己的夜空里。',

        ['长大后“我”明白了什么？', ['美好的东西应留在自然里', '萤火虫很亮', '瓶子很好玩'], 0, '“最美的光，应该留在它自己的夜空里”。']
      ] },
    { t: '修伞的老人', x: '巷口有一位修伞的老人，摊子很小，工具却很整齐。下雨天，他总把修好的伞一把把撑开晾着。有人劝他涨价，他摇摇头说，来修伞的都是老街坊。后来巷子改造，老人不见了，可每到雨天，我还会想起那排撑开的伞。',
      q: [
        ['修伞老人的摊子怎么样？', ['很小但工具整齐', '很大很气派', '没有工具'], 0, '“摊子很小，工具却很整齐”。'],
        ['有人劝老人做什么？', ['涨价', '搬家', '关门'], 0, '“有人劝他涨价”。'],
        ['短文表达了什么？', ['对老人的怀念和敬意', '伞很便宜', '下雨很麻烦'], 0, '结尾写每到雨天还会想起他。']
      ] }
  ]

var KEY_BEST = 'prc.best', KEY_TIER = 'prc.tier', KEY_RIGHT = 'prc.right';
var state = { tier: 1, order: [], pos: 0, qi: 0, streak: 0, best: 0, right: 0, locked: false, timer: null, cur: null };

var elTiers = document.getElementById('tiers');
var elTitle = document.getElementById('storyTitle');
var elText = document.getElementById('storyText');
var elQno = document.getElementById('qno');
var elQp = document.getElementById('qprompt');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');
var elRight = document.getElementById('right');
var elPno = document.getElementById('pno');

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function speak(t, o) { if (window.XNLY && XNLY.voice) XNLY.voice.speak(t, o || {}); }

function updateStats() {
  elStreak.textContent = state.streak;
  elRight.textContent = state.right;
  elPno.textContent = String(state.pos + 1);
}

function renderTiers() {
  elTiers.innerHTML = '';
  Object.keys(P).forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tier' + (Number(k) === state.tier ? ' on' : '');
    b.textContent = ['', '第 1 档 · 1~2 年级', '第 2 档 · 3~4 年级', '第 3 档 · 5~6 年级'][k];
    b.addEventListener('click', function () {
      if (Number(k) === state.tier) return;
      state.tier = Number(k); safeSet(KEY_TIER, state.tier);
      startTier();
    });
    elTiers.appendChild(b);
  });
}

function startTier() {
  clearTimeout(state.timer);
  state.order = shuffle(P[state.tier]);
  state.pos = 0; state.qi = 0; state.streak = 0; state.locked = false;
  renderTiers(); updateStats(); renderPassage();
}

function renderPassage() {
  clearTimeout(state.timer);
  state.locked = false;
  if (state.pos >= state.order.length) {
    elTitle.textContent = '🎉 这一档读完啦！';
    elText.textContent = '答对 ' + state.right + ' 题，连对最多 ' + state.best + ' 次。换一档再试试吧！';
    elQp.textContent = ''; elOpts.innerHTML = ''; elQno.textContent = '';
    elFb.className = 'feedback ok';
    elFb.textContent = '点击上面的档位，可以换一档重新读。';
    if (window.XNLY && XNLY.sound) XNLY.sound.win();
    speak('这一档读完啦，真棒！');
    return;
  }
  state.cur = state.order[state.pos];
  state.qi = 0;
  elTitle.textContent = state.cur.t;
  elText.textContent = state.cur.x;
  updateStats();
  speak(state.cur.x);
  renderQuestion();
}

function renderQuestion() {
  clearTimeout(state.timer);
  state.locked = false;
  var qs = state.cur.q;
  var q = qs[state.qi];
  elQno.textContent = '第 ' + (state.qi + 1) + ' 题 / 共 ' + qs.length + ' 题';
  elQp.textContent = q[0];
  elOpts.innerHTML = '';
  q[1].forEach(function (text, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = text;
    b.dataset.i = String(i);
    b.addEventListener('click', function () { answer(i, b, q); });
    elOpts.appendChild(b);
  });
  elFb.className = 'feedback';
  elFb.textContent = '';
}

function answer(i, btn, q) {
  if (state.locked) return;
  state.locked = true;
  var correct = (i === q[2]);
  if (correct) {
    btn.classList.add('good');
    state.streak++;
    state.right++;
    if (state.streak > state.best) { state.best = state.streak; safeSet(KEY_BEST, state.best); }
    if (window.XNLY && XNLY.mark) XNLY.mark('right');
    elFb.className = 'feedback ok';
    elFb.innerHTML = '✅ 答对啦！<small>' + q[3] + '</small>';
    speak('答对啦。' + q[3]);
  } else {
    btn.classList.add('bad', 'shake');
    state.streak = 0;
    if (window.XNLY && XNLY.mark) XNLY.mark('wrong');
    Array.prototype.forEach.call(elOpts.children, function (b) {
      if (Number(b.dataset.i) === q[2]) b.classList.add('good');
    });
    elFb.className = 'feedback bad';
    elFb.innerHTML = '❌ 再读一读短文～正确答案是：' + q[1][q[2]] + '<small>' + q[3] + '</small>';
    speak('再读一读。' + q[3]);
  }
  Array.prototype.forEach.call(elOpts.children, function (b) { b.disabled = true; });
  updateStats();

  state.qi++;
  state.timer = setTimeout(function () {
    if (state.qi >= state.cur.q.length) {
      state.pos++;
      renderPassage();
    } else {
      renderQuestion();
    }
  }, correct ? 2000 : 2600);
}

document.getElementById('spBtn').addEventListener('click', function () {
  if (state.cur) speak(state.cur.x);
});

(function init() {
  var t = parseInt(safeGet(KEY_TIER), 10);
  state.tier = (t >= 1 && t <= 3) ? t : 1;
  var b = parseInt(safeGet(KEY_BEST), 10);
  state.best = isNaN(b) || b < 0 ? 0 : b;
  var r = parseInt(safeGet(KEY_RIGHT), 10);
  state.right = isNaN(r) || r < 0 ? 0 : r;
  /* 答对数是本轮统计，不跨轮累加 */
  state.right = 0;
  startTier();
})();
</script>
