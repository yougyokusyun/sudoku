<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--accent:#e0559b;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffeef6,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#eef3ff,transparent 55%),
             linear-gradient(160deg,#fff8fc,#f5f8ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,.82);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:10px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);overflow:hidden;}
.pic{width:min(94vw,520px);aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#fff;
  border:2px solid rgba(224,85,155,.18);flex:none;}
.pic img{width:100%;height:100%;object-fit:cover;display:block;}
.bank{width:min(94vw,660px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:none;}
.word{background:#fff;border:1px solid rgba(36,59,83,.12);border-radius:999px;padding:4px 10px;
  font-size:.8rem;font-weight:800;color:#4a5f78;}
.word.hi{background:#ffe9f3;border-color:rgba(224,85,155,.35);color:#b03a72;}

.slots{width:min(94vw,660px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none;}
.slot{background:#fff;border:2px solid rgba(36,59,83,.10);border-radius:14px;padding:8px 10px;text-align:left;}
.slot .lb{font-size:.7rem;font-weight:800;color:#8aa0b8;letter-spacing:1px;}
.slot .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.slot .opts button{min-height:34px;padding:2px 12px;border-radius:999px;border:1px solid rgba(36,59,83,.12);
  background:#f7fafd;font-family:inherit;font-weight:800;font-size:.82rem;color:#3b5370;cursor:pointer;}
.slot .opts button.on{background:#ffe9f3;border-color:rgba(224,85,155,.5);color:#b03a72;}

.sentence{width:min(94vw,660px);min-height:52px;background:#fff;border:2px dashed rgba(224,85,155,.35);
  border-radius:14px;padding:8px 12px;font-size:clamp(.95rem,2.6vh,1.15rem);font-weight:800;line-height:1.6;
  color:#7a3157;display:flex;align-items:center;justify-content:center;text-align:center;flex:none;}
.sentence.empty{color:#a9b7c6;font-weight:700;}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;flex:none;}
.btn{min-height:44px;padding:0 18px;border:2px solid rgba(36,59,83,.10);border-radius:999px;background:#fff;
  color:var(--ink);font-family:inherit;font-weight:800;font-size:.86rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(36,59,83,.10);}
.btn.primary{border-color:rgba(224,85,155,.5);color:#fff;background:linear-gradient(135deg,#ff8fc0,#e0559b);}
.btn.warn{border-color:rgba(240,161,26,.5);color:#a06a00;background:#fff7e0;}
.btn.rec{color:#b03a72;border-color:rgba(224,85,155,.35);}
.btn.rec.on{background:#ffe9f3;}
.recbox{display:none;}
.recbox.show{display:inline-flex;}

@media (max-height:520px){
  body{padding:6px 10px;gap:5px;}
  .stage{gap:5px;padding:6px;}
  .pic{width:min(46vw,300px);}
  .bank .word{font-size:.72rem;padding:2px 8px;}
  .slot{padding:5px 8px;}
  .slot .opts button{min-height:30px;font-size:.74rem;}
  .sentence{min-height:40px;font-size:.9rem;}
  .btn{min-height:36px;font-size:.78rem;}
}

var V = (window.XNLY && window.XNLY.voice) || null;
function speak(t) {
  if (V && V.speak) { V.speak(t, { rate: 0.9 }); return; }
  if (!window.speechSynthesis) return;
  try {
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN'; u.rate = 0.88; u.pitch = 1.12;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { }
}

var state = { i: 0, picks: [null, null, null, null], cur: null };
var sceneDeck = XNLY.deck.make(SCENES, 'pic-write', { head: 5 });
var elPhoto = document.getElementById('photo');
var elBank = document.getElementById('bank');
var elSlots = document.getElementById('slots');
var elSen = document.getElementById('sentence');
var elIdx = document.getElementById('idx');

var LABELS = ['⏰ 什么时候', '🧒 谁', '📍 在哪里', '🎈 做什么'];
var KEYS = ['when', 'who', 'where', 'what'];

function bankWords(s) {
  var all = [];
  KEYS.forEach(function (k) { s[k].forEach(function (w) { if (all.indexOf(w) < 0) all.push(w); }); });
  (s.more || []).forEach(function (w) { if (all.indexOf(w) < 0) all.push(w); });
  return all;
}

function render() {
  var s = state.cur = sceneDeck.next();
  elIdx.textContent = state.i + 1;
  elPhoto.src = s.img;
  elPhoto.alt = '看图写话：' + s.emo;

  elBank.innerHTML = '';
  bankWords(s).forEach(function (w) {
    var sp = document.createElement('span');
    sp.className = 'word';
    sp.textContent = w;
    elBank.appendChild(sp);
  });

  elSlots.innerHTML = '';
  KEYS.forEach(function (k, gi) {
    var box = document.createElement('div');
    box.className = 'slot';
    var lb = document.createElement('div');
    lb.className = 'lb';
    lb.textContent = LABELS[gi];
    box.appendChild(lb);
    var row = document.createElement('div');
    row.className = 'opts';
    s[k].forEach(function (w) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = w;
      if (state.picks[gi] === w) b.className = 'on';
      b.addEventListener('click', function () {
        state.picks[gi] = w;
        Array.prototype.forEach.call(row.children, function (x) { x.className = ''; });
        b.className = 'on';
        updateSentence();
        speak(w);
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    elSlots.appendChild(box);
  });

  state.picks = [null, null, null, null];
  elSen.className = 'sentence empty';
  elSen.textContent = '按顺序选一选，就能连成一句话 ✨';
}

function sentenceText() {
  var s = SCENES[state.i];
  var p = state.picks.slice();
  if (!p[0] || !p[1] || !p[2] || !p[3]) return '';
  var a = p[0], b = p[1], c = p[2], d = p[3];
  return a + '，' + b + '在' + c + d + '。';
}
function updateSentence() {
  var t = sentenceText();
  if (!t) {
    elSen.className = 'sentence empty';
    elSen.textContent = '还差 ' + state.picks.filter(function (x) { return !x; }).length + ' 格，继续选 ✨';
    return;
  }
  elSen.className = 'sentence';
  elSen.textContent = '📝 ' + t;
}

document.getElementById('read').addEventListener('click', function () {
  var t = sentenceText();
  if (t) { speak(t); return; }
  var s = SCENES[state.i];
  speak('看看图，想一想：什么时候，谁，在哪里，做什么？');
});
window.replayCurrent = function () {
  var t = sentenceText();
  if (t) { speak(t); return; }
  speak('看看图，想一想：什么时候，谁，在哪里，做什么？');
};
document.getElementById('next').addEventListener('click', function () {
  state.i = (state.i + 1) % SCENES.length;
  render();
});

/* ---------- 录音：不支持就静默降级（按钮保持隐藏） ---------- */
var elRec = document.getElementById('rec');
var recorder = null, chunks = [], recUrl = null, recTimer = null;
function recSupported() {
  try {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  } catch (e) { return false; }
}
function stopRec() {
  try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (e) { }
  clearTimeout(recTimer);
  elRec.classList.remove('on');
  elRec.textContent = '🎙️ 录一录';
}
function startRec() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    try {
      recorder = new MediaRecorder(stream);
    } catch (e) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      return;
    }
    chunks = [];
    recorder.ondataavailable = function (ev) {
      if (ev.data && ev.data.size) chunks.push(ev.data);
    };
    recorder.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      try {
        if (recUrl) URL.revokeObjectURL(recUrl);
        var blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        recUrl = URL.createObjectURL(blob);
      } catch (e) { }
    };
    recorder.start();
    elRec.classList.add('on');
    elRec.textContent = '⏹️ 停止录音';
    recTimer = setTimeout(stopRec, 15000);
  }).catch(function () {
    /* 没有麦克风权限 / 不支持：静默降级，不弹错误 */
    elRec.classList.remove('show');
    elRec.style.display = 'none';
  });
}
if (recSupported()) {
  elRec.classList.add('show');
  elRec.addEventListener('click', function () {
    if (recorder && recorder.state === 'recording') { stopRec(); return; }
    startRec();
  });
} else {
  elRec.style.display = 'none';
}

render();
window.__picWrite = { SCENES: SCENES, bankWords: bankWords };
