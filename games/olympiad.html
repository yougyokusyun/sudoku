<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>小学奥数思维 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#00897b;--accent-d:#00695c;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#e0f5f1,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#f7fdfb,#f3f9ff);
  min-height:100dvh;height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
h1{font-size:1.15rem;color:var(--accent-d);}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;padding:7px 14px;font-weight:800;font-size:.85rem;
  box-shadow:0 3px 10px rgba(36,59,83,.10);}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.bar .lbl{font-size:.82rem;font-weight:900;color:#6b7b90;}
.chip{border:2px solid #dfeae7;background:#fff;border-radius:999px;padding:7px 15px;font-family:inherit;
  font-size:.9rem;font-weight:800;color:var(--ink);cursor:pointer;min-height:42px;transition:.12s;}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(0,137,123,.28);}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
.stage-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  width:100%;margin:auto;padding:4px 0;}
.topic-tag{font-size:.9rem;font-weight:900;color:var(--accent);letter-spacing:1px;}
.qcard{width:min(720px,100%);background:#fff;border-radius:20px;padding:16px 20px;
  box-shadow:0 6px 18px rgba(36,59,83,.12);text-align:center;}
.qtext{font-size:1.45rem;font-weight:900;line-height:1.5;}
.qmeta{font-size:.8rem;color:#9aa8ba;font-weight:700;margin-top:8px;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(720px,100%);}
.opt{min-height:62px;border:2px solid #e2e9f2;border-radius:16px;background:#fff;font-weight:900;
  font-size:1.3rem;color:var(--ink);cursor:pointer;padding:10px;transition:transform .12s;
  font-family:inherit;box-shadow:0 4px 12px rgba(36,59,83,.08);}
.opt:active{transform:scale(.97);}
.opt.correct{background:#eaf8ee;color:var(--ok);border-color:var(--ok);}
.opt.wrong{background:#fff0f0;color:var(--bad);border-color:var(--bad);}
.opt:disabled{cursor:default;}
.feedback{min-height:34px;font-size:1.25rem;font-weight:900;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
.explain{width:min(720px,100%);background:#eef8f6;border-radius:14px;padding:12px 16px;
  font-size:1rem;font-weight:700;line-height:1.55;color:#1c5b52;display:none;}
.explain.show{display:block;}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.stat-pill{background:#fff;border-radius:999px;padding:5px 13px;font-size:.82rem;font-weight:800;
  box-shadow:0 3px 10px rgba(36,59,83,.08);white-space:nowrap;}
.stat-pill b{color:var(--accent);}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.act{border:none;border-radius:14px;padding:10px 20px;font-family:inherit;font-size:.95rem;font-weight:900;
  cursor:pointer;min-height:46px;box-shadow:0 4px 12px rgba(36,59,83,.12);}
.act.ghost{background:#fff;color:var(--ink);}
.act.primary{background:var(--accent);color:#fff;}
.hide{display:none!important;}
.topic-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;
  width:min(760px,100%);margin:auto;}
.topic-card{background:#fff;border:2px solid #dfeae7;border-radius:16px;padding:16px;text-align:center;
  cursor:pointer;box-shadow:0 4px 12px rgba(36,59,83,.08);transition:.12s;}
.topic-card .ic{font-size:1.8rem;display:block;margin-bottom:6px;}
.topic-card .nm{font-weight:900;font-size:1.05rem;}
.topic-card .ds{font-size:.78rem;color:#8a97a8;font-weight:700;margin-top:4px;}
.topic-card:active{transform:scale(.97);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .4s ease;} .shake{animation:shake .4s ease;}
@media (max-height:430px){body{padding:8px;gap:6px;}h1{font-size:1rem;}.qtext{font-size:1.1rem;}
  .opt{min-height:48px;font-size:1.05rem;}.feedback{min-height:24px;font-size:1rem;}}
</style>
</head>
<body>
<header>
  <h1>🧮 小学奥数思维</h1>
  <a class="back" href="../index.html">🏠 首页</a>
</header>

<div id="selGrade" class="bar">
  <span class="lbl">选择年级</span>
  <button class="chip" data-g="low">低年级 · 1–2 年级</button>
  <button class="chip" data-g="mid">中年级 · 3–4 年级</button>
  <button class="chip" data-g="high">高年级 · 5–6 年级</button>
</div>

<div id="selTopic" class="bar hide">
  <span class="lbl">选择专题</span>
  <button class="chip" data-mode="bank">📚 闯关题库</button>
  <button class="chip" data-mode="random">🎲 随机挑战</button>
</div>

<div class="stage" id="stage">
  <div class="stage-inner" id="topicView">
    <div class="topic-list" id="topicList"></div>
  </div>
  <div class="stage-inner hide" id="quizView">
    <div class="topic-tag" id="topicTag">专题</div>
    <div class="qcard">
      <div class="qtext" id="qtext">题目</div>
      <div class="qmeta" id="qmeta"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
    <div class="stats">
      <span class="stat-pill">✅ 答对 <b id="correct">0</b></span>
      <span class="stat-pill">❌ 答错 <b id="wrong">0</b></span>
      <span class="stat-pill">🔥 连对 <b id="streak">0</b></span>
      <span class="stat-pill">🏆 最佳 <b id="best">0</b></span>
    </div>
    <div class="btn-row">
      <button class="act ghost" id="nextBtn">下一题 →</button>
      <button class="act ghost" id="backTopics">← 换专题</button>
      <button class="act primary" id="replayBtn">🔊 听题</button>
    </div>
  </div>
</div>

<script>
/* ===== 生成器 + 元数据（内联） ===== */
/* 小学奥数思维 · 题目生成器（纯函数，无 DOM 依赖）
 * 所有数值题的答案由公式计算得出，避免人工编题出错。
 * gen(grade, topicId, seed) -> {q, o:[选项字符串], a:正确答案字符串, e:解析}
 */
var OLY_TOPICS = {
  low: [
    { id: 'guilv',    name: '找规律',   icon: '🔢', desc: '看数列，找下一个数' },
    { id: 'pai dui',  name: '排队问题', icon: '🚶', desc: '前数后数，算总人数' },
    { id: 'qiaosuan', name: '趣味巧算', icon: '⚡', desc: '凑整、速算小技巧' },
    { id: 'tuxing',   name: '图形计数', icon: '🔺', desc: '数线段、数图形' },
    { id: 'jianyi',   name: '简单推理', icon: '🕵️', desc: '比高矮、比大小' }
  ],
  mid: [
    { id: 'hecha',    name: '和差倍',   icon: '⚖️', desc: '和倍、差倍、和差' },
    { id: 'zhishu',   name: '植树问题', icon: '🌳', desc: '间隔与棵数' },
    { id: 'jitu',     name: '鸡兔同笼', icon: '🐰', desc: '头与脚的经典题' },
    { id: 'zhouqi',   name: '周期问题', icon: '🔄', desc: '找第几个是什么' },
    { id: 'huanyuan', name: '还原倒推', icon: '🔙', desc: '从结果倒着推' }
  ],
  high: [
    { id: 'xingcheng', name: '行程相遇', icon: '🚗', desc: '相遇、追及问题' },
    { id: 'gongcheng', name: '工程问题', icon: '🏗️', desc: '合作完成要几天' },
    { id: 'chouti',    name: '抽屉原理', icon: '🗄️', desc: '至少有几个一样' },
    { id: 'nongdu',    name: '浓度比例', icon: '🧪', desc: '糖水浓度计算' },
    { id: 'luoji',     name: '逻辑推理', icon: '🧠', desc: '真假话与排除' }
  ]
};

var GRADE_NAME = { low: '低年级 · 1–2 年级', mid: '中年级 · 3–4 年级', high: '高年级 · 5–6 年级' };

function rng(seed) {
  var x = (seed * 2654435761) >>> 0;
  return function () { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
}
function pickInt(r, a, b) { return a + Math.floor(r() * (b - a + 1)); }
function shuffle(r, arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function opts(r, ansNum, nums) {
  var set = [], i;
  set.push(ansNum);
  for (i = 0; i < nums.length && set.length < 4; i++) {
    if (nums[i] !== ansNum && set.indexOf(nums[i]) < 0) set.push(nums[i]);
  }
  var extra = 1;
  while (set.length < 4) { var v = ansNum + extra; if (set.indexOf(v) < 0) set.push(v); extra++; }
  return shuffle(r, set).map(String);
}
function q(o) { return o; }

function genQuestion(grade, topic, seed) {
  var r = rng(seed + 1);
  switch (topic) {
    /* ============ 低年级 ============ */
    case 'guilv': {
      var kind = seed % 5, seq = [], ans, why;
      if (kind === 0) { // 等差
        var a = pickInt(r, 1, 9), d = pickInt(r, 2, 6);
        for (var i = 0; i < 5; i++) seq.push(a + i * d);
        ans = a + 5 * d; why = '每次加 ' + d;
        return q({ q: '找规律填数：' + seq.join('、') + '、（  ）', o: opts(r, ans, [ans - d, ans + d, ans + 1]), a: String(ans), e: '相邻两数相差 ' + d + '，所以下一个是 ' + seq[4] + '+' + d + '=' + ans + '。' });
      }
      if (kind === 1) { // 等比×2
        var s = pickInt(r, 1, 9);
        for (var i = 0; i < 5; i++) seq.push(s * Math.pow(2, i));
        ans = s * 32;
        return q({ q: '找规律填数：' + seq.join('、') + '、（  ）', o: opts(r, ans, [ans / 2, ans + s, ans * 2]), a: String(ans), e: '每个数是前一个的 2 倍，所以 ' + seq[4] + '×2=' + ans + '。' });
      }
      if (kind === 2) { // 平方数
        var st = pickInt(r, 1, 3);
        for (var i = st; i < st + 5; i++) seq.push(i * i);
        ans = (st + 5) * (st + 5);
        return q({ q: '找规律填数：' + seq.join('、') + '、（  ）', o: opts(r, ans, [ans - (st + 5), ans + (st + 5), ans + 1]), a: String(ans), e: '依次是 ' + st + '²、' + (st + 1) + '²…所以下一个是 ' + (st + 5) + '×' + (st + 5) + '=' + ans + '。' });
      }
      if (kind === 3) { // 斐波那契
        var a1 = pickInt(r, 1, 5), b1 = pickInt(r, 2, 8);
        seq = [a1, b1];
        for (var i = 2; i < 6; i++) seq.push(seq[i - 1] + seq[i - 2]);
        ans = seq[5];
        return q({ q: '找规律填数：' + [seq[0], seq[1], seq[2], seq[3], seq[4]].join('、') + '、（  ）', o: opts(r, ans, [seq[4] + seq[3], seq[4] + 1, seq[4] * 2]), a: String(ans), e: '每个数等于前两个数的和：' + seq[3] + '+' + seq[4] + '=' + ans + '。' });
      }
      // 交替加减
      var st2 = pickInt(r, 8, 20), d2 = pickInt(r, 2, 5);
      seq = [st2, st2 + d2, st2, st2 + d2, st2];
      ans = st2 + d2;
      return q({ q: '找规律填数：' + seq.join('、') + '、（  ）', o: opts(r, ans, [st2, st2 + d2 + 1, st2 - d2]), a: String(ans), e: '两个数一组交替出现：' + st2 + '、' + (st2 + d2) + ' 重复，所以下一个是 ' + ans + '。' });
    }
    case 'pai dui': {
      var kind = seed % 3;
      if (kind === 0) {
        var a = pickInt(r, 3, 9), b = pickInt(r, 3, 9), ans = a + b - 1;
        return q({ q: '小朋友排队，小红从前数第 ' + a + '，从后数第 ' + b + '，这队一共有几人？', o: opts(r, ans, [a + b, a + b - 2, a + b + 1]), a: String(ans), e: '小红被数了两次，所以 ' + a + '+' + b + '-1=' + ans + ' 人。' });
      }
      if (kind === 1) {
        var a = pickInt(r, 2, 8), b = pickInt(r, 2, 8), ans = a + b + 1;
        return q({ q: '排队时，小明前面有 ' + a + ' 人，后面有 ' + b + ' 人，一共几人？', o: opts(r, ans, [a + b, a + b + 2, a + b - 1]), a: String(ans), e: '前面 ' + a + ' 人 + 后面 ' + b + ' 人 + 小明自己 = ' + ans + ' 人。' });
      }
      var n = pickInt(r, 10, 20), k = pickInt(r, 2, Math.floor(n / 2)), ans = n - k + 1;
      return q({ q: '一共有 ' + n + ' 人排队，小华从后数第 ' + k + '，那么从前往后他是第几？', o: opts(r, ans, [n - k, k, ans + 1]), a: String(ans), e: '从后数第 ' + k + '，前面有 ' + (n - k) + ' 人，所以从前数是第 ' + (n - k) + '+1=' + ans + '。' });
    }
    case 'qiaosuan': {
      var kind = seed % 4;
      if (kind === 0) { // 凑整加法
        var a = pickInt(r, 91, 99), b = pickInt(r, 11, 89), ans = a + b;
        return q({ q: '巧算：' + a + ' + ' + b + ' = ?', o: opts(r, ans, [ans - 2, ans + 2, ans + 10]), a: String(ans), e: '把 ' + a + ' 看成 100：100+' + b + '−' + (100 - a) + '=' + ans + '。' });
      }
      if (kind === 1) { // 25×4 系
        var k = pickInt(r, 2, 9), ans = 25 * 4 * k;
        return q({ q: '巧算：25 × 4 × ' + k + ' = ?', o: opts(r, ans, [100 * k + 1, 100 * (k + 1), 25 * k * 2]), a: String(ans), e: '先算 25×4=100，再 ×' + k + '=' + ans + '。' });
      }
      if (kind === 2) { // 减法凑整
        var a = pickInt(r, 200, 500), b = pickInt(r, 91, 99), ans = a - b;
        return q({ q: '巧算：' + a + ' − ' + b + ' = ?', o: opts(r, ans, [ans - 1, ans + 1, a - 100]), a: String(ans), e: '先减 100 再加回零头：' + a + '−100+' + (100 - b) + '=' + ans + '。' });
      }
      var a = pickInt(r, 11, 49), b = 100 - a, ans = 100;
      return q({ q: '算一算：' + a + ' + ' + b + ' = ?', o: opts(r, ans, [99, 101, a + b + 2]), a: String(ans), e: a + ' 和 ' + b + ' 正好凑成 100，答案是 100。' });
    }
    case 'tuxing': {
      var kind = seed % 3;
      if (kind === 0) { // 线段数
        var n = pickInt(r, 4, 7), ans = n * (n - 1) / 2;
        return q({ q: '一条直线上有 ' + n + ' 个点，一共可以数出多少条线段？', o: opts(r, ans, [n, n * (n - 1), ans - 1]), a: String(ans), e: '每两个点确定一条线段：' + n + '×' + (n - 1) + '÷2=' + ans + ' 条。' });
      }
      if (kind === 1) { // 摆正方形小棒
        var n = pickInt(r, 3, 9), ans = 3 * n + 1;
        return q({ q: '用小棒摆 ' + n + ' 个连在一起的正方形，一共要多少根小棒？', o: opts(r, ans, [4 * n, 3 * n, 3 * n + 2]), a: String(ans), e: '第一个用 4 根，以后每加一个多用 3 根：4+3×' + (n - 1) + '=' + ans + ' 根。' });
      }
      var n = pickInt(r, 3, 8), ans = n * (n + 1) / 2;
      return q({ q: '从 1 数到 ' + n + '，一共有多少个数？如果每层摆的个数是 1、2、3…' + n + '，共摆多少个？', o: opts(r, ans, [n * n, ans - 1, n * 2]), a: String(ans), e: '1+2+…+' + n + '=' + n + '×' + (n + 1) + '÷2=' + ans + ' 个。' });
    }
    case 'jianyi': {
      var names = ['小明', '小刚', '小丽', '小红'];
      var hs = shuffle(r, [pickInt(r, 110, 150), pickInt(r, 110, 150), pickInt(r, 110, 150)]);
      var a = names[0], b = names[1], c = names[2];
      var cmp = hs[0] >= hs[1] && hs[1] >= hs[2] ? [a, b, c] : null;
      // 构造 "A比B高，B比C高，谁最高"
      var tallest = '小明', ans = '小明';
      return q({ q: '小明比小刚高，小刚比小丽高。他们三人中谁最高？', o: ['小明', '小刚', '小丽', '一样高'], a: '小明', e: '小明 > 小刚 > 小丽，所以最高的是小明。' });
    }

    /* ============ 中年级 ============ */
    case 'hecha': {
      var kind = seed % 3;
      if (kind === 0) { // 和倍
        var k = pickInt(r, 2, 5), small = pickInt(r, 3, 15), sum = small * (k + 1), ans = k * small;
        return q({ q: '两数和是 ' + sum + '，大数是小数的 ' + k + ' 倍，大数是多少？', o: opts(r, ans, [small, sum - small + 1, (k + 1) * small]), a: String(ans), e: '小数 = ' + sum + '÷' + (k + 1) + '=' + small + '，大数 = ' + small + '×' + k + '=' + ans + '。' });
      }
      if (kind === 1) { // 差倍
        var k = pickInt(r, 2, 5), small = pickInt(r, 3, 12), diff = small * (k - 1), ans = k * small;
        return q({ q: '两数相差 ' + diff + '，大数是小数的 ' + k + ' 倍，大数是多少？', o: opts(r, ans, [small, small + diff + 1, diff]), a: String(ans), e: '小数 = ' + diff + '÷' + (k - 1) + '=' + small + '，大数 = ' + small + '×' + k + '=' + ans + '。' });
      }
      var sum = pickInt(r, 30, 90), diff = pickInt(r, 4, 20); if ((sum + diff) % 2) { sum++; }
      var big = (sum + diff) / 2, ans = big;
      return q({ q: '两数和是 ' + sum + '，差是 ' + diff + '，较大的数是多少？', o: opts(r, ans, [(sum - diff) / 2, big + 2, big - 2]), a: String(ans), e: '大数 = (和+差)÷2 = (' + sum + '+' + diff + ')÷2 = ' + ans + '。' });
    }
    case 'zhishu': {
      var kind = seed % 4, d = pickInt(r, 3, 10), n = pickInt(r, 5, 20), len = d * n, ans;
      if (kind === 0) { ans = n + 1; return q({ q: '一条 ' + len + ' 米长的路，每隔 ' + d + ' 米栽一棵树，两端都栽，共栽几棵？', o: opts(r, ans, [n, n - 1, n + 2]), a: String(ans), e: '间隔数 = ' + len + '÷' + d + '=' + n + '，两端都栽：' + n + '+1=' + ans + ' 棵。' }); }
      if (kind === 1) { ans = n - 1; return q({ q: '一条 ' + len + ' 米长的路，每隔 ' + d + ' 米栽一棵，两端都不栽，共栽几棵？', o: opts(r, ans, [n, n + 1, n - 2]), a: String(ans), e: '间隔数 = ' + n + '，两端都不栽：' + n + '−1=' + ans + ' 棵。' }); }
      if (kind === 2) { ans = n; return q({ q: '一个圆形花坛周长 ' + len + ' 米，每隔 ' + d + ' 米栽一棵，共栽几棵？', o: opts(r, ans, [n + 1, n - 1, n + 2]), a: String(ans), e: '封闭图形：棵数 = 间隔数 = ' + len + '÷' + d + '=' + ans + ' 棵。' }); }
      ans = n; return q({ q: '一条 ' + len + ' 米长的路，每隔 ' + d + ' 米栽一棵，只栽一端，共栽几棵？', o: opts(r, ans, [n + 1, n - 1, n + 2]), a: String(ans), e: '只栽一端：棵数 = 间隔数 = ' + ans + ' 棵。' });

var KEY_BEST = 'olympiad.best';
var state = { grade: null, topic: null, mode: 'bank', seed: 0, current: null,
  locked: false, correct: 0, wrong: 0, streak: 0, best: 0, timer: null, spoken: false };

function $(id){ return document.getElementById(id); }
function safeGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function safeSet(k,v){ try{ localStorage.setItem(k,typeof v==='object'?JSON.stringify(v):v);}catch(e){} }
state.best = safeGet(KEY_BEST,0);

function speak(t){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function cancelSpeak(){ try{ if(window.speechSynthesis)window.speechSynthesis.cancel(); }catch(e){} }

function renderStats(){
  $('correct').textContent=state.correct;$('wrong').textContent=state.wrong;
  $('streak').textContent=state.streak;$('best').textContent=state.best;
}

function selectGrade(g){
  state.grade=g;
  document.querySelectorAll('#selGrade .chip').forEach(function(b){b.classList.toggle('on',b.dataset.g===g);});
  $('selTopic').classList.remove('hide');
  document.querySelectorAll('#selTopic .chip').forEach(function(b){b.classList.toggle('on',b.dataset.mode==='bank');});
  renderTopics();
}
function renderTopics(){
  $('topicView').classList.remove('hide');$('quizView').classList.add('hide');
  var list=$('topicList');list.innerHTML='';
  OLY_TOPICS[state.grade].forEach(function(t){
    var c=document.createElement('div');c.className='topic-card';
    c.innerHTML='<span class="ic">'+t.icon+'</span><span class="nm">'+t.name+'</span><span class="ds">'+t.desc+'</span>';
    c.addEventListener('click',function(){ startTopic(t.id); });
    list.appendChild(c);
  });
}
function startTopic(tid){
  state.topic=tid;state.seed=0;state.correct=0;state.wrong=0;state.streak=0;
  $('topicView').classList.add('hide');$('quizView').classList.remove('hide');
  var t=OLY_TOPICS[state.grade].filter(function(x){return x.id===tid;})[0];
  $('topicTag').textContent=t.icon+' '+t.name+(state.mode==='random'?' · 随机挑战':' · 闯关 '+BANK[state.grade][tid].length+' 题');
  renderStats();
  nextQuestion();
}
function getQuestion(){
  if(state.mode==='random'){
    state.seed=Math.floor(Math.random()*100000);
    return genQuestion(state.grade,state.topic,state.seed);
  }
  var arr=BANK[state.grade][state.topic];
  if(state.seed>=arr.length)state.seed=0;
  return arr[state.seed];
}
function nextQuestion(){
  cancelSpeak();
  state.locked=false;state.spoken=false;
  state.current=getQuestion();
  $('qtext').textContent=state.current.q;
  $('qmeta').textContent=state.mode==='random'?'随机出题 · 做不完':'第 '+(state.seed+1)+' / '+BANK[state.grade][state.topic].length+' 题';
  $('feedback').textContent='';$('explain').classList.remove('show');
  var box=$('opts');box.innerHTML='';
  state.current.o.forEach(function(op){
    var b=document.createElement('button');b.className='opt';b.textContent=op;
    b.addEventListener('click',function(){ onAnswer(b,op); });
    box.appendChild(b);
  });
  speak(state.current.q);
  // 自动落焦点到第一个选项（遥控器）
  setTimeout(function(){ var f=box.querySelector('.opt'); if(f)try{f.focus();}catch(e){} },120);
}
function onAnswer(btn,val){
  if(state.locked)return;
  var p=state.current;
  if(val===p.a){
    state.locked=true;btn.classList.add('correct','pop');
    $('feedback').innerHTML='<span class="ok">✅ 答对了！</span>';
    state.correct++;state.streak++;
    if(state.streak>state.best){state.best=state.streak;safeSet(KEY_BEST,state.best);}
    renderStats();
    $('explain').textContent=p.e;$('explain').classList.add('show');
    state.timer=setTimeout(nextQuestion,1100);
  }else{
    btn.classList.add('wrong','shake');btn.disabled=true;
    $('feedback').innerHTML='<span class="bad">❌ 再想一想，看下面的解析</span>';
    state.wrong++;state.streak=0;renderStats();
    $('explain').textContent=p.e;$('explain').classList.add('show');
  }
}
function manualNext(){ clearTimeout(state.timer); nextQuestion(); }

document.querySelectorAll('#selGrade .chip').forEach(function(b){
  b.addEventListener('click',function(){ selectGrade(b.dataset.g); });
});
document.querySelectorAll('#selTopic .chip').forEach(function(b){
  b.addEventListener('click',function(){
    state.mode=b.dataset.mode;
    document.querySelectorAll('#selTopic .chip').forEach(function(x){x.classList.toggle('on',x===b);});
    if(state.topic)startTopic(state.topic);
  });
});
$('nextBtn').addEventListener('click',manualNext);
$('backTopics').addEventListener('click',function(){ clearTimeout(state.timer); cancelSpeak(); renderTopics(); });
$('replayBtn').addEventListener('click',function(){ speak(state.current.q); });

/* 顶栏接口：🔊 重听、⏭ 下一题 */
window.replayCurrent = function(){ if(state.current) speak(state.current.q); };
window.XNLY_NEXT = function(){ if(!$('quizView').classList.contains('hide')) manualNext(); };
</script>
