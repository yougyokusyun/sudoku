.tchip.on{background:linear-gradient(135deg,#22c1dc,#0891b2);color:#fff;border-color:transparent;}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;

.opt:active{transform:scale(.985);}
.opt.good{border-color:var(--ok);background:#e9fbee;color:#1b7c33;}
.opt.bad{border-color:var(--bad);background:#ffeded;color:#b02a2a;}
.opt[disabled]{opacity:.45;cursor:default;}
.feedback{min-height:36px;font-size:.95rem;font-weight:800;text-align:center;line-height:1.45;}
.ok{color:var(--ok);} .bad{color:var(--bad);}

function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function say(t, o) { if (window.XNLY && XNLY.voice) { try { XNLY.voice.speak(t, o || {}); } catch (e) { } } }
function sfx(n) { if (window.XNLY && XNLY.sound && XNLY.sound[n]) { try { XNLY.sound[n](); } catch (e) { } } }
function mark(k) { if (window.XNLY && XNLY.mark) { try { XNLY.mark(k); } catch (e) { } } }

function poolFor(g) {
  return Q.filter(function (q) { return q.g === g; });
}

function renderBar() {
  elBar.innerHTML = '';
  [3, 4, 5].forEach(function (g) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (g === state.grade ? ' on' : '');
    b.textContent = g + ' 年级 · ' + poolFor(g).length + ' 题';
    b.addEventListener('click', function () {
      if (g === state.grade) return;
      state.grade = g;
      startGrade();
      say(g + ' 年级的看图选句。');
    });
    elBar.appendChild(b);
  });
}

function startGrade() {
  clearTimeout(state.timer);
  state.deck = XNLY.deck.make(poolFor(state.grade), 'picture-sentence.g' + state.grade, { head: 5 });
  state.total = state.deck.total();
  state.pos = 0; state.correct = 0; state.attempts = 0; state.locked = false;
  elSummary.classList.remove('show'); elSummary.innerHTML = '';
  elRight.textContent = '0';
  elTotal.textContent = state.total;
  renderBar();
  renderQuestion();
}

function renderQuestion() {
  clearTimeout(state.timer);
  state.locked = false;
  if (state.pos >= state.total) { finish(); return; }
  var q = state.deck.next();
  var opts = shuffle([{ t: q.ok, ok: true }, { t: q.bad[0], ok: false }, { t: q.bad[1], ok: false }]);
  state.cur = { q: q, opts: opts };
  elArt.textContent = q.img;
  elArt.style.letterSpacing = '4px';
  elProg.textContent = String(state.pos + 1);
  elOpts.innerHTML = '';
  opts.forEach(function (o, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = o.t;
    b.addEventListener('click', function () { choose(i, b); });
    elOpts.appendChild(b);
  });
  elFb.className = 'feedback';
  elFb.textContent = '';
}

function choose(i, btn) {
  if (state.locked) return;
  var cur = state.cur;
  var o = cur.opts[i];
  say(o.t, { lang: 'en-US' });
  state.attempts++;
  if (o.ok) {
    state.locked = true;
    state.correct++;
    elRight.textContent = state.correct;
    mark('right'); sfx('correct');
    btn.classList.add('good');
    elFb.className = 'feedback ok';
    elFb.innerHTML = '✅ 说得对！<small>' + o.t + '</small>';
    Array.prototype.forEach.call(elOpts.children, function (b) { b.disabled = true; });
    state.timer = setTimeout(function () {
      state.pos++;
      if (state.pos >= state.total) finish(); else renderQuestion();
    }, 1100);
  } else {
    mark('wrong'); sfx('wrong');
    btn.classList.add('bad', 'shake');
    elFb.className = 'feedback bad';
    elFb.textContent = '❌ 再仔细看看图，这句话和图不一样，再试一句';
  }
}

function finish() {
  clearTimeout(state.timer);
  state.locked = true;
  elOpts.innerHTML = '';
  elPrompt.textContent = '';
  elFb.className = 'feedback';
  elFb.textContent = '';
  sfx('win');
  var acc = state.attempts ? Math.round(state.correct / state.attempts * 100) : 0;
  elSummary.innerHTML = '<div class="sumtitle">🎉 ' + state.grade + ' 年级读完啦</div>' +
    '<div class="sumline">答对 <b>' + state.correct + '</b> / ' + state.total +
    ' 题 · 正确率 <b>' + acc + '%</b></div>' +
    '<div class="sumline" style="font-size:.78rem;color:#7b8ea8">本年级的 30 道看图题都练过一遍，没有重复题</div>' +
    '<button class="again" id="againBtn" type="button">🔄 再练一遍本年级</button>';
  elSummary.classList.add('show');
  document.getElementById('againBtn').addEventListener('click', startGrade);
  say('太棒了，这个年级的看图题都练完啦。');
}

/* 首次点击补读 */
var firstTap = false;
document.addEventListener('pointerdown', function () {
  if (firstTap) return;
  firstTap = true;
  if (window.XNLY && XNLY.voice && XNLY.voice.unlock) { try { XNLY.voice.unlock(); } catch (e) { } }
  if (window.XNLY && XNLY.sound && XNLY.sound.unlock) { try { XNLY.sound.unlock(); } catch (e) { } }
  if (state.cur && !state.locked) say('看图，哪一句说得对？点一点句子就能听它怎么读。');
}, { passive: true });

startGrade();

window.PS = { Q: Q, get state() { return state; }, startGrade: startGrade, poolFor: poolFor };
</script>
