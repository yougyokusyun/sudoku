<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>形状认知配对 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.prompt{font-size:1.1rem;font-weight:800;text-align:center;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 下面的样式按每个游戏自行补充，但请保持上面的变量与动画不变 */
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;}
.choice{width:clamp(88px,30vw,132px);height:clamp(88px,30vw,132px);border:none;border-radius:24px;
  background:#fff;box-shadow:0 6px 18px rgba(36,59,83,.13);display:flex;align-items:center;
  justify-content:center;padding:0;cursor:pointer;overflow:hidden;}
.shape{--s:100px;width:var(--s);height:var(--s);font-size:calc(var(--s)*.8);line-height:1;
  display:flex;align-items:center;justify-content:center;flex:none;}
.choice .shape{--s:clamp(62px,21vw,100px);}
.target{background:#fff;border-radius:28px;padding:14px 22px;box-shadow:0 10px 26px rgba(36,59,83,.14);}
.target .shape{--s:clamp(96px,22vh,150px);}
.sh-circle{border-radius:50%;background:#e63946;}
.sh-square{border-radius:12px;background:#1e6091;}
.sh-triangle{clip-path:polygon(50% 0%,0% 100%,100% 100%);background:#f4d03f;}
.sh-star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#9b5de5;}
.sh-heart{background:none;}
@media (max-height:430px){
  .choice{width:84px;height:84px;border-radius:18px;}
  .choice .shape{--s:56px;}
  .target{padding:8px 14px;border-radius:20px;}
  .target .shape{--s:clamp(64px,17vh,96px);}
}
</style>
</head>
<body>
<header>
  <h1>🟦 形状认知配对</h1>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <div class="prompt" id="prompt">找出和上面一样的形状</div>
  <div class="target" id="target"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
</div>
<script>
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function feedback(text,good){var f=document.getElementById('feedback');f.className='feedback '+(good?'ok':'bad');f.textContent=text;}
function replay(node,cls){node.classList.remove('pop','shake');void node.offsetWidth;node.classList.add(cls);}
/* 游戏逻辑 */
var SHAPES=[
  {name:'圆形',cls:'sh-circle'},
  {name:'方形',cls:'sh-square'},
  {name:'三角形',cls:'sh-triangle'},
  {name:'星形',cls:'sh-star'},
  {name:'心形',cls:'sh-heart'}
];
let locked=false,newRoundTimer=null,current=null;

/* 心形用 ❤️ 表情，其余用 CSS 绘制 */
function shapeHTML(s){
  return '<div class="shape '+s.cls+'">'+(s.name==='心形'?'❤️':'')+'</div>';
}
function clearFeedback(){var f=document.getElementById('feedback');f.className='feedback';f.textContent='';}

function newRound(){
  current=pick(SHAPES);
  var others=shuffle(SHAPES.filter(function(s){return s.name!==current.name;})).slice(0,3);
  var options=shuffle([current].concat(others));
  document.getElementById('target').innerHTML=shapeHTML(current);
  document.getElementById('choices').innerHTML=options.map(function(s){
    return '<button class="choice" type="button" data-name="'+s.name+'" aria-label="'+s.name+'">'+shapeHTML(s)+'</button>';
  }).join('');
  clearFeedback();
  voiceSpeak('找出和上面一样的形状');
}

/* 事件只绑定一次，靠冒泡处理每一轮 */
document.getElementById('choices').addEventListener('click',function(e){
  var btn=e.target.closest('.choice');
  if(!btn||locked)return;
  if(btn.dataset.name===current.name){
    locked=true;
    replay(btn,'pop');
    feedback('✅ 太棒了',true);
    voiceSpeak('太棒了，这是' + current.name);
    clearTimeout(newRoundTimer);
    newRoundTimer=setTimeout(function(){locked=false;newRound();},1000);
  }else{
    replay(btn,'shake');
    feedback('❌ 再试试',false);
    voiceSpeak('再看一看，找一样的形状');
  }
});

newRound();

/* ===== 语音播报：进入游戏先读一遍玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '形状认知配对。找出和上面一样的形状。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进入游戏自动朗读；若浏览器拦截自动播放，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  try {
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
  setTimeout(function () {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
    var once = function () {
      document.removeEventListener('pointerdown', once);
      voiceSpeak(VOICE_TEXT);
    };
    document.addEventListener('pointerdown', once);
  }, 900);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.10);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();
</script>
</body>
</html>
