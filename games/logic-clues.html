<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
.stage-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  width:100%;margin:auto;padding:2px 0;}
.prompt{font-size:1.1rem;font-weight:800;text-align:center;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 本游戏补充样式 */
.hide{display:none!important;}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.stat-pill{background:#fff;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:800;
  box-shadow:0 3px 10px rgba(36,59,83,.08);white-space:nowrap;}
.stat-pill b{color:var(--accent);}
.card{width:min(540px,100%);background:#fff;border-radius:20px;padding:10px 16px;
  box-shadow:0 6px 18px rgba(36,59,83,.12);}
.theme{font-size:.82rem;font-weight:900;color:var(--accent);margin-bottom:5px;}
.level-tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;
  font-size:.7rem;font-weight:900;vertical-align:middle;}
.level-tag.basic{background:#eaf8ee;color:#2fb344;}
.level-tag.challenge{background:#fff0e6;color:#ff7a1a;}
.clues{list-style:none;display:flex;flex-direction:column;gap:5px;}
.clues li{display:flex;gap:8px;align-items:flex-start;font-size:1.25rem;font-weight:800;line-height:1.45;}
.clue-num{flex:none;min-width:26px;text-align:center;font-size:.95rem;font-weight:900;background:#f0edff;color:var(--accent);
  border-radius:8px;padding:2px 6px;margin-top:2px;}
.clues li.locked span:last-child{color:#9aa8ba;font-weight:700;}
.clues li.pop span:last-child{animation:pop .45s ease;}
.question{font-size:1.3rem;font-weight:900;text-align:center;}
.hint-btn{margin-top:2px;}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(540px,100%);}
.opt{min-height:50px;border:none;border-radius:16px;background:#fff;font-weight:900;font-size:1.4rem;
  color:var(--ink);box-shadow:0 5px 14px rgba(36,59,83,.12);cursor:pointer;padding:8px 6px;
  font-family:inherit;transition:transform .12s ease;}
.opt:active{transform:scale(.97);}
.opt.correct{background:#eaf8ee;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok);}
.opt.wrong{background:#fff0f0;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad);}
.opt.eliminated{opacity:.4;text-decoration:line-through;}
.opt:disabled{cursor:default;}
.hint-btn{min-height:44px;border:none;border-radius:14px;background:#fff7d6;color:#a06a00;
  font-weight:900;font-size:.9rem;padding:8px 16px;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 12px rgba(160,106,0,.16);}
.solution{width:min(540px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.sol-title{grid-column:1/-1;font-size:.86rem;font-weight:900;color:var(--accent);text-align:center;}
.sol-why{grid-column:1/-1;font-size:1rem;font-weight:800;line-height:1.45;background:#f7f4ff;
  border-radius:12px;padding:8px 10px;color:#4b3f78;}
.sol-item{background:#eef7ff;border-radius:10px;padding:5px 8px;font-size:.9rem;font-weight:800;text-align:center;}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9;}
.confetti-bit{position:absolute;top:-40px;animation:fall 1.8s linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9;}}
@media (max-height:430px){
  .stats{gap:5px;}
  .stat-pill{padding:3px 9px;font-size:.72rem;}
  .card{padding:6px 10px;border-radius:14px;}
  .theme{font-size:.72rem;margin-bottom:3px;}
  .level-tag{font-size:.6rem;padding:0 6px;margin-left:4px;}
  .clues li{font-size:.82rem;line-height:1.25;gap:4px;}
  .clue-num{font-size:.66rem;padding:0 4px;}
  .question{font-size:1rem;}
  .options{grid-template-columns:repeat(4,1fr);gap:6px;width:100%;}
  .opt{min-height:44px;font-size:.86rem;border-radius:12px;padding:4px;}
  .hint-btn{min-height:40px;padding:6px 12px;font-size:.82rem;}
  .solution{grid-template-columns:repeat(4,1fr);gap:4px;}
  .sol-title{font-size:.76rem;}
  .sol-item{font-size:.76rem;padding:3px 4px;}
  .stage-inner{gap:6px;}
}
/* 模式切换 / 破译密码 */
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.mode{min-height:40px;border:none;border-radius:999px;background:#fff;color:var(--ink);
  font-weight:900;font-size:.88rem;padding:6px 16px;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 10px rgba(36,59,83,.10);transition:transform .12s ease;}
.mode:active{transform:scale(.97);}
.mode.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(124,92,255,.35);}
.tiers{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.tier{min-height:32px;border:none;border-radius:999px;background:#fff;color:#6b7a90;
  font-weight:900;font-size:.78rem;padding:4px 14px;cursor:pointer;font-family:inherit;}
.tier.active{background:#f0edff;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);}
.pwd{display:flex;gap:10px;justify-content:center;}
.slot{width:54px;height:62px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;font-weight:900;color:#c9d3e0;box-shadow:0 4px 12px rgba(36,59,83,.12);
  transition:box-shadow .15s ease,background .15s ease;}
.slot.filled{background:#f7f4ff;color:var(--accent);}
.slot.cur{box-shadow:inset 0 0 0 3px var(--accent),0 4px 12px rgba(36,59,83,.12);}
.pwd.shake{animation:shake .45s ease;}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(440px,100%);}
.key{min-height:52px;border:none;border-radius:14px;background:#fff;color:var(--ink);
  font-weight:900;font-size:1.35rem;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 12px rgba(36,59,83,.10);transition:transform .1s ease;}
.key:active{transform:scale(.96);}
.key.del{grid-column:1/-1;min-height:44px;font-size:1rem;color:#9a6b00;background:#fff7d6;
  box-shadow:0 4px 12px rgba(160,106,0,.14);}
.key:disabled{opacity:.45;cursor:default;}
/* 破译密码模式下：密码框在最上，线索紧随其下，键盘在最底 */
.stage-inner.code-mode .pwd{order:1;}
.stage-inner.code-mode .card{order:2;}
.stage-inner.code-mode .keypad{order:3;}
@media (max-height:430px){
  .modes{gap:5px;} .mode{min-height:32px;font-size:.76rem;padding:3px 10px;}
  .tiers{gap:4px;} .tier{min-height:26px;font-size:.68rem;padding:2px 9px;}
  .pwd{gap:6px;} .slot{width:38px;height:44px;font-size:1.3rem;border-radius:10px;}
  .keypad{gap:5px;width:min(330px,100%);}
  .key{min-height:38px;font-size:1rem;border-radius:10px;}
  .key.del{min-height:34px;font-size:.82rem;}
}
</style>

var state={correct:0,streak:0,best:0,wrong:0,locked:false,current:null,timer:null,
  lastIdx:-1,lastCode:-1,mode:'logic',tier:'basic',input:''};
var feedbackEl=document.getElementById('feedback');
var optionsEl=document.getElementById('options');
var solutionEl=document.getElementById('solution');
var themeEl=document.getElementById('theme');
var cluesEl=document.getElementById('clues');
var questionEl=document.getElementById('question');
var modesEl=document.getElementById('modes');
var tiersEl=document.getElementById('tiers');
var pwdEl=document.getElementById('pwd');
var keypadEl=document.getElementById('keypad');
var stageInner=document.querySelector('.stage-inner');
var TIER_NAME={basic:'入门',adv:'进阶',hard:'挑战'};

function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function feedback(text,good){
  feedbackEl.className='feedback '+(good?'ok':'bad');
  feedbackEl.textContent=text;
}
function clearFeedback(){feedbackEl.className='feedback';feedbackEl.textContent='';}
function speak(t){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t));
    u.lang='zh-CN';u.rate=0.95;u.pitch=1.1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function renderStats(){
  document.getElementById('correctCount').textContent=state.correct;
  document.getElementById('streakCount').textContent=state.streak;
  document.getElementById('bestCount').textContent=state.best;
}
function confetti(){
  var layer=document.getElementById('confetti');
  var emojis=['🎉','🎊','⭐','✨','💫'];
  for(var i=0;i<18;i++){
    var s=document.createElement('span');
    s.className='confetti-bit';
    s.textContent=emojis[i%emojis.length];
    s.style.left=(Math.random()*96)+'%';
    s.style.animationDelay=(Math.random()*0.45)+'s';
    s.style.fontSize=(0.85+Math.random()*1.1)+'rem';
    layer.appendChild(s);
  }
  setTimeout(function(){layer.innerHTML='';},2100);
}
function showSolution(p){
  var items=p.people.map(function(name){
    return '<div class="sol-item">'+esc(name)+' → '+esc(p.solution[name])+'</div>';
  }).join('');
  solutionEl.innerHTML='<div class="sol-title">✅ 完整答案</div>'+
    '<div class="sol-why">推理：把 ' + p.clues.length + ' 条线索逐条对照，和线索矛盾的选项一个个排除，最后只有「' + esc(p.answer) + '」全部符合。</div>'+items;
  solutionEl.classList.remove('hide');
}
function renderLogicPuzzle(){
  var p=state.current;
  themeEl.innerHTML='🧩 主题：'+esc(p.theme)+' · 线索 '+p.clues.length+' 条'+'<span class="level-tag '+(p.level==='challenge'?'challenge':'basic')+'">'+(p.level==='challenge'?'挑战':'常规')+'</span>';
  /* 所有线索一次性显示，不折叠、不逐条点开 */
  cluesEl.innerHTML=p.clues.map(function(c,i){
    return '<li class="clue" data-i="'+i+'"><span class="clue-num">'+(i+1)+'</span><span>'+esc(c)+'</span></li>';
  }).join('');
  questionEl.textContent=p.q;
  questionEl.setAttribute('data-speak', p.q+'。线索：'+p.clues.join('。'));
  optionsEl.innerHTML=p.options.map(function(o){
    return '<button class="opt" type="button" data-val="'+esc(o)+'">'+esc(o)+'</button>';
  }).join('');
  solutionEl.classList.add('hide');
  clearFeedback();
}
function codePool(){
  return CODE_PUZZLES.filter(function(p){return p.tier===state.tier;});
}
function pwdWhy(p){
  var blank=null;
  for(var i=0;i<p.clues.length;i++){
    if(p.clues[i].indexOf('没有一个数字正确')>=0){blank=p.clues[i].split('：')[0];}
  }
  if(blank){
    return '先用「'+blank+'」排除 '+blank.split('').join('、')+' 这四个数字，再按其余线索的位置提示逐位排除，最后只剩 '+p.answer+' 这一种排法。';
  }
  return '把 '+p.clues.length+' 条线索的「几个数字对、几个位置对」同时对照，互相矛盾的排法逐一排除，最后只剩 '+p.answer+' 这一种。';
}
function renderPwd(){
  var html='';
  for(var i=0;i<4;i++){
    var d=state.input.charAt(i);
    html+='<div class="slot'+(d?' filled':'')+(i===state.input.length&&!state.locked?' cur':'')+'">'+esc(d)+'</div>';
  }
  pwdEl.innerHTML=html;
  var keys=keypadEl.querySelectorAll('.key');
  for(var j=0;j<keys.length;j++){
    keys[j].disabled=state.locked||(state.input.length>=4&&keys[j].dataset.k!=='del');
  }
}
function renderCodePuzzle(){
  var p=state.current;
  themeEl.innerHTML='🔐 破译密码 · 4 位数字，数字不重复<span class="level-tag '+(p.tier==='basic'?'basic':'challenge')+'">'+TIER_NAME[p.tier]+'</span>';
  cluesEl.innerHTML=p.clues.map(function(c,i){
    return '<li class="clue" data-i="'+i+'"><span class="clue-num">'+(i+1)+'</span><span>'+esc(c)+'</span></li>';
  }).join('');
  questionEl.textContent='输入 4 位密码';
  questionEl.setAttribute('data-speak','破译密码。'+p.clues.join('。'));
  optionsEl.innerHTML='';
  solutionEl.classList.add('hide');
  state.input='';
  renderPwd();
  clearFeedback();
}
function showCodeSolution(p){
  solutionEl.innerHTML='<div class="sol-title">✅ 正确密码 '+esc(p.answer)+'</div>'+
    '<div class="sol-why">推理：'+esc(pwdWhy(p))+'</div>';
  solutionEl.classList.remove('hide');
}
function nextRound(){
  clearTimeout(state.timer);
  state.wrong=0;
  state.locked=false;
  if(state.mode==='code'){
    var pool=codePool();
    var ci=Math.floor(Math.random()*pool.length);
    if(pool.length>1&&ci===state.lastCode)ci=(ci+1)%pool.length;
    state.lastCode=ci;
    state.current=pool[ci];
    renderCodePuzzle();
  }else{
    var idx=Math.floor(Math.random()*PUZZLES.length);
    if(PUZZLES.length>1&&idx===state.lastIdx)idx=(idx+1)%PUZZLES.length;
    state.lastIdx=idx;
    state.current=PUZZLES[idx];
    renderLogicPuzzle();
  }
}
function resetClues(){
  nextRound();
}
function buildKeypad(){
  var html='';
  for(var d=1;d<=9;d++){html+='<button class="key" type="button" data-k="'+d+'">'+d+'</button>';}
  html+='<button class="key" type="button" data-k="0">0</button>';
  html+='<button class="key del" type="button" data-k="del">⌫ 删除</button>';
  keypadEl.innerHTML=html;
}
function onKeyClick(e){
  var btn=e.target.closest('.key');
  if(!btn||state.locked||btn.disabled)return;
  var k=btn.dataset.k;
  if(k==='del'){
    state.input=state.input.slice(0,-1);
    renderPwd();
    clearFeedback();
    return;
  }
  if(state.input.length>=4)return;
  state.input+=k;
  renderPwd();
  if(state.input.length===4){state.timer=setTimeout(checkCode,130);}
}
function checkCode(){
  if(state.locked)return;
  var p=state.current;
  if(state.input===p.answer){
    state.locked=true;
    renderPwd();
    feedback('✅ 密码正确！',true);
    state.correct++;
    state.streak++;
    if(state.streak>state.best){
      state.best=state.streak;
      safeSet(KEY_BEST,String(state.best));
    }
    renderStats();
    showCodeSolution(p);
    confetti();
    state.timer=setTimeout(nextRound,1900);
  }else{
    pwdEl.classList.remove('shake');
    void pwdEl.offsetWidth;
    pwdEl.classList.add('shake');
    feedback('❌ 再试一次',false);
    state.wrong++;
    state.streak=0;
    renderStats();
    state.timer=setTimeout(function(){state.input='';renderPwd();},700);
  }
}
function setMode(m){
  state.mode=m;
  clearTimeout(state.timer);
  var btns=modesEl.querySelectorAll('.mode');
  for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',btns[i].dataset.mode===m);}
  var isCode=(m==='code');
  tiersEl.classList.toggle('hide',!isCode);
  pwdEl.classList.toggle('hide',!isCode);
  keypadEl.classList.toggle('hide',!isCode);
  questionEl.classList.toggle('hide',isCode);
  optionsEl.classList.toggle('hide',isCode);
  stageInner.classList.toggle('code-mode',isCode);
  solutionEl.classList.add('hide');
  nextRound();
}
function initClues(){
  var best=parseInt(safeGet(KEY_BEST),10);
  state.best=isNaN(best)?0:best;
  state.correct=0;
  state.streak=0;
  renderStats();
  optionsEl.addEventListener('click',onOptionClick);
  buildKeypad();
  keypadEl.addEventListener('click',onKeyClick);
  modesEl.addEventListener('click',function(e){
    var b=e.target.closest('.mode');
    if(!b||b.dataset.mode===state.mode)return;
    setMode(b.dataset.mode);
  });
  tiersEl.addEventListener('click',function(e){
    var b=e.target.closest('.tier');
    if(!b||b.dataset.tier===state.tier)return;
    state.tier=b.dataset.tier;
    var ts=tiersEl.querySelectorAll('.tier');
    for(var i=0;i<ts.length;i++){ts[i].classList.toggle('active',ts[i].dataset.tier===state.tier);}
    if(state.mode==='code')nextRound();
  });
  nextRound();
}
function onOptionClick(e){
  var btn=e.target.closest('.opt');
  if(!btn||state.locked||btn.disabled)return;
  var p=state.current;
  if(btn.dataset.val===p.answer){
    state.locked=true;
    btn.classList.add('correct');
    feedback('✅ 答对了！',true);
    state.correct++;
    state.streak++;
    if(state.streak>state.best){
      state.best=state.streak;
      safeSet(KEY_BEST,String(state.best));
    }
    renderStats();
    showSolution(p);
    confetti();
    state.timer=setTimeout(resetClues,1500);
  }else{
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('wrong','shake');
    btn.disabled=true;
    feedback('❌ 再读一遍上面的线索，想一想哦',false);
    state.wrong++;
    state.streak=0;
    renderStats();
  }
}
initClues();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
