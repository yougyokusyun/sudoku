<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>逻辑推理 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
.stage-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  width:100%;margin:auto;padding:2px 0;}
.prompt{font-size:1.1rem;font-weight:800;text-align:center;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 本游戏补充样式 */
.hide{display:none!important;}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.stat-pill{background:#fff;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:800;
  box-shadow:0 3px 10px rgba(36,59,83,.08);white-space:nowrap;}
.stat-pill b{color:var(--accent);}
.card{width:min(540px,100%);background:#fff;border-radius:20px;padding:10px 16px;
  box-shadow:0 6px 18px rgba(36,59,83,.12);}
.theme{font-size:.82rem;font-weight:900;color:var(--accent);margin-bottom:5px;}
.clues{list-style:none;display:flex;flex-direction:column;gap:5px;}
.clues li{display:flex;gap:6px;align-items:flex-start;font-size:.95rem;font-weight:700;line-height:1.35;}
.clue-num{flex:none;font-size:.75rem;font-weight:900;background:#f0edff;color:var(--accent);
  border-radius:8px;padding:1px 6px;margin-top:2px;}
.question{font-size:1.2rem;font-weight:900;text-align:center;}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(540px,100%);}
.opt{min-height:50px;border:none;border-radius:16px;background:#fff;font-weight:900;font-size:1rem;
  color:var(--ink);box-shadow:0 5px 14px rgba(36,59,83,.12);cursor:pointer;padding:8px 6px;
  font-family:inherit;transition:transform .12s ease;}
.opt:active{transform:scale(.97);}
.opt.correct{background:#eaf8ee;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok);}
.opt.wrong{background:#fff0f0;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad);}
.opt.eliminated{opacity:.4;text-decoration:line-through;}
.opt:disabled{cursor:default;}
.hint-btn{min-height:44px;border:none;border-radius:14px;background:#fff7d6;color:#a06a00;
  font-weight:900;font-size:.9rem;padding:8px 16px;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 12px rgba(160,106,0,.16);}
.solution{width:min(540px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.sol-title{grid-column:1/-1;font-size:.86rem;font-weight:900;color:var(--accent);text-align:center;}
.sol-item{background:#eef7ff;border-radius:10px;padding:5px 8px;font-size:.9rem;font-weight:800;text-align:center;}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9;}
.confetti-bit{position:absolute;top:-40px;animation:fall 1.8s linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9;}}
@media (max-height:430px){
  .stats{gap:5px;}
  .stat-pill{padding:3px 9px;font-size:.72rem;}
  .card{padding:6px 10px;border-radius:14px;}
  .theme{font-size:.72rem;margin-bottom:3px;}
  .clues li{font-size:.82rem;line-height:1.25;gap:4px;}
  .clue-num{font-size:.66rem;padding:0 4px;}
  .question{font-size:1rem;}
  .options{grid-template-columns:repeat(4,1fr);gap:6px;width:100%;}
  .opt{min-height:44px;font-size:.86rem;border-radius:12px;padding:4px;}
  .hint-btn{min-height:40px;padding:6px 12px;font-size:.82rem;}
  .solution{grid-template-columns:repeat(4,1fr);gap:4px;}
  .sol-title{font-size:.76rem;}
  .sol-item{font-size:.76rem;padding:3px 4px;}
  .stage-inner{gap:6px;}
}
</style>
</head>

</div>

var KEY_BEST='pclue.best';
var state={correct:0,streak:0,best:0,wrong:0,locked:false,current:null,hintUsed:false,timer:null,lastIdx:-1};
var feedbackEl=document.getElementById('feedback');
var optionsEl=document.getElementById('options');
var hintBtn=document.getElementById('hintBtn');
var solutionEl=document.getElementById('solution');

function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function feedback(text,good){
  feedbackEl.className='feedback '+(good?'ok':'bad');
  feedbackEl.textContent=text;
}
function clearFeedback(){feedbackEl.className='feedback';feedbackEl.textContent='';}
function renderStats(){
  document.getElementById('correctCount').textContent=state.correct;
  document.getElementById('streakCount').textContent=state.streak;
  document.getElementById('bestCount').textContent=state.best;
}
function confetti(){
  var layer=document.getElementById('confetti');
  var emojis=['🎉','🎊','⭐','✨','💫'];
  for(var i=0;i<18;i++){
    var s=document.createElement('span');
    s.className='confetti-bit';
    s.textContent=emojis[i%emojis.length];
    s.style.left=(Math.random()*96)+'%';
    s.style.animationDelay=(Math.random()*0.45)+'s';
    s.style.fontSize=(0.85+Math.random()*1.1)+'rem';
    layer.appendChild(s);
  }
  setTimeout(function(){layer.innerHTML='';},2100);
}
function showSolution(p){
  var items=p.people.map(function(name){
    return '<div class="sol-item">'+esc(name)+' → '+esc(p.solution[name])+'</div>';
  }).join('');
  solutionEl.innerHTML='<div class="sol-title">✅ 完整答案</div>'+items;
  solutionEl.classList.remove('hide');
}
function renderPuzzle(){
  var p=state.current;
  document.getElementById('theme').textContent='🧩 主题：'+p.theme;
  document.getElementById('clues').innerHTML=p.clues.map(function(c,i){
    return '<li><span class="clue-num">'+(i+1)+'</span><span>💡 '+esc(c)+'</span></li>';
  }).join('');
  document.getElementById('question').textContent=p.q;
  optionsEl.innerHTML=p.options.map(function(o){
    return '<button class="opt" type="button" data-val="'+esc(o)+'">'+esc(o)+'</button>';
  }).join('');
  hintBtn.classList.add('hide');
  hintBtn.disabled=false;
  solutionEl.classList.add('hide');
  clearFeedback();
}
function nextPuzzle(){
  var idx=Math.floor(Math.random()*PUZZLES.length);
  if(PUZZLES.length>1&&idx===state.lastIdx)idx=(idx+1)%PUZZLES.length;
  state.lastIdx=idx;
  state.current=PUZZLES[idx];
  state.wrong=0;
  state.locked=false;
  state.hintUsed=false;
  renderPuzzle();
}
function resetClues(){
  clearTimeout(state.timer);
  nextPuzzle();
}
function initClues(){
  var best=parseInt(safeGet(KEY_BEST),10);
  state.best=isNaN(best)?0:best;
  state.correct=0;
  state.streak=0;
  renderStats();
  optionsEl.addEventListener('click',onOptionClick);
  hintBtn.addEventListener('click',useHint);
  resetClues();
}
function onOptionClick(e){
  var btn=e.target.closest('.opt');
  if(!btn||state.locked||btn.disabled)return;
  var p=state.current;
  if(btn.dataset.val===p.answer){
    state.locked=true;
    btn.classList.add('correct');
    feedback('✅ 答对了！',true);
    state.correct++;
    state.streak++;
    if(state.streak>state.best){
      state.best=state.streak;
      safeSet(KEY_BEST,String(state.best));
    }
    renderStats();
    showSolution(p);
    confetti();
    state.timer=setTimeout(resetClues,1500);
  }else{
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('wrong','shake');
    btn.disabled=true;
    feedback('❌ 再仔细看看线索',false);
    state.wrong++;
    state.streak=0;
    renderStats();
    if(state.wrong>=2&&!state.hintUsed)hintBtn.classList.remove('hide');
  }
}
function useHint(){
  if(state.locked||state.hintUsed)return;
  var p=state.current;
  var wrongs=Array.prototype.slice.call(optionsEl.querySelectorAll('.opt')).filter(function(b){
    return !b.disabled&&b.dataset.val!==p.answer;
  });
  if(!wrongs.length)return;
  var b=wrongs[Math.floor(Math.random()*wrongs.length)];
  b.disabled=true;
  b.classList.add('eliminated');
  state.hintUsed=true;
  hintBtn.disabled=true;
  hintBtn.classList.add('hide');
  feedback('💡 已排除一个错误选项',true);
}

initClues();
</script>
