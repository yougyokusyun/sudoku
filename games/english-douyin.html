<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#00897b;--line:rgba(36,59,83,.10);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#e6f7f4,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#fff3e8,transparent 55%),
             linear-gradient(160deg,#f7fcfb,#fffaf5);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:40px;padding:7px 14px;font-weight:800;font-size:.85rem;
  box-shadow:0 3px 10px rgba(36,59,83,.10);}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-family:inherit;font-size:.74rem;font-weight:800;color:#6b7f95;box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tchip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-family:inherit;font-size:.75rem;font-weight:800;color:#4a6076;cursor:pointer;
  box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.tchip.on{background:linear-gradient(135deg,#00897b,#00695c);color:#fff;border-color:transparent;}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:0;overflow-y:auto;width:100%;}
.prompt{font-size:1rem;font-weight:800;text-align:center;color:#4a6076;line-height:1.5;}
.prompt span{display:block;font-size:.76rem;font-weight:700;color:#8aa0b8;margin-top:3px;}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(600px,100%);}
.opt{min-height:66px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px 12px;
  font-family:inherit;font-size:.95rem;font-weight:900;color:var(--ink);cursor:pointer;line-height:1.35;
  box-shadow:0 5px 14px rgba(36,59,83,.08);transition:transform .14s,border-color .18s,background .18s;}
.opt:active{transform:scale(.97);}
.opt.good{border-color:var(--ok);background:#e9fbee;color:#1b7c33;}
.opt.bad{border-color:var(--bad);background:#ffeded;color:#b02a2a;}
.opt[disabled]{opacity:.45;cursor:default;}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.tool{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 15px;min-height:42px;
  font-family:inherit;font-size:.8rem;font-weight:800;color:#4a6076;cursor:pointer;
  box-shadow:0 3px 10px rgba(36,59,83,.07);}
.tool:active{transform:scale(.97);}
.feedback{min-height:40px;font-size:1rem;font-weight:800;text-align:center;line-height:1.45;width:min(620px,100%);}
.ok{color:var(--ok);} .bad{color:var(--bad);}
.feedback small{display:block;font-size:.78rem;font-weight:700;color:#7b8ea8;margin-top:3px;}
.textbox{width:min(620px,100%);background:#fff;border:2px solid rgba(0,137,123,.25);border-radius:14px;
  padding:12px 14px;text-align:left;box-shadow:0 6px 18px rgba(36,59,83,.08);display:none;}
.textbox.show{display:block;}
.textbox .lbl{font-size:.68rem;font-weight:900;color:var(--accent);letter-spacing:.5px;}
.textbox .en{font-size:.92rem;font-weight:800;line-height:1.75;color:#00796b;margin-top:5px;font-family:Georgia,'Times New Roman',serif;}
.textbox .cn{font-size:.78rem;font-weight:700;line-height:1.7;color:#6b7f95;margin-top:6px;}
.textbox .ans{font-size:.82rem;font-weight:900;color:#1b7c33;margin-top:8px;line-height:1.6;}
.textbox .ans b{font-size:1rem;}
.hint{font-size:.72rem;font-weight:700;color:#93a7bd;text-align:center;line-height:1.4;}
.summary{display:none;flex-direction:column;align-items:center;gap:8px;width:min(560px,100%);
  background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;text-align:center;

.summary.show{display:flex;}
.sumtitle{font-size:1.05rem;font-weight:900;}
.sumline{font-size:1rem;font-weight:800;color:#2f4a63;}
.sumline b{color:var(--accent);font-size:1.22rem;}
.sumgrades{font-size:.78rem;font-weight:800;color:#7b8ea8;line-height:1.65;}
.sumagain{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid rgba(0,137,123,.3);
  background:#fff;color:#00796b;font-family:inherit;font-weight:900;font-size:.9rem;cursor:pointer;}
.notes{display:none;width:min(680px,100%);flex-direction:column;gap:8px;}
.notes.show{display:flex;}
.notecard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;

.notecard p{font-size:.76rem;font-weight:700;color:#7b8ea8;line-height:1.6;}

  font-size:.76rem;font-weight:900;text-decoration:none;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){

}

}

var elStreak = document.getElementById('streak');
var elBest = document.getElementById('best');
var elAcct = document.getElementById('acctBar');
var elPrompt = document.getElementById('prompt');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elSum = document.getElementById('summary');
var elNotes = document.getElementById('notes');
var elText = document.getElementById('textbox');

var KEY_PREFIX = 'english-douyin.best.';
var state = { acct:'xuezhang', streak:0, best:0, answered:false, cur:null, timer:null, session:{n:0,right:0} };

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function acctObj(k){ for(var i=0;i<ACCOUNTS.length;i++){ if(ACCOUNTS[i].k===k) return ACCOUNTS[i]; } return ACCOUNTS[0]; }
function itemsOf(k){ return acctObj(k).items; }
function byId(id){ var arr = itemsOf(state.acct); for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }

/* 每个账号一副独立牌：抽完才重洗 */
var queues = {};
function queueFor(k){
  var q = queues[k];
  if(!q || !q.left.length){
    var ids = itemsOf(k).map(function(it){ return it.id; });
    q = queues[k] = { left: shuffle(ids.slice()) };
  }
  return q;
}
function take(k){
  var q = queueFor(k);
  return byId(q.left.pop());
}

function speakEn(t){
  /* mp3 已按 -10% 语速合成，这里只叠全站语速滑杆 */
  if (window.XNLYSay){ XNLYSay.play(t, { rate:1 }); return; }
  if (window.XNLY && XNLY.voice) XNLY.voice.speak(t, { lang:'en-US', rate:0.9 });
  else if (window.speechSynthesis){
    var u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.9; window.speechSynthesis.speak(u);
  }
}
function speakZh(t){
  if (window.XNLY && XNLY.voice) XNLY.voice.speak(t, { lang:'zh-CN' });
}

function buildAcctBar(){
  elAcct.innerHTML = '';
  ACCOUNTS.forEach(function(a){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (state.acct === a.k ? ' on' : '');
    b.textContent = a.name + ' ' + a.items.length + ' 题';
    b.addEventListener('click', function(){ if(state.acct === a.k) return; switchAcct(a.k); });
    elAcct.appendChild(b);
  });
}

function switchAcct(k){
  state.acct = k;
  state.streak = 0;
  state.session = { n:0, right:0 };
  var b = parseInt(safeGet(KEY_PREFIX + k), 10);
  state.best = isNaN(b) || b < 0 ? 0 : b;
  updateStats();
  buildAcctBar();
  hideSummary();
  renderNotes();
  nextQuestion();
}

function updateStats(){
  elStreak.textContent = state.streak;
  elBest.textContent = state.best;
}

function setFb(html, good, sub){
  elFb.className = 'feedback ' + (good === true ? 'ok' : good === false ? 'bad' : '');
  elFb.innerHTML = html + (sub ? '<small>' + sub + '</small>' : '');
}

function showText(q, withAnswer){
  elText.innerHTML =
    '<div class="lbl">英文原文 · ' + acctObj(state.acct).name + ' ' + q.ep + '</div>' +
    '<div class="en">' + q.audio + '</div>' +
    '<div class="cn">' + q.zh + '</div>' +
    (withAnswer ? '<div class="ans">正确答案：<b>' + String.fromCharCode(65 + q.ans) + '</b> ' + q.opts[q.ans] + '<br>' + q.exp + '</div>' : '');
  elText.classList.add('show');
}
function hideText(){ elText.classList.remove('show'); elText.innerHTML = ''; }

function renderNotes(){
  var a = acctObj(state.acct);
  if(!a.only || !a.only.length){ elNotes.classList.remove('show'); elNotes.innerHTML = ''; return; }
  var html = '<div class="notecard"><h4>ℹ️ 关于五角星教育的原文</h4>' +
    '<p>该账号的听力视频只有 10~25 秒，画面是 A / B 两张图，<b>没有字幕、也没有文字稿</b>，英文台词只存在于音频里。' +
    '逐集抽查评论区后，只有【一】第 1 集有用户写出完整听写（已做成上面的题），其余只留下答案投票和零散关键词。' +
    '下面这些集数目前只能提供答案与关键词，点开原视频听完再对照即可，本页不虚构原文。</p></div>';
  a.only.forEach(function(o){
    html += '<div class="notecard"><h4>' + o.ep + '　答案：' + o.ans + '</h4>' +
      '<p>关键词：<span class="kw">' + o.kw + '</span></p>' +
      '<a href="https://www.douyin.com/video/' + o.id + '" target="_blank" rel="noopener">▶ 打开原视频听</a></div>';
  });
  elNotes.innerHTML = html;
  elNotes.classList.add('show');
}

function hideSummary(){ elSum.classList.remove('show'); elSum.innerHTML = ''; elOpts.style.display = ''; }

function showSummary(){
  clearTimeout(state.timer);
  var s = state.session;
  var total = s.n, acc = total ? Math.round(s.right / total * 100) : 0;
  var a = acctObj(state.acct);
  elSum.innerHTML =
    '<div class="sumtitle">🎉 ' + a.name + ' 这一轮练完了</div>' +
    '<div class="sumline">答对 <b>' + s.right + '</b> / ' + total + ' · 正确率 <b>' + acc + '%</b></div>' +
    '<div class="sumgrades">' + a.note + '</div>' +
    '<button class="sumagain" id="sumAgain" type="button">🔁 再练一轮</button>';
  elSum.classList.add('show');
  elOpts.style.display = 'none';
  elPrompt.innerHTML = '🎧 ' + a.name + ' 完成<span>可以切到别的账号，或再练一轮</span>';
  setFb('', null);
  hideText();
  speakZh('这一轮答对了' + s.right + '题，正确率百分之' + acc + '。');
  var btn = document.getElementById('sumAgain');
  if(btn) btn.addEventListener('click', function(){
    queues[state.acct] = null;
    state.session = { n:0, right:0 };
    state.streak = 0;
    updateStats();
    hideSummary();
    nextQuestion();
  });
}

function finishOrNext(){
  if(state.session.n >= itemsOf(state.acct).length) showSummary();
  else nextQuestion();
}

function nextQuestion(){
  clearTimeout(state.timer);
  hideSummary();
  hideText();
  state.answered = false;
  state.cur = take(state.acct);
  var q = state.cur;
  var a = acctObj(state.acct);

  elPrompt.innerHTML = '🎧 听一听，选出正确的答案' +
    '<span>' + a.name + ' · ' + q.ep + ' · 抖音号 ' + a.no + '</span>';
  elOpts.innerHTML = '';
  setFb('', null);

  q.opts.forEach(function(v, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = String.fromCharCode(65 + i) + '. ' + v;
    b.dataset.i = String(i);
    b.addEventListener('click', function(){ answer(i, b); });
    elOpts.appendChild(b);
  });

  setTimeout(function(){ if(!state.answered) speakEn(q.audio); }, 220);
}

function answer(i, btn){
  if(state.answered) return;
  state.answered = true;
  var q = state.cur;
  var right = (i === q.ans);
  state.session.n++;
  if(right) state.session.right++;

  Array.prototype.forEach.call(elOpts.children, function(b){
    var bi = Number(b.dataset.i);
    if(bi === q.ans) b.classList.add('good');
    if(b !== btn) b.disabled = true;
  });

  if(right){
    btn.classList.add('good', 'pop');
    state.streak++;
    if(state.streak > state.best){ state.best = state.streak; safeSet(KEY_PREFIX + state.acct, String(state.best)); }
    if(window.XNLY && XNLY.mark) XNLY.mark('right');
    setFb('✅ 答对了！', true, q.zh);
    showText(q, false);
    speakZh('答对了。' + q.zh);
    updateStats();
    state.timer = setTimeout(finishOrNext, 2400);
  } else {
    btn.classList.add('bad', 'shake');
    state.streak = 0;
    if(window.XNLY && XNLY.mark) XNLY.mark('wrong');
    setFb('❌ 正确答案是 ' + String.fromCharCode(65 + q.ans), false, q.zh);
    showText(q, true);
    speakZh('正确答案是' + String.fromCharCode(65 + q.ans) + '。');
    updateStats();
    state.timer = setTimeout(finishOrNext, 4200);
  }
}

function replayNow(){
  if(window.XNLY && XNLY.voice && XNLY.voice.cancel){ try{ XNLY.voice.cancel(); }catch(e){} }
  if(state.cur) speakEn(state.cur.audio);
}
document.getElementById('btnReplay').addEventListener('click', replayNow);
/* 顶栏 🔊：重放当前题（homebtn.js 优先调用这个名字） */
window.replayCurrent = replayNow;
/* 顶栏 ⏭：跳过当前题，不判分、不泄题；仍计入本轮题数，保证小结数对得上 */
window.XNLY_NEXT = function(){
  if(!state.cur) return;
  if(window.XNLY && XNLY.voice && XNLY.voice.cancel){ try{ XNLY.voice.cancel(); }catch(e){} }
  clearTimeout(state.timer);
  state.session.n++;
  state.streak = 0;
  state.answered = true;     /* 防止 pointerdown / 延时朗读把跳过题再读一遍 */
  updateStats();
  finishOrNext();
};
document.getElementById('btnText').addEventListener('click', function(){
  if(!state.cur) return;
  if(elText.classList.contains('show')) hideText();
  else showText(state.cur, !!state.answered);
});

(function init(){
  var b = parseInt(safeGet(KEY_PREFIX + state.acct), 10);
  state.best = isNaN(b) || b < 0 ? 0 : b;
  state.session = { n:0, right:0 };
  buildAcctBar();
  updateStats();
  renderNotes();
  nextQuestion();

  var firstTap = false;
  document.addEventListener('pointerdown', function(){
    if(firstTap) return;
    firstTap = true;
    if(window.XNLYSay){ try{ XNLYSay.unlock(); }catch(e){} }
    if(window.XNLY && XNLY.voice && XNLY.voice.unlock){ try{ XNLY.voice.unlock(); }catch(e){} }
    if(!state.answered && state.cur) speakEn(state.cur.audio);
  }, { passive:true });
})();
</script>
