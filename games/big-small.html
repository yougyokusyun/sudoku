<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>大小比较 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:10px;gap:6px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:0 0 auto;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.prompt{font-size:1.05rem;font-weight:800;text-align:center;flex:0 0 auto;}
.feedback{min-height:28px;font-size:1.1rem;font-weight:800;text-align:center;flex:0 0 auto;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 下面的样式按每个游戏自行补充，但请保持上面的变量与动画不变 */
.options{display:flex;gap:12px;width:100%;max-width:none;flex:1;min-height:0;}
.bs-card{flex:1;min-width:0;min-height:0;border:none;border-radius:22px;
  background:#fff;box-shadow:0 8px 22px rgba(36,59,83,.13);display:flex;align-items:center;
  justify-content:center;padding:4px;cursor:pointer;overflow:hidden;}
.bs-emoji{display:block;line-height:1;text-align:center;white-space:nowrap;}
.bs-emoji.big{font-size:clamp(74px,15vh,130px);}
.bs-emoji.small{font-size:clamp(34px,8vh,48px);}
#lvl{flex:0 0 auto;}
@media (max-width:899px){
  .options{flex-direction:column;}
}
@media (max-height:430px){
  .bs-card{border-radius:18px;}
  .bs-emoji.big{font-size:64px;}
  .bs-emoji.small{font-size:34px;}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png"><script src="../voice.js"></script>
<script src="../sound.js"></script>
<script src="../deck.js"></script>
</head>
<body>
<header>
  <h1>🐘 大小比较</h1>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <div class="prompt" id="prompt"></div>
  <div id="lvl" style="text-align:center;font-size:.78rem;font-weight:800;color:#8aa0b8;"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
</div>
<script>
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function feedback(text,good){var f=document.getElementById('feedback');f.className='feedback '+(good?'ok':'bad');f.textContent=text;}
function replay(node,cls){node.classList.remove('pop','shake');void node.offsetWidth;node.classList.add(cls);}
/* 游戏逻辑 */
var PAIRS=[
  {big:'🐘',small:'🐭'},
  {big:'🌳',small:'🌱'},
  {same:'🏠'},
  {big:'🍉',small:'🍓'},
  {big:'🚌',small:'🚗'}
];
let locked=false,newRoundTimer=null,askBig=true,lockTimer=null;

/* 难度档位：连对 3 题升一档，错 2 题降一档
 *   1 档：2 选 1，大小差距很大
 *   2 档：2 选 1，大小差距变小
 *   3 档：3 选 1，找出最大 / 最小 */
var LEVELS=[
  {n:2,big:4.64,small:1.84,txt:'2 选 1 · 差距大'},
  {n:2,big:3.44,small:2.56,txt:'2 选 1 · 差距小'},
  {n:3,big:4.32,small:2.32,txt:'3 选 1 · 找最大 / 最小'}
];
var level=1, okRun=0, badRun=0;

function clearFeedback(){var f=document.getElementById('feedback');f.className='feedback';f.textContent='';}

function setLevel(n){
  level=Math.min(LEVELS.length,Math.max(1,n));
  var el=document.getElementById('lvl');
  if(el) el.textContent='第 '+level+' 档 · '+LEVELS[level-1].txt;
  try{localStorage.setItem('pbs.level',String(level));}catch(e){}
}

var bsDeck = null, bsKey = '';
function bsPool() {
  var out = [];
  PAIRS.forEach(function (p) {
    out.push({ p: p, askBig: true });
    out.push({ p: p, askBig: false });
  });
  return out;
}
function bsDeckFor() {
  var k = 'big-small.' + level;
  if (!bsDeck || bsKey !== k) {
    bsDeck = XNLY.deck.make(bsPool(), k, { head: 5 });
    bsKey = k;
  }
  return bsDeck;
}

function newRound(){
  clearTimeout(newRoundTimer);
  locked=true;                                  /* 800ms 输入锁，防连点 */
  clearTimeout(lockTimer);
  lockTimer=setTimeout(function(){locked=false;},800);

  var cfg=LEVELS[level-1];
  var q=bsDeckFor().next();
  var p=q.p;
  var bigEmoji=p.same||p.big, smallEmoji=p.same||p.small;
  askBig=q.askBig;

  var opts=[{emoji:bigEmoji,size:'big',fs:cfg.big},
            {emoji:smallEmoji,size:'small',fs:cfg.small}];
  if(cfg.n>=3){
    var pool=PAIRS.map(function(x){return x.same||x.small;}).concat(PAIRS.map(function(x){return x.big;}));
    var third=pick(pool), guard=0;
    while((third===bigEmoji||third===smallEmoji)&&guard++<30){ third=pick(pool); }
    opts.push({emoji:third,size:'small',fs:cfg.small});
  }
  opts=shuffle(opts);

  document.getElementById('prompt').textContent=askBig?'哪个更大？':'哪个更小？';
  document.getElementById('options').innerHTML=opts.map(function(o){
    return '<button class="bs-card" type="button" data-size="'+o.size+'">'+
           '<span class="bs-emoji '+o.size+'" style="font-size:'+o.fs+'em">'+o.emoji+'</span></button>';
  }).join('');
  clearFeedback();
  fitCards();
  voiceSpeak(askBig?'哪个更大？':'哪个更小？');
}

/* 事件只绑定一次 */
document.getElementById('options').addEventListener('click',function(e){
  var card=e.target.closest('.bs-card');
  if(!card||locked)return;
  var isBig=card.dataset.size==='big';
  if(isBig===askBig){
    locked=true;
    replay(card,'pop');
    feedback('✅ 对啦！'+(askBig?'这个好大呀！':'这个小巧巧！'),true);
    voiceSpeak(askBig?'对啦，这个大！':'对啦，这个小！');
    if(window.XNLY) XNLY.sound.correct();
    okRun++; badRun=0;
    if(okRun>=3&&level<LEVELS.length){ okRun=0; setLevel(level+1); if(window.XNLY) XNLY.sound.win(); }
    clearTimeout(newRoundTimer);
    newRoundTimer=setTimeout(function(){locked=false;newRound();},1000);
  }else{
    replay(card,'shake');
    feedback('❌ 再试试',false);
    voiceSpeak(askBig?'再看看，哪一个大一点？':'再看看，哪一个小一点？');
    badRun++; okRun=0;
    if(badRun>=2&&level>1){ badRun=0; setLevel(level-1); }
    if(window.XNLY) XNLY.sound.wrong();
  }
});

/* 读回上次的档位 */
(function(){
  var saved=parseInt('0'+localStorage.getItem('pbs.level'),10);
  setLevel(saved>=1&&saved<=LEVELS.length?saved:1);
})();
newRound();

/* 按剩余空间把对比图做到最大：不滚动、不裁切，小图保持与图的比例 */
function fitCards(){
  var cards=[].slice.call(document.querySelectorAll('.bs-card'));
  if(!cards.length)return;
  cards.forEach(function(card){
    var span=card.querySelector('.bs-emoji');
    if(!span)return;
    var w=card.clientWidth-10, h=card.clientHeight-10;
    if(w<=0||h<=0)return;
    var size=Math.min(w/1.40, h);
    if(span.classList.contains('small')) size=size*0.42;
    span.style.fontSize=Math.max(14,Math.floor(size))+'px';
  });
}
var fitTimer=null;
function fitLater(){ clearTimeout(fitTimer); fitTimer=setTimeout(fitCards,60); }
window.addEventListener('resize',fitLater);
window.addEventListener('orientationchange',fitLater);

/* ===== 语音播报：进入先读玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '大小比较游戏。听清楚问题，再点一下对的那一个。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进游戏自动朗读；若被浏览器拦截，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  try {
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);   /* 不打断正在读的题目，排队播报玩法 */
  } catch (e) { }
  setTimeout(function () {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
    var once = function () { document.removeEventListener('pointerdown', once); voiceSpeak(VOICE_TEXT); };
    document.addEventListener('pointerdown', once);
  }, 900);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.1);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();

/* 顶栏「下一题」：跳过当前题，不判分、不显示答案、不清空连对 */
window.XNLY_NEXT = function () {
  try { if (window.XNLY && XNLY.voice && XNLY.voice.cancel) XNLY.voice.cancel(); } catch (e) { }
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
  newRound();
};
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
<script src="../homebtn.js"></script>
</body>
</html>
