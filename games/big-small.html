<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>大小比较 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.prompt{font-size:1.1rem;font-weight:800;text-align:center;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 下面的样式按每个游戏自行补充，但请保持上面的变量与动画不变 */
.options{display:flex;gap:16px;width:100%;max-width:620px;}
.bs-card{flex:1;min-width:0;min-height:clamp(130px,30vh,210px);border:none;border-radius:26px;
  background:#fff;box-shadow:0 8px 22px rgba(36,59,83,.13);display:flex;align-items:center;
  justify-content:center;padding:8px;cursor:pointer;overflow:hidden;}
.bs-emoji{line-height:1;}
.bs-emoji.big{font-size:clamp(74px,15vh,130px);}
.bs-emoji.small{font-size:clamp(34px,8vh,48px);}
@media (max-height:430px){
  .bs-card{min-height:96px;border-radius:18px;}
  .bs-emoji.big{font-size:64px;}
  .bs-emoji.small{font-size:34px;}
}
</style>
</head>
<body>
<header>
  <h1>🐘 大小比较</h1>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <div class="prompt" id="prompt"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
</div>
<script>
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function feedback(text,good){var f=document.getElementById('feedback');f.className='feedback '+(good?'ok':'bad');f.textContent=text;}
function replay(node,cls){node.classList.remove('pop','shake');void node.offsetWidth;node.classList.add(cls);}
/* 游戏逻辑 */
var PAIRS=[
  {big:'🐘',small:'🐭'},
  {big:'🌳',small:'🌱'},
  {same:'🏠'},
  {big:'🍉',small:'🍓'},
  {big:'🚌',small:'🚗'}
];
let locked=false,newRoundTimer=null,askBig=true;

function clearFeedback(){var f=document.getElementById('feedback');f.className='feedback';f.textContent='';}

function newRound(){
  var p=pick(PAIRS);
  var bigEmoji=p.same||p.big, smallEmoji=p.same||p.small;
  askBig=Math.random()<0.5;
  document.getElementById('prompt').textContent=askBig?'哪个更大？':'哪个更小？';
  var opts=shuffle([{emoji:bigEmoji,size:'big'},{emoji:smallEmoji,size:'small'}]);
  document.getElementById('options').innerHTML=opts.map(function(o){
    return '<button class="bs-card" type="button" data-size="'+o.size+'">'+
           '<span class="bs-emoji '+o.size+'">'+o.emoji+'</span></button>';
  }).join('');
  clearFeedback();
  voiceSpeak(askBig?'哪个更大？':'哪个更小？');
}

/* 事件只绑定一次 */
document.getElementById('options').addEventListener('click',function(e){
  var card=e.target.closest('.bs-card');
  if(!card||locked)return;
  var isBig=card.dataset.size==='big';
  if(isBig===askBig){
    locked=true;
    replay(card,'pop');
    feedback('✅ 对啦！'+(askBig?'这个好大呀！':'这个小巧巧！'),true);
    voiceSpeak(askBig?'对啦，这个大！':'对啦，这个小！');
    clearTimeout(newRoundTimer);
    newRoundTimer=setTimeout(function(){locked=false;newRound();},1000);
  }else{
    replay(card,'shake');
    feedback('❌ 再试试',false);
    voiceSpeak(askBig?'再看看，哪一个大一点？':'再看看，哪一个小一点？');
  }
});

newRound();

/* ===== 语音播报：进入先读玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '大小比较游戏。听清楚问题，再点一下对的那一个。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进游戏自动朗读；若被浏览器拦截，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  try {
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);   /* 不打断正在读的题目，排队播报玩法 */
  } catch (e) { }
  setTimeout(function () {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
    var once = function () { document.removeEventListener('pointerdown', once); voiceSpeak(VOICE_TEXT); };
    document.addEventListener('pointerdown', once);
  }, 900);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.1);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();
</script>
</body>
</html>
