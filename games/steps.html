<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>步骤排序 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:10px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 14px;font-weight:800;font-size:.85rem;box-shadow:0 3px 10px rgba(36,59,83,.10);}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.prompt{font-size:1.1rem;font-weight:800;text-align:center;}
.feedback{min-height:32px;font-size:1.2rem;font-weight:800;text-align:center;}
.ok{color:var(--ok);} .bad{color:var(--bad);}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s ease;} .shake{animation:shake .45s ease;}
@media (max-height:430px){ body{padding:8px;gap:6px;} h1{font-size:1rem;} .prompt{font-size:.95rem;} .feedback{min-height:24px;font-size:1rem;} }
/* 每个游戏自行补充样式，但保持上面的变量与动画不变 */
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:100%;}
.card{width:clamp(80px,22vw,100px);min-height:88px;padding:6px;border:0;border-radius:18px;
  background:#fff;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 16px rgba(36,59,83,.12);
  transition:transform .18s ease,box-shadow .18s ease;}
.card:active{transform:scale(.95);}
.card .emoji{font-size:clamp(1.5rem,4.4vw,1.9rem);line-height:1;}
.card .txt{font-size:clamp(.72rem,2.4vw,.85rem);font-weight:800;text-align:center;}
.card.done{background:#e9fbee;box-shadow:0 0 0 3px var(--ok) inset;color:#1a7f2c;}
.card.miss{box-shadow:0 0 0 3px var(--bad) inset;animation:shake .45s ease;}
.card.pulse{animation:pulse .8s ease 2;}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 16px rgba(36,59,83,.12);}
  50%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(124,92,255,.2);}}
.card.incell{width:100%;min-height:0;height:100%;padding:2px;border-radius:12px;box-shadow:none;}
.card.incell .emoji{font-size:1.15rem;}
.card.incell .txt{font-size:.6rem;}
.slots{display:flex;justify-content:center;gap:16px;width:100%;max-width:520px;}
.cell{flex:1 1 0;min-width:0;height:82px;border:3px dashed #b6c4d3;border-radius:16px;
  background:rgba(255,255,255,.65);position:relative;display:flex;align-items:center;justify-content:center;
  transition:background .2s ease,border-color .2s ease;}
.cell .num{position:absolute;top:-9px;left:-7px;width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:.85rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(124,92,255,.35);}
.cell.flash{border-color:var(--bad);background:rgba(255,92,92,.14);}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;}
.tbtn{border:0;background:#fff;color:var(--ink);font-weight:800;font-size:.92rem;border-radius:999px;
  padding:12px 20px;min-height:48px;box-shadow:0 3px 10px rgba(36,59,83,.12);cursor:pointer;
  transition:transform .15s ease;}
.tbtn:active{transform:scale(.96);}
.tbtn.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(124,92,255,.4);}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9;}
.confetti span{position:absolute;top:-12%;animation:fall 1.4s ease-in forwards;}
@keyframes fall{0%{opacity:0;transform:translate(0,-20px) scale(.6) rotate(0)}
  100%{opacity:1;transform:translate(var(--dx),108vh) scale(1.1) rotate(25deg)}}
@media (max-height:430px){
  .stage{gap:8px;}
  .card{width:clamp(76px,17vw,96px);min-height:80px;}
  .cell{height:72px;}
  .tbtn{padding:9px 16px;min-height:44px;}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png"><script src="../voice.js"></script>
<script src="../sound.js"></script>
<script src="../deck.js"></script>
<script src="../kidseq.js"></script>
</head>
<body>
<header>
  <h1>🧼 步骤排序</h1>
  <a class="back" href="../index.html">🏠 首页</a>
</header>
<div class="stage">
  <!-- 一次点一步：图卡在上，编号空槽在下 -->
  <div class="prompt" id="qtext">按顺序点一点：先做什么？</div>
  <div class="kidseq-pool" id="pool"></div>
  <div class="kidseq-slots" id="slots"></div>
  <div class="feedback" id="feedback"></div>
</div>
<script>
/* 5 个洗手步骤，分两轮：3 步 + 2 步（单轮不超过 4 步） */
var STEPS = [
  { order: 1, emoji: '🚰', text: '开水龙头' },
  { order: 2, emoji: '🧼', text: '抹肥皂' },
  { order: 3, emoji: '🤲', text: '搓搓手' },
  { order: 4, emoji: '💧', text: '冲干净' },
  { order: 5, emoji: '🧻', text: '擦干手' }
];

function itemOf(s) { return { emoji: s.emoji, text: s.text, short: s.text }; }

var ROUNDS = [
  {
    items: STEPS.slice(0, 3).map(itemOf),
    sentence: '先开水龙头，再抹肥皂，然后搓搓手。'
  },
  {
    items: STEPS.slice(3, 5).map(itemOf),
    sentence: '先冲干净，再擦干手。'
  }
];

var game = XNLY.kidseq.mount({
  pool: document.getElementById('pool'),
  slots: document.getElementById('slots'),
  prompt: document.getElementById('qtext'),
  feedback: document.getElementById('feedback'),
  key: 'steps',
  rounds: ROUNDS
});

window.__steps = { rounds: ROUNDS, game: game };
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
<script src="../homebtn.js"></script>
</body>
</html>
