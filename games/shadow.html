<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🌑 影子配对 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--bad:#ff5c5c;--accent:#7c5cff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;user-select:none;gap:8px;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.chips{margin-left:auto;display:flex;gap:6px;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(255,255,255,.72);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:12px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);}
.prompt{font-size:1rem;font-weight:800;text-align:center;color:#4a5f78;}

.hero{width:112px;height:112px;border-radius:26px;background:#fff;display:flex;align-items:center;
  justify-content:center;font-size:3.4rem;line-height:1;box-shadow:0 8px 20px rgba(36,59,83,.14);
  border:3px solid rgba(124,92,255,.22);animation:popIn .3s ease;overflow:hidden;}
.hero .ph{width:94px;height:94px;border-radius:18px;object-fit:cover;}
.hero.win{animation:pop .5s ease;}

.shadows{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;}
.shadow{width:96px;height:96px;border-radius:24px;background:#fff;border:3px dashed rgba(36,59,83,.30);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 6px 16px rgba(36,59,83,.10);
  transition:transform .15s ease,box-shadow .15s ease,border-color .2s ease,background .2s ease;}
/* 只把「图案」涂黑：滤镜若加在卡片上，会把白色底也一起变黑，看上去就是一个黑方块 */
.shadow .g{font-size:2.8rem;line-height:1;filter:brightness(0) saturate(0);opacity:.78;
  transition:filter .2s ease,opacity .2s ease;}
/* 剪影照片本身就是黑影白底，不需要再涂黑 */
.shadow img.g{width:88%;height:88%;object-fit:contain;filter:none;opacity:1;border-radius:10px;}
.shadow:active{transform:scale(.95);}
.shadow.good{border:3px solid var(--ok);border-style:solid;background:#e7fbeb;animation:pop .45s ease;}
.shadow.good .g{filter:none;opacity:1;}
.shadow.badd{border:3px solid var(--bad);border-style:solid;background:#ffeded;animation:shake .45s ease;}

.feedback{min-height:30px;font-size:1.05rem;font-weight:800;text-align:center;color:var(--muted);}
.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);animation:shake .45s ease;}

.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;width:100%;}
.btn{min-width:120px;min-height:46px;padding:0 20px;border:2px solid rgba(36,59,83,.10);border-radius:999px;
  background:#fff;color:var(--ink);font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(36,59,83,.10);}
.btn.primary{border-color:rgba(124,92,255,.5);color:#fff;background:linear-gradient(135deg,#8b6bff,#6a4bff);}

@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

@media (max-height:430px){
  body{padding:6px 10px;gap:5px;}
  h1{font-size:.95rem;}
  .chip{padding:2px 8px;font-size:.68rem;}
  .stage{gap:7px;padding:8px;border-radius:16px;}
  .prompt{font-size:.86rem;}
  .hero{width:78px;height:78px;font-size:2.4rem;border-radius:20px;}
  .hero .ph{width:64px;height:64px;border-radius:12px;}
  .shadows{gap:10px;}
  .shadow{width:72px;height:72px;border-radius:18px;}
  .shadow .g{font-size:2.1rem;}
  .feedback{min-height:20px;font-size:.9rem;}
  .btn{min-height:36px;font-size:.8rem;}
}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">🏠 首页</a>
  <h1>🌑 影子配对</h1>
  <div class="chips">
    <span class="chip">🔥 连对 <b id="streak">0</b></span>
    <span class="chip">🏆 最佳 <b id="best">0</b></span>
  </div>
</header>

<div class="stage">
  <div class="prompt">哪个影子是这个东西的形状？点一下👇</div>
  <div class="hero" id="hero">🍎</div>
  <div class="shadows" id="shadows"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="btn primary" id="next" type="button">🔄 换一个</button>
  </div>
</div>

<script>
var POOL = [
  { e: '🐶', f: 'dog' }, { e: '🐱', f: 'cat' }, { e: '🐰', f: 'rabbit' }, { e: '🐼', f: 'panda' },
  { e: '🦊', f: 'fox' }, { e: '🐸', f: 'frog' }, { e: '🐷', f: 'pig' }, { e: '🐮', f: 'cow' },
  { e: '🐵', f: 'monkey' }, { e: '🐧', f: 'penguin' }, { e: '🦋', f: 'butterfly' }, { e: '🐢', f: 'turtle' },
  { e: '🐟', f: 'fish' }, { e: '🐘', f: 'elephant' }, { e: '🍎', f: 'apple' }, { e: '🍓', f: 'strawberry' },
  { e: '🍌', f: 'banana' }, { e: '🍇', f: 'grape' }, { e: '🍉', f: 'watermelon' }, { e: '🏠', f: 'house' }
];

var cur = '', answer = '', streak = 0, best = readNum('pshadow.best');
var locked = false, timer = null;

var elHero = document.getElementById('hero');
var elShadows = document.getElementById('shadows');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');
var elBest = document.getElementById('best');

function readNum(k) { var v = parseInt(localStorage.getItem(k), 10); return isNaN(v) ? 0 : v; }
function writeNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function updateStats() { elStreak.textContent = streak; elBest.textContent = best; }
/* 本地彩色照片，加载失败时回退 emoji */
function setPhoto(host, f, emoji) {
  host.innerHTML = '';
  var img = new Image();
  img.className = 'ph';
  img.alt = emoji;
  img.onerror = function () { host.innerHTML = ''; host.textContent = emoji; };
  img.src = 'img/' + f + '.jpg';
  host.appendChild(img);
}
/* 剪影照片（img/<f>_sil.jpg），失败时回退「涂黑的 emoji」 */
function setShadowImg(host, o) {
  var img = new Image();
  img.className = 'g';
  img.alt = o.e;
  img.onerror = function () {
    var s = document.createElement('span');
    s.className = 'g';
    s.textContent = o.e;
    if (img.parentNode) img.parentNode.replaceChild(s, img);
  };
  img.src = 'img/' + o.f + '_sil.jpg';
  host.appendChild(img);
}
function feedback(t, cls) {
    elFb.className = 'feedback' + (cls ? ' ' + cls : '');
    elFb.textContent = t || '';
}

function newRound() {
    clearTimeout(timer);
    locked = false;

    var pick = shuffle(POOL);
    answer = pick[0];
    var wrongs = pick.slice(1, 3);
    while (cur === answer) { pick = shuffle(POOL); answer = pick[0]; wrongs = pick.slice(1, 3); }
    cur = answer;

    setPhoto(elHero, answer.f, answer.e);
    elHero.classList.remove('win');
    void elHero.offsetWidth;

    var three = shuffle([answer].concat(wrongs));
    elShadows.innerHTML = '';
    three.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'shadow';
        d.setAttribute('data-e', o.e);
        setShadowImg(d, o);
        d.addEventListener('click', function () { tap(d, o); });
        elShadows.appendChild(d);
    });

    window.__answer = answer.e;
    window.__shadows = three.map(function (o) { return o.e; });
    feedback('');
    voiceSpeak('哪个影子是它的形状？');
}

function tap(el, o) {
    if (locked || el.classList.contains('good')) return;
    if (o === answer) {
        locked = true;
        el.classList.add('good');
        /* 答对后把剪影换成彩色照片（emoji 回退时靠 .good .g 去掉涂黑滤镜） */
        var im = el.querySelector('img.g');
        if (im) { im.onerror = null; im.src = 'img/' + answer.f + '.jpg'; }
        elHero.classList.add('win');
        streak++;
        if (streak > best) { best = streak; writeNum('pshadow.best', best); }
        updateStats();
        feedback('✅ 找对啦！影子就是它', 'ok');
        voiceSpeak('找对啦，影子就是它');
        timer = setTimeout(newRound, 1200);
    } else {
        el.classList.add('badd');
        setTimeout(function () { el.classList.remove('badd'); }, 450);
        feedback('❌ 这个不是它的影子，再看看', 'bad');
        voiceSpeak('这个不是它的影子，再看看');
    }
}

document.getElementById('next').addEventListener('click', function () {
    streak = 0;
    updateStats();
    newRound();
});

function initShadow() {
    best = readNum('pshadow.best');
    updateStats();
    newRound();
}
function resetShadow() {
    streak = 0;
    updateStats();
    newRound();
}
initShadow();

/* ===== 语音播报：进入先读玩法，右上角 🔊 可随时重听 ===== */
var VOICE_TEXT = '影子配对游戏。上面有一个东西，下面的影子里，哪个是它的形状？点一下。';
var CAN_VOICE = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function voiceSpeak(text) {
  if (!CAN_VOICE || !text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
/* 进游戏自动朗读；若被浏览器拦截，孩子第一次碰屏幕时补读 */
function voiceEntry() {
  if (!CAN_VOICE) return;
  var started = false;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(VOICE_TEXT);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.12;
    u.onstart = function () { started = true; };
    window.speechSynthesis.speak(u);
  } catch (e) { }
  setTimeout(function () {
    if (started) return;
    var once = function () { document.removeEventListener('pointerdown', once); voiceSpeak(VOICE_TEXT); };
    document.addEventListener('pointerdown', once);
  }, 700);
}
(function () {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = '🔊'; b.title = '再听一遍玩法';
  b.style.cssText = 'flex:none;width:44px;height:44px;border-radius:999px;border:2px solid rgba(36,59,83,.1);' +
    'background:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 12px rgba(36,59,83,.12);cursor:pointer;';
  b.onclick = function () { voiceSpeak(VOICE_TEXT); };
  var h = document.querySelector('header');
  if (h) { h.appendChild(b); } else { document.body.appendChild(b); }
})();
voiceEntry();
</script>
</body>
</html>
