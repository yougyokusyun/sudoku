<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d7fd0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>英语句型 · 对话学习 · 小脑袋乐园</title>
<link rel="icon" type="image/png" href="../games/img/icon-192.png">
<script src="../voice.js"></script>
<script src="../sound.js"></script>
<script src="../audio-en.js"></script>
<style>
:root{
  --ink:#16324f; --muted:#7a8ba0; --line:rgba(22,50,79,.10);
  --a:#f1f8fe; --a-br:#cfdff0; --a-ink:#1668b3;
  --b:#f0fbf6; --b-br:#c7e8da; --b-ink:#0b7a5c;
  --ok:#1f9d63; --bad:#e5484d; --blue:#1d7fd0; --amber:#e8912a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  color:var(--ink); user-select:none; -webkit-font-smoothing:antialiased;
  background:linear-gradient(175deg,#f7fbff 0%,#f4faf7 55%,#fffdf7 100%);
  min-height:100dvh; display:flex; flex-direction:column;
  padding:0 0 96px;
}
header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px;
  padding:10px 14px; background:rgba(255,255,255,.86);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.back{
  display:inline-flex; align-items:center; gap:3px; height:34px; padding:0 12px;
  border-radius:999px; background:#fff; border:1px solid var(--line);
  color:var(--blue); font-weight:700; font-size:.8rem; text-decoration:none; flex:none;
}
h1{font-size:1rem; font-weight:700; letter-spacing:.2px;}
h1 small{display:block; font-size:.66rem; font-weight:500; color:var(--muted); margin-top:1px;}
.hstat{margin-left:auto; display:flex; gap:6px; align-items:center;}
.pill{
  background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:5px 11px; font-size:.72rem; font-weight:700; color:var(--muted); white-space:nowrap;
}
.pill b{color:var(--blue); font-size:.82rem;}
.tabs{display:flex; gap:6px; width:100%;}
.tab{
  flex:1; height:38px; border-radius:12px; border:1px solid var(--line); background:#fff;
  font-family:inherit; font-size:.84rem; font-weight:700; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:5px; transition:.16s;
}
.tab.on{background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 4px 14px rgba(29,127,208,.28);}

main{flex:1; display:flex; flex-direction:column; padding:14px 14px 0; max-width:720px; width:100%; margin:0 auto;}

/* ---------- 场景头 ---------- */
.shead{margin-bottom:12px;}
.sline{display:flex; align-items:baseline; gap:8px; margin-bottom:6px;}
.sno{font-size:.72rem; font-weight:700; color:var(--blue); letter-spacing:1px;}
.stitle{font-size:1.16rem; font-weight:700; letter-spacing:.2px;}
.sbadges{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.bdg{font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--muted);}
.bdg.g{background:#fff6e8; border-color:#f5dcbb; color:#a9691a;}
.bdg.c{background:#eef6ff; border-color:#cfe0f5; color:#1a69ad; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- 对话气泡 ---------- */
.chat{display:flex; flex-direction:column; gap:9px; padding-bottom:8px;}
.row{display:flex; gap:9px; align-items:flex-start; animation:pop .3s cubic-bezier(.2,.9,.3,1.2) both;}
.row.B{flex-direction:row-reverse;}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.97);}to{opacity:1;transform:none;}}
.av{
  width:32px; height:32px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:.76rem; font-weight:800; margin-top:2px;
}
.row.A .av{background:#d9ecfb; color:var(--a-ink);}
.row.B .av{background:#c9efe0; color:var(--b-ink);}
.bub{
  max-width:78%; padding:9px 13px 10px; border-radius:16px; background:#fff;
  border:1px solid var(--a-br); transition:box-shadow .2s, border-color .2s;
}
.row.A .bub{background:var(--a); border-top-left-radius:5px;}
.row.B .bub{background:var(--b); border-color:var(--b-br); border-top-right-radius:5px;}
.en{font-size:1.01rem; line-height:1.52; font-weight:500; letter-spacing:.1px; word-break:break-word;}
.zh{font-size:.75rem; line-height:1.5; color:var(--muted); margin-top:4px;}
.say{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
  background:rgba(29,127,208,.10); color:var(--blue); font-size:.66rem; margin-left:6px; vertical-align:2px; cursor:pointer;}
.row.on .bub{border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,127,208,.13);}
.row.dim{opacity:.5;}
.row.hidden{display:none;}

/* ---------- 句型条 ---------- */
.patbox{margin-top:14px; border-radius:14px; border:1px dashed #d5e3f2; background:#fbfdff; padding:11px 13px;}
.patbox h3{font-size:.75rem; font-weight:700; color:var(--blue); margin-bottom:7px; letter-spacing:.3px;}
.patbox ul{list-style:none; display:flex; flex-direction:column; gap:6px;}
.patbox li{font-size:.83rem; line-height:1.45;}
.patbox li i{font-style:normal; color:var(--muted); font-size:.73rem; margin-left:5px;}

/* ---------- 底部控制 ---------- */
.ctrl{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line); max-width:720px; margin:0 auto;
}
.cbtn{
  height:46px; border-radius:13px; border:1px solid var(--line); background:#fff; font-family:inherit;
  font-size:.85rem; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:5px; transition:.15s; white-space:nowrap;
}
.cbtn:active{transform:scale(.96);}
.cbtn.ic{width:46px; flex:none; font-size:1rem;}
.cbtn.main{flex:1; background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 5px 16px rgba(29,127,208,.3);}
.cbtn.side{flex:0 0 auto; padding:0 14px; color:var(--blue); border-color:#cfdff0; background:#f4faff;}
.cbtn:disabled{opacity:.45;}

/* ---------- 测试 ---------- */
.qwrap{display:flex; flex-direction:column; gap:12px;}
.qhead{display:flex; align-items:center; gap:8px;}
.qtag{font-size:.68rem; font-weight:700; padding:4px 9px; border-radius:7px; background:#eef6ff; color:#1a69ad;}
.qtag.w{background:#fff4e8; color:#a9691a;}
.qno{margin-left:auto; font-size:.72rem; color:var(--muted); font-weight:700;}
.prog{height:5px; border-radius:4px; background:rgba(22,50,79,.08); overflow:hidden;}
.prog>i{display:block; height:100%; width:0; background:linear-gradient(90deg,#1d7fd0,#22b07d); transition:width .3s;}

.qcard{background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:0 6px 20px rgba(22,50,79,.05);}
.blank{
  display:inline-block; min-width:88px; border-bottom:2px dashed var(--blue); color:var(--blue);
  font-weight:700; text-align:center; padding:0 6px; line-height:1.3;
}
.sent{font-size:1.06rem; line-height:1.85; font-weight:500;}
.sent .gap{display:inline-block; min-width:74px; border-bottom:2px dashed var(--blue); text-align:center; color:var(--blue); font-weight:700;}

.opts{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; min-height:50px; padding:9px 13px;
  border-radius:13px; border:1.5px solid #e2ebf4; background:#fbfdff; font-family:inherit;
  font-size:.95rem; font-weight:500; color:var(--ink); text-align:left; cursor:pointer; transition:.15s;
}
.opt:active{transform:scale(.99);}
.opt .k{
  width:24px; height:24px; flex:none; border-radius:7px; background:#e9f1f9; color:#5a7a99;
  color:#5a7a99; display:grid; place-items:center; font-size:.74rem; font-weight:800;
}
.opt.right{border-color:var(--ok); background:#effaf4;}
.opt.right .k{background:var(--ok); color:#fff;}
.opt.wrong{border-color:var(--bad); background:#fdf0f0;}
.opt.wrong .k{background:var(--bad); color:#fff;}
.opt:disabled{cursor:default;}

.fb{margin-top:10px; font-size:.82rem; line-height:1.55; padding:10px 12px; border-radius:11px; display:none;}
.fb.show{display:block;}
.fb.ok{background:#effaf4; color:#137a4e;}
.fb.no{background:#fdf0f0; color:#b3353a;}

.big{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:26px 16px;}
.big .score{font-size:3rem; font-weight:800; color:var(--blue); line-height:1;}
.big .score small{font-size:.9rem; color:var(--muted); font-weight:600;}
.big h2{font-size:1.1rem;}

/* ---------- 开始遮罩 ---------- */
.mask{
  position:fixed; inset:0; z-index:99; display:grid; place-items:center; padding:24px;
  background:rgba(247,251,255,.94); backdrop-filter:blur(6px); transition:opacity .3s;
}
.mask.hide{opacity:0; pointer-events:none;}
.mask .box{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; max-width:320px;}
.mask .ic{width:74px; height:74px; border-radius:24px; background:linear-gradient(150deg,#dcecfb,#cfefe1); display:grid; place-items:center; font-size:2rem;}
.mask h2{font-size:1.15rem; font-weight:700;}
.mask p{font-size:.82rem; color:var(--muted); line-height:1.6;}
.mask button{
  height:50px; padding:0 34px; border-radius:14px; border:0; background:var(--blue); color:#fff;
  font-family:inherit; font-size:1rem; font-weight:700; box-shadow:0 8px 22px rgba(29,127,208,.32); cursor:pointer;
}
@media (min-width:560px){
  .opts{flex-direction:row; flex-wrap:wrap;}
  .opt{flex:1 1 calc(50% - 4px);}
}
</style>
</head>

<div class="ctrl" id="ctrl">

</div>

<div class="mask" id="mask">

    <button id="btnStart">点我开始</button>
  </div>
</div>

  function stopSay() { try { if (window.XNLYSay) XNLYSay.stop(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }

  /* ---------- 学习 ---------- */
  function sceneRange(i) {
    var a = -1, b = -1;
    for (var k = 0; k < Q.length; k++) {
      if (Q[k].sc === i) { if (a < 0) a = k; b = k; }
    }
    return [a, b];
  }

  function renderScene(i) {
    state.sc = i; state.k = -1; state.playing = false; state.paused = false;
    var s = SC[i];
    elNo.textContent = 'SCENE ' + (i + 1 < 10 ? '0' : '') + (i + 1);
    elTitle.textContent = s.t;
    elScNo.textContent = i + 1;
    elBadges.innerHTML = '';
    var add = function (cls, txt) {
      if (!txt) return;
      var d = document.createElement('span');
      d.className = 'bdg ' + cls; d.textContent = txt; elBadges.appendChild(d);
    };
    add('g', s.g);
    add('', s.fn);
    add('c', '核心：' + s.core);

    var rg = sceneRange(i), n = 0;
    elChat.innerHTML = '';
    for (var q = rg[0]; q <= rg[1]; q++) {
      var it = Q[q];
      var row = document.createElement('div');
      row.className = 'row ' + it.r + ' hidden';
      row.setAttribute('data-q', q);
      row.innerHTML = '<div class="av">' + it.r + '</div>' +
        '<div class="bub"><div class="en">' + esc(it.t) + '</div><div class="zh">' + esc(it.z) + '</div></div>';
      row.querySelector('.bub').addEventListener('click', function (ev) {
        var qq = +this.parentNode.getAttribute('data-q');
        stopSay(); say(Q[qq].s, { rate: 0.92 });
        highlight(qq);
      });
      elChat.appendChild(row);
      n++;
    }
    var pack = PATPACK[s.p] || [];
    if (pack.length) {
      elPatBox.hidden = false;
      elPatList.innerHTML = '';
      pack.forEach(function (p) {
        var li = document.createElement('li');
        li.innerHTML = '<span>' + esc(p.e) + '</span><i>' + esc(p.z) + '</i>';
        elPatList.appendChild(li);
      });
    } else { elPatBox.hidden = true; }

    btnNext.textContent = (i + 1 < SC.length) ? '下一个场景 →' : '重新开始 ↺';
    btnNext.disabled = false;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function rows() { return elChat.querySelectorAll('.row'); }

  function highlight(qIdx) {
    var rs = rows();
    for (var i = 0; i < rs.length; i++) {
      var on = (+rs[i].getAttribute('data-q') === qIdx);
      rs[i].classList.toggle('on', on);
      if (on) {
        rs[i].classList.remove('hidden', 'dim');
        try {
          var r = rs[i].getBoundingClientRect();
          var h = window.innerHeight || 600;
          if (r.bottom > h - 150 || r.top < 90) {
            window.scrollBy({ top: r.top - h * 0.42, behavior: 'smooth' });
          }
        } catch (e) {}
      }
      else if (!rs[i].classList.contains('hidden')) rs[i].classList.add('dim');
    }
  }

  function reveal(qIdx) {
    var rs = rows();
    for (var i = 0; i < rs.length; i++) {
      if (+rs[i].getAttribute('data-q') === qIdx) rs[i].classList.remove('hidden');
    }
  }

  function playFrom(k) {
    if (state.paused) return;
    state.k = k;
    var rg = sceneRange(state.sc);
    if (k > rg[1] - rg[0] + rg[0]) { finishScene(); return; }
    if (k > rg[1]) { finishScene(); return; }
    var it = Q[k];
    reveal(k); highlight(k);
    state.playing = true;
    say(it.s, {
      rate: 0.9,
      onend: function () {
        if (state.paused) return;
        var nxt = k + 1;
        if (nxt > rg[1]) { setTimeout(finishScene, 240); return; }
        setTimeout(function () { if (!state.paused) playFrom(nxt); }, 260);
      }
    });
  }

  function startScene() {
    var rg = sceneRange(state.sc);
    state.paused = false; btnPause.textContent = '⏸';
    playFrom(rg[0]);
  }

  function finishScene() {
    state.playing = false;
    state.done[state.sc] = 1;
    elDone.textContent = Object.keys(state.done).length;
    try { if (window.XNLY && XNLY.sound && XNLY.sound.ok) XNLY.sound.ok(); } catch (e) {}
    if (!state.auto) return;
    var nx = state.sc + 1;
    setTimeout(function () {
      if (state.mode !== 'learn' || !state.auto) return;
      if (nx < SC.length) { renderScene(nx); } else { renderScene(0); }
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
      startScene();
    }, 2200);
  }

  function goScene(d) {
    stopSay();
    var i = state.sc + d;
    if (i < 0) i = 0;
    if (i >= SC.length) i = SC.length - 1;
    renderScene(i); startScene();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  btnPause.addEventListener('click', function () {
    if (!state.playing) { startScene(); return; }
    state.paused = !state.paused;
    if (state.paused) { stopSay(); btnPause.textContent = '▶'; }
    else { btnPause.textContent = '⏸'; playFrom(state.k + 1 < 0 ? 0 : state.k); }
  });

  btnReplay.addEventListener('click', function () { stopSay(); startScene(); });
  btnNext.addEventListener('click', function () {
    if (state.sc + 1 >= SC.length) { renderScene(0); startScene(); return; }
    goScene(1);
  });

  window.replayCurrent = function () { stopSay(); startScene(); };
  window.XNLY_NEXT = function () { goScene(1); };

  /* ---------- 测试 ---------- */
  function shuffle(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }

  function buildTest(n) {
    n = n || 20;
    var ds = shuffle(EX.filter(function (x) { return x.k === 'd'; })).slice(0, Math.round(n * 0.4));
    var ws = shuffle(EX.filter(function (x) { return x.k === 'w'; })).slice(0, n - ds.length);
    var pool = shuffle(ds.concat(ws));
    state.qs = pool; state.qi = 0; state.right = 0; state.locked = false; state.testMode = 'run';
    renderQ();
  }

  function renderQ() {
    var it = state.qs[state.qi];
    if (!it) { renderResult(); return; }
    var head = '<div class="qhead"><span class="qtag ' + (it.k === 'w' ? 'w' : '') + '">' +
      (it.k === 'w' ? '选词填空' : '对话补全') + '</span>' +
      '<span class="qno">' + (state.qi + 1) + ' / ' + state.qs.length + '</span></div>' +
      '<div class="prog"><i style="width:' + Math.round(state.qi / state.qs.length * 100) + '%"></i></div>';

    var body = '';
    if (it.k === 'w') {
      body = '<div class="qcard"><div class="sent">' + it.html + '</div>' +
        '<div class="zh" style="font-size:.74rem;color:#7a8ba0;margin-top:8px">选一个词填进空位</div></div>';
    } else {
      var chat = '';
      it.chat.forEach(function (c) {
        if (c.blank) {
          chat += '<div class="row ' + c.r + '"><div class="av">' + c.r + '</div>' +
            '<div class="bub" style="border-style:dashed;border-color:#1d7fd0;background:#fff"><div class="en" style="color:#1d7fd0">？ 该说什么</div></div></div>';
        } else {
          chat += '<div class="row ' + c.r + '"><div class="av">' + c.r + '</div>' +
            '<div class="bub"><div class="en">' + esc(c.t) + '</div></div></div>';
        }
      });
      body = '<div class="qcard"><div class="chat" style="gap:8px">' + chat + '</div></div>';
    }

    var opts = '<div class="opts">';
    it.opts.forEach(function (o, i) {
      opts += '<button class="opt" data-i="' + i + '"><span class="k">' + 'ABCD'.charAt(i) + '</span><span>' + esc(o) + '</span></button>';
    });
    opts += '</div>';

    elQArea.innerHTML = '<div class="qwrap">' + head + body + opts +
      '<div class="fb" id="fb"></div>' +
      '<button class="cbtn main" id="btnQNext" style="width:100%;display:none">下一题 →</button></div>';

    var btns = elQArea.querySelectorAll('.opt');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { answer(this, +this.getAttribute('data-i')); });
    }
    $('btnQNext').addEventListener('click', nextQ);

    if (it.k === 'd' && it.say) { /* 对话题不朗读：答案就在选项里 */ }
  }

  function answer(btn, i) {
    if (state.locked) return;
    state.locked = true;
    var it = state.qs[state.qi];
    var all = elQArea.querySelectorAll('.opt');
    for (var k = 0; k < all.length; k++) all[k].disabled = true;
    var ok = (i === it.a);
    if (ok) {
      btn.classList.add('right'); state.right++;
      try { if (window.XNLY && XNLY.sound && XNLY.sound.ok) XNLY.sound.ok(); } catch (e) {}
    } else {
      btn.classList.add('wrong');
      for (var j = 0; j < all.length; j++) if (+all[j].getAttribute('data-i') === it.a) all[j].classList.add('right');
      try { if (window.XNLY && XNLY.sound && XNLY.sound.bad) XNLY.sound.bad(); } catch (e) {}
    }
    var fb = $('fb');
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '✓ 对了！' : '✗ 正确答案：' + esc(it.opts[it.a])) +
      (it.hint ? '<br><span style="opacity:.85">' + esc(it.hint) + '</span>' : '');
    if (it.k === 'w') say(it.say, { rate: 0.86 });

    if (ok) {
      setTimeout(nextQ, 900);
    } else {
      var b = $('btnQNext'); b.style.display = 'flex';
    }
  }

  function nextQ() {
    state.qi++; state.locked = false;
    if (state.qi >= state.qs.length) { renderResult(); return; }
    renderQ();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderResult() {
    var n = state.qs.length, r = state.right;
    var pct = n ? Math.round(r / n * 100) : 0;
    var face = pct >= 90 ? '🏆' : pct >= 80 ? '🎉' : pct >= 60 ? '💪' : '📚';
    var msg = pct >= 90 ? '太厉害了，句型掌握得很牢！' :
              pct >= 80 ? '过关！再练一轮更稳。' :
              pct >= 60 ? '大部分会了，错的地方回看对话。' : '先把对话再听两遍，再来一次。';
    elQArea.innerHTML = '<div class="big"><div style="font-size:2.6rem">' + face + '</div>' +
      '<div class="score">' + r + '<small> / ' + n + '</small></div>' +
      '<h2>' + msg + '</h2>' +
      '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center">' +
      '<button class="cbtn side" id="btnAgain" style="height:46px">再来一轮</button>' +
      '<button class="cbtn main" id="btnBackLearn" style="height:46px;flex:0 0 auto;padding:0 20px">回去学对话</button></div></div>';
    $('btnAgain').addEventListener('click', function () { buildTest(20); });
    $('btnBackLearn').addEventListener('click', function () { setMode('learn'); });
    if (pct >= 80) { try { if (window.XNLY && XNLY.sound && XNLY.sound.win) XNLY.sound.win(); } catch (e) {} }
  }

  /* ---------- 模式 ---------- */
  function setMode(m) {
    state.mode = m;
    elLearn.hidden = (m !== 'learn');
    elTest.hidden = (m !== 'test');
    tabLearn.classList.toggle('on', m === 'learn');
    tabTest.classList.toggle('on', m === 'test');
    $('ctrl').style.display = (m === 'learn') ? 'flex' : 'none';
    document.body.style.paddingBottom = (m === 'learn') ? '96px' : '24px';
    stopSay();
    if (m === 'test') { if (!state.qs.length || state.testMode === 'over') { state.testMode = 'run'; buildTest(20); } }
    else { renderScene(state.sc); startScene(); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  tabLearn.addEventListener('click', function () { setMode('learn'); });
  tabTest.addEventListener('click', function () { setMode('test'); state.testMode = 'run'; buildTest(20); });
  btnTest.addEventListener('click', function () { state.testMode = 'run'; setMode('test'); buildTest(20); });

  /* ---------- 启动 ---------- */
  $('btnStart').addEventListener('click', function () {
    $('mask').classList.add('hide');
    try { if (window.XNLYSay && XNLYSay.unlock) XNLYSay.unlock(); } catch (e) {}
    renderScene(0); startScene();
  });

  renderScene(0);
  elDone.textContent = '0';
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
  });
}
</script>
