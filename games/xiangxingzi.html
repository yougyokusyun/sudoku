<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🈶 象形字变变变 · 小脑袋乐园</title>
<style>
:root{--ink:#3a2f2a;--muted:#8a7a6e;--ok:#2fb344;--bad:#ff5c5c;--accent:#c2701e;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#fff4e3,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#fdf0d5,transparent 55%),
             linear-gradient(160deg,#fffdf7,#fbf3e4);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.chips{margin-left:auto;display:flex;gap:6px;}
.chip{background:#fff;border:1px solid rgba(58,47,42,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(58,47,42,.07);white-space:nowrap;}
.chip b{color:var(--accent);font-size:.86rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(58,47,42,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(58,47,42,.08);order:-1;}

.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:rgba(255,255,255,.8);border:2px solid rgba(58,47,42,.08);border-radius:22px;
  padding:10px;box-shadow:0 10px 24px rgba(58,47,42,.08);overflow:hidden;}
.prompt{font-size:.96rem;font-weight:800;text-align:center;color:#6e5a48;}

/* 古文字卡片 */
.glyphCard{background:#fffdf6;border:2px solid rgba(194,112,30,.25);border-radius:20px;
  padding:6px 22px;box-shadow:0 8px 18px rgba(194,112,30,.14);text-align:center;}
.glyphCard svg{width:clamp(120px,24vh,180px);height:clamp(120px,24vh,180px);display:block;
  color:#2f2a26;}
.glyphCard .cap{font-size:.66rem;font-weight:800;color:var(--muted);letter-spacing:.2em;}

/* 揭示后的演变条 */
.evo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  animation:pop .5s ease;}
.evo .box{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;
  border:2px solid rgba(58,47,42,.10);border-radius:16px;padding:8px 14px;min-width:86px;}
.evo .box .big{font-size:2.1rem;line-height:1.1;}
.evo .box .zi{font-size:2.4rem;font-weight:900;line-height:1.1;color:#c2701e;}
.evo .box .lb{font-size:.6rem;font-weight:800;color:var(--muted);}
.evo .arr{font-size:1.3rem;color:#c9a06a;font-weight:900;}

.riddle{font-size:clamp(.9rem,2.6vh,1.05rem);font-weight:800;text-align:center;color:#4a5f78;flex:none;
  line-height:1.45;min-height:1.4em;}
.riddle.dim{color:#a89a8c;}
.hintBtn{flex:none;min-height:40px;border:none;border-radius:14px;background:#fff3d9;color:#a06a00;
  font-weight:900;font-size:.86rem;padding:6px 18px;cursor:pointer;font-family:inherit;align-self:center;
  box-shadow:0 4px 12px rgba(160,106,0,.16);}
.hintBtn:disabled{opacity:.55;cursor:default;}

.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.opts.c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(92vw,440px);}
.opt{min-height:clamp(56px,12vh,76px);border-radius:18px;border:2px solid rgba(58,47,42,.10);background:#fff;
  font-size:clamp(1.6rem,5vh,2.3rem);font-weight:900;color:var(--ink);cursor:pointer;font-family:inherit;
  box-shadow:0 6px 14px rgba(58,47,42,.10);transition:transform .14s ease,border-color .18s ease,background .18s ease;}
.opt:active{transform:scale(.95);}
.opt.good{border-color:var(--ok);background:#e9fbee;animation:pop .45s ease;}
.opt.bad{border-color:var(--bad);background:#ffeded;animation:shake .45s ease;}
.opt.faded{opacity:.45;}

.feedback{min-height:26px;font-size:.94rem;font-weight:900;text-align:center;color:var(--muted);}
.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);animation:shake .45s ease;}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.btn{min-height:42px;padding:0 18px;border:2px solid rgba(58,47,42,.10);border-radius:999px;
  background:#fff;color:var(--ink);font-family:inherit;font-weight:800;font-size:.86rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(58,47,42,.10);}
.btn.primary{border-color:rgba(194,112,30,.5);color:#fff;background:linear-gradient(135deg,#e8a04c,#c2701e);}

.heart{position:absolute;z-index:98;pointer-events:none;font-size:1.5rem;animation:heartUp 1.1s ease-out forwards;}
@keyframes heartUp{0%{opacity:0;transform:translateY(10px) scale(.4);}25%{opacity:1;}
  100%{opacity:0;transform:translateY(-90px) scale(1.25) rotate(12deg);}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

@media (max-height:430px){
  body{padding:6px 10px;gap:5px;}
  h1{font-size:.95rem;}
  .chip{padding:2px 8px;font-size:.68rem;}
  .stage{gap:6px;padding:7px;border-radius:16px;flex-direction:row;flex-wrap:wrap;}
  .prompt{flex:1 0 100%;font-size:.8rem;}
  .glyphCard svg{width:72px;height:72px;}
  .glyphCard .cap{display:none;}
  .evo .box{padding:4px 10px;min-width:64px;}
  .evo .box .big,.evo .box .zi{font-size:1.5rem;}
  .evo .box .lb{font-size:.55rem;}
  .evo .arr{font-size:1rem;}
  .riddle{flex:1 0 100%;font-size:.8rem;min-height:0;}
  .hintBtn{flex:1 0 100%;min-height:32px;font-size:.76rem;}
  .opts{flex:1 0 100%;gap:6px;}
  .opt{min-height:44px;font-size:1.35rem;border-radius:12px;}
  .feedback{flex:1 0 100%;min-height:16px;font-size:.82rem;}
  .controls{flex:1 0 100%;}
  .btn{min-height:32px;font-size:.76rem;padding:0 12px;}
}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="../games/img/icon-180.png">
<link rel="icon" type="image/png" href="../games/img/icon-192.png"><script src="../voice.js"></script>
<script src="../sound.js"></script>
</head>
<body>
<header>
  <a class="back" href="../index.html">🏠 首页</a>
  <h1>🈶 象形字变变变</h1>
  <div class="chips">
    <span class="chip">🔥 连对 <b id="streak">0</b></span>
    <span class="chip">🏆 最佳 <b id="best">0</b></span>
  </div>
</header>

<div class="stage" id="stage">
  <div class="prompt" id="prompt">这是古人画的字，猜猜它是什么字？</div>
  <div id="showArea"></div>
  <div class="riddle dim" id="riddle">💡 点「提示」看看它像什么</div>
  <button class="hintBtn" id="hintBtn" type="button">💡 提示 · 看看它像什么</button>
  <div class="opts c3" id="opts"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="btn primary" id="next" type="button">🔄 换一个字</button>
  </div>
</div>

<script>
/* 象形字：古文字画法(SVG) + 现代字 + 实物图 + 线索 + 干扰项 */
var GLYPHS = [
  { ch:'日', emoji:'🌞', desc:'圆圆的太阳', wrong:['目','口'],
    svg:'<circle cx="50" cy="50" r="27"/><line x1="36" y1="50" x2="64" y2="50"/>' },
  { ch:'月', emoji:'🌙', desc:'弯弯的月亮', wrong:['日','门'],
    svg:'<path d="M60,12 A40,40 0 1,0 60,88 A31,31 0 1,1 60,12 Z" fill="#2f2a26" stroke="none"/>' },
  { ch:'山', emoji:'⛰️', desc:'高高的山峰', wrong:['火','木'],
    svg:'<path d="M14,78 L32,44 L45,66 L58,34 L72,66 L86,78"/><line x1="14" y1="78" x2="86" y2="78"/>' },
  { ch:'水', emoji:'💧', desc:'流动的水流', wrong:['雨','木'],
    svg:'<path d="M50,14 C40,32 60,50 50,70 C46,78 46,80 50,86"/><path d="M30,26 C24,36 36,42 28,52"/><path d="M70,26 C76,36 64,42 72,52"/>' },
  { ch:'火', emoji:'🔥', desc:'跳动的火苗', wrong:['山','人'],
    svg:'<path d="M50,16 C60,32 72,40 70,58 C68,76 58,84 50,84 C42,84 32,76 30,58 C28,40 40,32 50,16 Z"/><path d="M50,44 C55,54 54,64 50,70"/>' },
  { ch:'木', emoji:'🌳', desc:'一棵大树，上面是枝，下面是根', wrong:['水','山'],
    svg:'<line x1="50" y1="18" x2="50" y2="86"/><line x1="50" y1="40" x2="24" y2="24"/><line x1="50" y1="40" x2="76" y2="24"/><line x1="50" y1="68" x2="28" y2="84"/><line x1="50" y1="68" x2="72" y2="84"/>' },
  { ch:'人', emoji:'🚶', desc:'一个站着的人', wrong:['目','口'],
    svg:'<circle cx="52" cy="20" r="9"/><path d="M52,30 C48,44 40,54 30,64"/><path d="M50,36 C58,52 60,68 56,86"/>' },
  { ch:'目', emoji:'👁️', desc:'一只眼睛', wrong:['日','口'],
    svg:'<path d="M14,50 Q50,22 86,50 Q50,78 14,50 Z"/><circle cx="50" cy="50" r="8" fill="#2f2a26" stroke="none"/>' },
  { ch:'口', emoji:'👄', desc:'张开的嘴巴', wrong:['日','目'],
    svg:'<path d="M16,40 Q50,86 84,40 Q50,52 16,40 Z"/>' },
  { ch:'田', emoji:'🌾', desc:'方方正正的田地，种着庄稼', wrong:['日','口'],
    svg:'<rect x="20" y="20" width="60" height="60" rx="8"/><line x1="50" y1="20" x2="50" y2="80"/><line x1="20" y1="50" x2="80" y2="50"/>' },
  { ch:'雨', emoji:'🌧️', desc:'天上飘着云，落下雨点', wrong:['水','田'],
    svg:'<path d="M16,32 Q50,14 84,32"/><line x1="30" y1="44" x2="26" y2="56"/><line x1="46" y1="44" x2="42" y2="56"/><line x1="62" y1="44" x2="58" y2="56"/><line x1="76" y1="44" x2="72" y2="56"/>' },
  { ch:'鱼', emoji:'🐟', desc:'一条小鱼，右边摆着尾巴', wrong:['田','水'],
    svg:'<path d="M14,50 L34,38 L70,38 L84,50 L70,62 L34,62 Z"/><circle cx="28" cy="50" r="3" fill="#2f2a26" stroke="none"/>' }
];

var cur = null, options = [], hintShown = false, locked = false, timer = null;
var streak = 0, best = readNum('pxiang.best');

var elStage = document.getElementById('stage');
var elShow = document.getElementById('showArea');
var elRiddle = document.getElementById('riddle');
var elHint = document.getElementById('hintBtn');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elStreak = document.getElementById('streak');
var elBest = document.getElementById('best');

function readNum(k) { var v = parseInt(localStorage.getItem(k), 10); return isNaN(v) ? 0 : v; }
function writeNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }
function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function updateStats() { elStreak.textContent = streak; elBest.textContent = best; }
function feedback(t, cls) {
  elFb.className = 'feedback' + (cls ? ' ' + cls : '');
  elFb.textContent = t || '';
}
var canSpeak = typeof window.speechSynthesis !== 'undefined';
function say(text) {
  if (!canSpeak) return;
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.94; u.pitch = 1.1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { }
}
function glyphSVG(g, w) {
  return '<svg viewBox="0 0 100 100"' + (w ? ' style="width:' + w + 'px;height:' + w + 'px;"' : '') +
    ' fill="none" stroke="#2f2a26" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">' +
    g.svg + '</svg>';
}
function hearts() {
  for (var i = 0; i < 6; i++) {
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '✨';
    h.style.left = (20 + Math.random() * 60) + '%';
    h.style.top = (35 + Math.random() * 25) + '%';
    h.style.animationDelay = (Math.random() * .3) + 's';
    elStage.appendChild(h);
    setTimeout(function (el) { return function () { el.remove(); }; }(h), 1500);
  }
}

function newRound() {
  clearTimeout(timer);
  locked = false;
  hintShown = false;
  Array.prototype.forEach.call(elStage.querySelectorAll('.heart'), function (h) { h.remove(); });

  cur = GLYPHS[rand(GLYPHS.length)];
  options = shuffle([cur.ch].concat(cur.wrong));

  elShow.innerHTML = '<div class="glyphCard">' + glyphSVG(cur) + '<span class="cap">古 文 字</span></div>';
  elRiddle.textContent = '💡 点「提示」看看它像什么';
  elRiddle.classList.add('dim');
  elHint.disabled = false;
  elHint.textContent = '💡 提示 · 看看它像什么';

  elOpts.innerHTML = '';
  options.forEach(function (ch) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = ch;
    b.setAttribute('aria-label', ch);
    b.addEventListener('click', function () { tap(b, ch); });
    elOpts.appendChild(b);
  });

  feedback('');
  document.getElementById('prompt').textContent = '这是古人画的字，猜猜它是什么字？';
  say('猜猜这个古文字，是什么字？');
  window.__answer = cur.ch;
  window.__options = options;
}

function showHint(auto) {
  if (hintShown || !cur) return;
  hintShown = true;
  elRiddle.textContent = cur.emoji + ' ' + cur.desc;
  elRiddle.classList.remove('dim');
  elHint.disabled = true;
  elHint.textContent = '💡 线索在这里';
  if (!auto) say(cur.desc);
}

function tap(btn, ch) {
  if (locked) return;
  if (ch === cur.ch) {
    locked = true;
    btn.classList.add('good');
    Array.prototype.forEach.call(elOpts.children, function (b) {
      if (b !== btn) b.classList.add('faded');
    });
    /* 演变条：实物 → 古文字 → 现代字 */
    elShow.innerHTML =
      '<div class="evo">' +
        '<span class="box"><span class="big">' + cur.emoji + '</span><span class="lb">看到的</span></span>' +
        '<span class="arr">→</span>' +
        '<span class="box">' + glyphSVG(cur, 52) + '<span class="lb">古人画的</span></span>' +
        '<span class="arr">→</span>' +
        '<span class="box"><span class="zi">' + cur.ch + '</span><span class="lb">今天的字</span></span>' +
      '</div>';
    streak++;
    if (streak > best) { best = streak; writeNum('pxiang.best', best); }
    updateStats();
    feedback('✅ 对啦，就是「' + cur.ch + '」', 'ok');
    say('对啦，' + cur.ch + '，' + cur.desc + '的' + (cur.ch === '日' ? '日' : cur.ch));
    hearts();
    timer = setTimeout(newRound, 2200);
  } else {
    btn.classList.add('bad');
    setTimeout(function () { btn.classList.remove('bad'); }, 450);
    feedback('❌ 不是这个字，点「提示」看看它像什么', 'bad');
    say('不是这个字，看看提示吧');
    showHint(true);
  }
}

elHint.addEventListener('click', function () { showHint(false); feedback(''); });
document.getElementById('next').addEventListener('click', function () {
  streak = 0; updateStats(); newRound();
});

updateStats();
newRound();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('../sw.js').catch(function () { });
}
</script>
<script src="../homebtn.js"></script>
</body>
</html>
