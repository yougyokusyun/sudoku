<title>🔤 英语简单句型 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--ok:#2fb344;--bad:#ff5c5c;--accent:#0288d1;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 0% 0%,#e0f2ff,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#fff4e3,transparent 55%),
             linear-gradient(160deg,#f3faff,#fffaf3);
  min-height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px;user-select:none;}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:1.15rem;}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.10);color:var(--accent);font-weight:700;font-size:.8rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:#fff;border:1px solid rgba(36,59,83,.10);border-radius:999px;padding:4px 10px;
  font-size:.74rem;font-weight:700;color:var(--muted);box-shadow:0 3px 10px rgba(36,59,83,.07);white-space:nowrap;}
.chip b{color:#0288d1;font-size:.86rem;}
.chip.ttype{background:#fff3e6;border-color:rgba(240,138,60,.3);color:#c26a00;}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;
  background:rgba(255,255,255,.76);border:2px solid rgba(36,59,83,.08);border-radius:22px;padding:10px;
  box-shadow:0 10px 24px rgba(36,59,83,.08);overflow:hidden;}

.picks{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:none;}
.picks button{min-height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(36,59,83,.12);background:#fff;
  font-weight:700;font-size:.78rem;color:#4a6076;font-family:inherit;cursor:pointer;}
.picks button.on{background:#e3f2fd;border-color:rgba(2,136,209,.55);color:#0288d1;}

.bar{height:6px;border-radius:4px;background:rgba(36,59,83,.08);overflow:hidden;flex:none;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#0288d1,#7c5cff);border-radius:4px;transition:width .3s;}

.qprompt{flex:none;font-size:.95rem;color:#4a5f78;text-align:center;font-weight:800;}

/* 喇叭按钮 */
.speakbtn{align-self:center;min-width:64px;min-height:44px;border-radius:50%;border:3px solid rgba(2,136,209,.4);
  background:linear-gradient(160deg,#e3f2fd,#bbdefb);color:#0288d1;font-size:1.5rem;cursor:pointer;
  box-shadow:0 4px 14px rgba(2,136,209,.25);transition:transform .15s;}
.speakbtn:active{transform:scale(.92);}
.speakbtn.ring{animation:ring .8s ease;}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.15);background:#90caf9;}}

/* ===== 题型 1：听音选图 ===== */
.pickarea{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1 1 auto;min-height:0;}
.pickitem{min-height:clamp(70px,15vh,110px);border-radius:18px;border:2px solid rgba(36,59,83,.10);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:clamp(2.2rem,8vh,4rem);cursor:pointer;
  box-shadow:0 5px 12px rgba(36,59,83,.07);transition:transform .12s,border-color .18s,background .18s;}
.pickitem:active{transform:scale(.97);}
.pickitem.good{border-color:var(--ok);background:#e9fbee;animation:pop .35s;}
.pickitem.bad{border-color:var(--bad);background:#ffeded;animation:shake .35s;}

/* ===== 题型 2/3：排序（听音排序 + 看图说话） ===== */
.cnrow{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.15rem;font-weight:900;color:#31465c;}
.cnrow .cnemoji{font-size:2rem;line-height:1;}

.sentbox{flex:none;min-height:clamp(52px,12vh,80px);border-radius:18px;border:3px dashed rgba(2,136,209,.4);background:#f3faff;
  padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;}
.sentbox .wchip{min-height:40px;padding:6px 14px;border-radius:12px;background:#0288d1;color:#fff;
  font-weight:900;font-size:clamp(.86rem,2.2vh,1.05rem);display:flex;align-items:center;gap:4px;
  box-shadow:0 3px 8px rgba(2,136,209,.35);cursor:pointer;}
.sentbox .wchip small{font-size:.6rem;opacity:.75;}
.sentbox .blank{min-width:50px;border:2px dashed #90caf9;border-radius:12px;}
.sentbox.ok{border-color:var(--ok);background:#e9fbee;}

.poolbox{flex:1 1 auto;min-height:0;overflow-y:auto;border-radius:18px;border:2px solid rgba(36,59,83,.08);background:#fff;
  padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;}
.poolbox .wchip{min-height:40px;padding:6px 14px;border-radius:12px;background:#fff8f0;color:#c26a00;
  border:2px solid rgba(240,138,60,.3);font-weight:900;font-size:clamp(.86rem,2.2vh,1.05rem);cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.04);transition:transform .12s;}
.poolbox .wchip:active{transform:scale(.95);}
.poolbox .wchip.hidden{visibility:hidden;pointer-events:none;}

/* 已达最大句子长度，隐藏提示 */
.hintline{flex:none;font-size:.76rem;color:#9fb1c6;text-align:center;font-weight:700;}

/* 通用反馈 */
.qfb{min-height:22px;font-size:.95rem;font-weight:900;text-align:center;color:var(--muted);flex:none;}
.qfb.ok{color:var(--ok);} .qfb.bad{color:var(--bad);animation:shake .35s;}
.controls{display:flex;justify-content:center;gap:8px;flex:none;flex-wrap:wrap;}
.btn{min-height:40px;padding:0 18px;border-radius:999px;border:2px solid rgba(36,59,83,.12);background:#fff;
  font-weight:800;font-size:.86rem;color:var(--ink);cursor:pointer;font-family:inherit;}
.btn.on{background:var(--accent);color:#fff;border-color:transparent;}
.btn[disabled]{opacity:.5;cursor:default;}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}

@media (max-height:480px){
  .pickitem{min-height:54px;font-size:1.8rem}
  .wchip{min-height:34px;padding:4px 10px;font-size:.78rem}
  .sentbox{min-height:42px;padding:4px}
  .cnrow{font-size:.95rem}.cnrow .cnemoji{font-size:1.4rem}
}
</style>

/* 干扰 emoji 池（给听音选图用） */
var EMOJI_POOL = ['😀','😂','🥰','😎','🤓','🥳','😴','🤔','😱','🥺','🤗','😈','🦊','🐸','🐰','🐻','🐨','🦄','🐝','🦋','🐞','🦕','🌳','🌵','🌴','🍀','🌸','🌺','🍎','🍌','🍇','🥕','🌽','🍕','🍔','🍟','🥪','🌮','🍣','🍤','🍰','🧁','🍩','🍭','🎁','🎈','🎂','🏆','🎯','🎸','🎹','🎺','🏀','⚽','🏈','⚾','🎾','🏓','🎮','🎲','🚗','🚕','🚌','🚲','🚓','🚑','🚒','✈️','🚀','🚢','🏠','🏢','🏥','🏦','🏰','⛺','⛲','⛪','🌈','⭐','☁️','🔥','💧','❄️','⚡','💡','🔑','🔒','📱','💻','⌚','📷','🎥','📺','🔊','🎵','📚','✏️','🖊️','📐','📏','✂️','🧽','🧻','🧼','🧴','🧷','🧺','🧸','🪀','🪁','🎀','🎊','🎉'];

/* ============= DOM 引用 ============= */
var elPicks=document.getElementById('picks'), elBar=document.getElementById('bar'), elTtype=document.getElementById('ttype');
var elPrompt=document.getElementById('qprompt'), elSpeakBtn=document.getElementById('speakBtn');
var elPickarea=document.getElementById('pickarea'), elCnrow=document.getElementById('cnrow');
var elSentbox=document.getElementById('sentbox'), elHint=document.getElementById('hintline'), elPool=document.getElementById('poolbox');
var elFb=document.getElementById('qfb');
var btnNext=document.getElementById('btnNext');
var elStreak=document.getElementById('streak'), elBest=document.getElementById('best');

/* ============= 状态 ============= */
var state = {grade:0, quiz:[], idx:0, score:0, streak:0, best:+localStorage.getItem('en2.best')||0};
elBest.textContent = state.best;

/* ============= 工具函数 ============= */
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function speak(txt){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(txt); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }
/* 把句子拆成单词："Hello, I'm fine." → ["Hello","I'm","fine"] */
function sentenceToWords(s){
  return s.replace(/['"]/g,' ').replace(/[.,!?;:]/g,'').split(/\s+/).filter(function(w){return w.length;});
}

/* ============= 年级选择 ============= */
function buildPicks(){
  var groups=[{n:'🎲 混合全部',qs:[]}];
  GRADES.forEach(function(u){ groups[0].qs=groups[0].qs.concat(u.qs); groups.push(u); });
  groups.forEach(function(g,idx){
    var b=document.createElement('button');b.type='button';b.textContent=g.n;
    if(idx===0) b.classList.add('on');
    b.addEventListener('click',function(){ elPicks.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); state.grade=idx; buildQuiz();});
    elPicks.appendChild(b);
  });
  return groups;
}
var GROUPS = buildPicks();

/* ============= 三种题型生成 ============= */
function mkListenPick(q){
  var distract = shuffle(EMOJI_POOL.filter(function(x){return x!==q.emoji;})).slice(0,3);
  var opts = shuffle([q.emoji].concat(distract));
  return {type:'pick', q:q, opts:opts, ans:q.emoji};
}
function mkListenOrder(q){
  var words = sentenceToWords(q.ans);
  var distract = shuffle(['the','a','I','you','and','or','to','is','are','my','your','of','in','on','at','it','we','they']).slice(0, Math.min(3, words.length));
  var pool = shuffle(words.concat(distract));
  return {type:'order', q:q, words:words, pool:pool, chosen:[]};
}
function mkLookSay(q){
  var words = sentenceToWords(q.ans);
  var distract = shuffle(['the','a','I','you','and','or','to','is','are','my','your','of','in','on','at','it','we','they','can','not','very','with','for']).slice(0, Math.min(3, words.length));
  var pool = shuffle(words.concat(distract));
  return {type:'look', q:q, words:words, pool:pool, chosen:[]};
}

/* ============= 构建一轮 ============= */
var gradeDecks = {};
function gradeDeckFor() {
  var key = 'english.g' + state.grade;
  if (!gradeDecks[key]) {
    gradeDecks[key] = XNLY.deck.make(GROUPS[state.grade].qs, key, {
      head: 5, id: function (q, i) { return 'q' + i; }
    });
  }
  return gradeDecks[key];
}
function buildQuiz(){
  var n = GROUPS[state.grade].qs.length;
  var pool = [];
  for (var qi = 0; qi < n; qi++) pool.push(gradeDeckFor().next());
  state.quiz = pool.map(function(q,idx){
    var t = idx % 3;
    if(t===0) return mkListenPick(q);
    if(t===1) return mkListenOrder(q);
    return mkLookSay(q);
  });
  state.idx=0; state.score=0; state.streak=0;
  updateStats(); btnNext.disabled=true; btnNext.textContent='下一题 →';
  renderQ();
}
function updateStats(){ elStreak.textContent=state.streak; elBest.textContent=state.best; }

/* ============= 题型标签 ============= */
var TTYPE_LABEL = {pick:'🎧 听音选图', order:'🎧 听音排序', look:'👀 看图说话'};

/* ============= 渲染 ============= */
function hideAll(){
  elPickarea.style.display='none'; elPickarea.innerHTML='';
  elCnrow.style.display='none'; elCnrow.innerHTML='';
  elSentbox.style.display='none'; elSentbox.innerHTML='';
  elPool.style.display='none'; elPool.innerHTML='';
  elHint.style.display='none';
}

function renderQ(){
  hideAll();
  if(state.idx>=state.quiz.length){
    elPrompt.textContent='🎉 完成！答对 '+state.score+' / '+state.quiz.length+' 题';
    elTtype.textContent='🏆 闯关结束'; elSpeakBtn.style.display='none';
    btnNext.disabled=false; btnNext.textContent='🔄 再来一轮'; return;
  }
  var item = state.quiz[state.idx];
  var n = state.quiz.length;
  elBar.style.width = Math.round(state.idx/n*100)+'%';
  elFb.textContent=''; elFb.className='qfb';
  elTtype.textContent = TTYPE_LABEL[item.type];
  btnNext.disabled = true;
  btnNext.textContent = (state.idx+1)>=n ? '🎊 看结果' : '下一题 →';

  if(item.type==='pick') return renderPick(item);
  if(item.type==='order') return renderOrder(item);
  renderLook(item);
}

/* ---------- 听音选图 ---------- */
function renderPick(item){
  elSpeakBtn.style.display='inline-flex'; elSpeakBtn.onclick=function(){ speak(item.q.ans); elSpeakBtn.classList.remove('ring'); void elSpeakBtn.offsetWidth; elSpeakBtn.classList.add('ring'); };
  elPrompt.textContent = '点 🔊 听句子 → 选一个符合的表情';
  elPickarea.style.display='grid';
  elPickarea.innerHTML='';
  item.opts.forEach(function(e){
    var d = document.createElement('div'); d.className='pickitem'; d.textContent=e;
    d.addEventListener('click',function(){ clickPick(d, item, e); });
    elPickarea.appendChild(d);
  });
  // 自动播放一次
  setTimeout(function(){ speak(item.q.ans); elSpeakBtn.classList.add('ring'); }, 300);
}
function clickPick(btn, item, e){
  if(btn.classList.contains('good')||btn.classList.contains('bad')) return;
  if(e===item.ans){
    btn.classList.add('good');
    Array.prototype.forEach.call(elPickarea.children,function(b){ b.classList.add('good'); if(b.textContent!==item.ans){b.style.opacity='.3';}});
    elFb.textContent='✅ 对啦！这句是 "'+item.q.ans+'"'; elFb.className='qfb ok';
    state.score++; state.streak++;
    if(state.streak>state.best){state.best=state.streak;localStorage.setItem('en2.best',state.best);}
    btnNext.disabled=false; updateStats();
    setTimeout(function(){ if(!btnNext.disabled){state.idx++; renderQ();}}, 5000);
  } else {
    btn.classList.add('bad'); elFb.textContent='❌ 再听一次试试'; elFb.className='qfb bad';
    setTimeout(function(){ speak(item.q.ans); }, 380);
  }
}

/* ---------- 听音排序 ---------- */
function renderOrder(item){
  elSpeakBtn.style.display='inline-flex'; elSpeakBtn.onclick=function(){ speak(item.q.ans); elSpeakBtn.classList.remove('ring'); void elSpeakBtn.offsetWidth; elSpeakBtn.classList.add('ring'); };
  elPrompt.textContent = '点 🔊 听句子 → 按顺序点单词卡拼成句子';
  elSentbox.style.display='flex'; elPool.style.display='flex'; elHint.style.display='block';
  elSentbox.innerHTML='';
  renderPool(item);
  item.chosen.forEach(function(w,i){
    var c=document.createElement('span'); c.className='wchip'; c.textContent=w; c.dataset.idx=i;
    c.addEventListener('click',function(){ putBack(item, i); });
    elSentbox.appendChild(c);
  });
  setTimeout(function(){ speak(item.q.ans); elSpeakBtn.classList.add('ring'); }, 300);
}

/* ---------- 看图说话 ---------- */
function renderLook(item){
  elSpeakBtn.style.display='inline-flex'; elSpeakBtn.onclick=function(){ speak(item.q.ans); elSpeakBtn.classList.remove('ring'); void elSpeakBtn.offsetWidth; elSpeakBtn.classList.add('ring'); };
  elSpeakBtn.style.display='inline-flex'; /* 也可以听，但主要看图 */
  elPrompt.textContent = '看图 / 看中文 → 按顺序点单词卡拼成英文句子';
  elCnrow.style.display='flex';
  elCnrow.innerHTML = '<span class="cnemoji">'+item.q.emoji+'</span><span>'+item.q.cn+'</span>';
  elSentbox.style.display='flex'; elPool.style.display='flex'; elHint.style.display='block';
  elSentbox.innerHTML='';
  renderPool(item);
  item.chosen.forEach(function(w,i){
    var c=document.createElement('span'); c.className='wchip'; c.textContent=w; c.dataset.idx=i;
    c.addEventListener('click',function(){ putBack(item, i); });
    elSentbox.appendChild(c);
  });
}

/* ---------- 排序/看图通用：渲染单词池 ---------- */
function renderPool(item){
  elPool.innerHTML='';
  item.pool.forEach(function(w,i){
    var c=document.createElement('span'); c.className='wchip'; c.textContent=w; c.dataset.pool=i;
    if(item.chosen.indexOf(w)>=0) c.classList.add('hidden');
    c.addEventListener('click',function(){ pickWord(item, w, i, c); });
    elPool.appendChild(c);
  });
}
function pickWord(item, w, poolIdx, poolChip){
  if(poolChip.classList.contains('hidden')) return;
  item.chosen.push(w);
  poolChip.classList.add('hidden');
  var c=document.createElement('span'); c.className='wchip'; c.textContent=w;
  c.addEventListener('click',function(){ putBack(item, item.chosen.length-1); });
  elSentbox.appendChild(c);
  tryValidateOrder(item);
}
function putBack(item, chosenIdx){
  if(state.quiz[state.idx].done) return;
  var w = item.chosen[chosenIdx];
  item.chosen.splice(chosenIdx,1);
  // 从 sentbox 移除最后一个 chip 并重建（保持顺序）
  elSentbox.innerHTML='';
  renderPool(item);
  item.chosen.forEach(function(x){
    var c=document.createElement('span'); c.className='wchip'; c.textContent=x;
    c.addEventListener('click',function(){ var idx=item.chosen.indexOf(x); if(idx>=0) putBack(item, idx); });
    elSentbox.appendChild(c);
  });
  // 恢复 pool 中所有 hidden（重新渲染时会正确）
  renderPool(item);
  elSentbox.classList.remove('ok');
  elFb.textContent=''; elFb.className='qfb';
}
function tryValidateOrder(item){
  var chosen = item.chosen;
  var ans = item.words;
  if(chosen.length<ans.length) return; /* 还没选完 */
  if(chosen.length>ans.length){ /* 多了干扰词 */
    elFb.textContent='❌ 多了单词，点一下句子里的词可以移回去'; elFb.className='qfb bad';
    return;
  }
  var match = chosen.every(function(w,i){return w===ans[i];});
  if(match){
    state.quiz[state.idx].done = true;
    elSentbox.classList.add('ok');
    elFb.textContent='✅ 完美！"'+item.q.ans+'"'; elFb.className='qfb ok';
    item.pool.forEach(function(){ /* 禁用全部 pool chip */});
    Array.prototype.forEach.call(elPool.children,function(c){c.style.pointerEvents='none';c.style.opacity='.4';});
    state.score++; state.streak++;
    if(state.streak>state.best){state.best=state.streak;localStorage.setItem('en2.best',state.best);}
    btnNext.disabled=false; updateStats();
    speak(item.q.ans);
    setTimeout(function(){ if(!btnNext.disabled){state.idx++; renderQ();}}, 5000);
  } else {
    elFb.textContent='❌ 顺序不对，继续调整～'; elFb.className='qfb bad';
  }
}

/* ============= 绑定 ============= */
btnNext.addEventListener('click', function(){
  if(btnNext.disabled) return;
  if(state.idx>=state.quiz.length){ buildQuiz(); return; }
  state.idx++;
  renderQ();
});

/* 首题直接可见：进入即生成一轮 */
buildQuiz();

/* iOS/平板音频解锁：首次任意点击补读当前题 */
var firstTapDone=false;
document.addEventListener('pointerdown', function(){
  if(firstTapDone) return;
  firstTapDone=true;
  if(window.XNLY&&XNLY.voice&&XNLY.voice.unlock){try{XNLY.voice.unlock();}catch(e){}}
  if(elSpeakBtn.style.display!=='none'&&elSpeakBtn.onclick){ try{ elSpeakBtn.onclick(); }catch(e){} }
}, {passive:true});
