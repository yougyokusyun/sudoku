var GRADES = [3, 4, 5, 6];
var state = { grade: 3, si: -1, step: 0, locked: false, timer: null, scene: null, opts: [] };
var completed = loadDone();

var elGradeBar = document.getElementById('gradeBar');
var elList = document.getElementById('listView');
var elScenes = document.getElementById('sceneList');
var elPlay = document.getElementById('playView');
var elTitle = document.getElementById('playTitle');
var elNpc = document.getElementById('npcLine');
var elCn = document.getElementById('cnLine');
var elOpts = document.getElementById('opts');
var elFb = document.getElementById('feedback');
var elSummary = document.getElementById('summary');
var elDone = document.getElementById('doneChip');
var elSceneChip = document.getElementById('sceneChip');

function rand(n) { return Math.floor(Math.random() * n); }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function say(t, o) { if (window.XNLY && XNLY.voice) { try { XNLY.voice.speak(t, o || {}); } catch (e) { } } }
function sfx(n) { if (window.XNLY && XNLY.sound && XNLY.sound[n]) { try { XNLY.sound[n](); } catch (e) { } } }
function mark(k) { if (window.XNLY && XNLY.mark) { try { XNLY.mark(k); } catch (e) { } } }

function loadDone() {
  try {
    var v = JSON.parse(localStorage.getItem('xnly.dlg.done') || '[]');
    return Array.isArray(v) ? v.filter(function (x) { return typeof x === 'number'; }) : [];
  } catch (e) { return []; }
}
function saveDone() {
  try { localStorage.setItem('xnly.dlg.done', JSON.stringify(completed)); } catch (e) { }
}
function isDone(i) { return completed.indexOf(i) >= 0; }

function scenesOf(g) {
  var out = [];
  S.forEach(function (s, i) { if (s[0] === g) out.push({ i: i, s: s }); });
  return out;
}

function renderGradeBar() {
  elGradeBar.innerHTML = '';
  GRADES.forEach(function (g) {
    var n = scenesOf(g).length;
    var dn = scenesOf(g).filter(function (x) { return isDone(x.i); }).length;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tchip' + (g === state.grade ? ' on' : '');
    b.textContent = g + ' 年级 · ' + dn + '/' + n;
    b.addEventListener('click', function () {
      state.grade = g;
      renderList();
      say(g + ' 年级的情景对话。');
    });
    elGradeBar.appendChild(b);
  });
  elDone.textContent = String(completed.length);
}

function renderList() {
  clearTimeout(state.timer);
  state.si = -1; state.locked = false;
  elPlay.hidden = true;
  elList.hidden = false;
  elSceneChip.textContent = String(scenesOf(state.grade).length);
  renderGradeBar();
  elScenes.innerHTML = '';
  scenesOf(state.grade).forEach(function (x) {
    var s = x.s;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'scene' + (isDone(x.i) ? ' done' : '');
    b.innerHTML = '<span class="em">' + s[2] + '</span><span class="meta"><span class="nm">' + s[1] +
      '</span><span class="st">' + s[3].length + ' 步 · 选对往下走</span></span>' +
      '<span class="tick">' + (isDone(x.i) ? '✓' : '') + '</span>';
    b.addEventListener('click', function () { playScene(x.i); });
    elScenes.appendChild(b);
  });
}

function playScene(i) {
  clearTimeout(state.timer);
  state.si = i;
  state.step = 0;
  state.scene = S[i];
  state.locked = false;
  elList.hidden = true;
  elPlay.hidden = false;
  elSummary.classList.remove('show');
  elSummary.innerHTML = '';
  elFb.className = 'feedback'; elFb.textContent = '';
  renderStep();
}

function renderStep() {
  clearTimeout(state.timer);
  state.locked = false;
  var sc = state.scene, st = sc[3][state.step];
  elTitle.innerHTML = sc[2] + ' ' + sc[1] + '<span>第 ' + (state.step + 1) + ' / ' + sc[3].length + ' 步</span>';
  elNpc.textContent = st[0];
  elCn.textContent = st[1];
  var wrong = st[3].split('|');
  var opts = shuffle([{ t: st[2], ok: true }, { t: wrong[0], ok: false }, { t: wrong[1], ok: false }]);
  state.opts = opts;
  elOpts.innerHTML = '';
  opts.forEach(function (o, k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.textContent = o.t;
    b.addEventListener('click', function () { choose(k, b); });
    elOpts.appendChild(b);
  });
  elFb.className = 'feedback'; elFb.textContent = '';
  say(st[0], { lang: 'en-US' });
  say(st[1], { queue: true });
}

function choose(k, btn) {
  if (state.locked || state.si < 0) return;
  var st = state.scene[3][state.step];
  var o = state.opts[k];
  if (o.ok) {
    state.locked = true;
    btn.classList.add('good');
    mark('right'); sfx('correct');
    elFb.className = 'feedback ok';
    elFb.innerHTML = '✅ 回应得对！<small>' + st[4] + '</small>';
    Array.prototype.forEach.call(elOpts.children, function (b) { b.disabled = true; });
    state.timer = setTimeout(function () {
      state.step++;
      if (state.step >= state.scene[3].length) finishScene(); else renderStep();
    }, 1100);
  } else {
    mark('wrong'); sfx('wrong');
    btn.classList.add('bad', 'shake');
    elFb.className = 'feedback bad';
    elFb.innerHTML = '❌ ' + st[4] + '<small>再选一次，剧情还在这里等你</small>';
    setTimeout(function () { btn.classList.remove('shake'); }, 500);
  }
}

function finishScene() {
  clearTimeout(state.timer);
  state.locked = true;
  if (!isDone(state.si)) { completed.push(state.si); saveDone(); }
  renderGradeBar();
  elOpts.innerHTML = '';
  elFb.className = 'feedback'; elFb.textContent = '';
  elNpc.textContent = '🎉 剧情完成！';
  elCn.textContent = '这个场景的对话你都演对了，可以去场景列表挑下一个。';
  elTitle.innerHTML = state.scene[2] + ' ' + state.scene[1] + '<span>剧情完成</span>';
  elSummary.innerHTML = '<div class="sumtitle">🎉 剧情完成</div>' +
    '<div class="sumline">' + state.scene[1] + ' · 共 ' + state.scene[3].length + ' 步，全部走完</div>' +
    '<div class="sumline" style="font-size:.78rem;color:#7b8ea8">已完成场景 ' + completed.length + '/100，可以随时回来重演</div>' +
    '<button class="again" id="againBtn" type="button">🔄 再演一遍</button>' +
    '<button class="mini" id="nextBtn" type="button">换一个场景 →</button>';
  elSummary.classList.add('show');
  sfx('win');
  say('剧情完成，真棒！');
  document.getElementById('againBtn').addEventListener('click', function () { playScene(state.si); });
  document.getElementById('nextBtn').addEventListener('click', renderList);
}

document.getElementById('backBtn').addEventListener('click', renderList);
/* 页内「再听一遍」已隐藏，重听走右上角工具条的 🔊 */
function replayLine() {
  if (state.si < 0) return;
  var st = state.scene[3][state.step];
  if (!st) return;
  say(st[0], { lang: 'en-US' });
  say(st[1], { queue: true });
}
window.replayCurrent = replayLine;
document.getElementById('replayBtn').addEventListener('click', replayLine);

var firstTap = false;
document.addEventListener('pointerdown', function () {
  if (firstTap) return;
  firstTap = true;
  if (window.XNLY && XNLY.voice && XNLY.voice.unlock) { try { XNLY.voice.unlock(); } catch (e) { } }
  if (window.XNLY && XNLY.sound && XNLY.sound.unlock) { try { XNLY.sound.unlock(); } catch (e) { } }
  if (state.si < 0) say('选一个场景，点进去一步一步演一演。选错了也没关系，会有中文提示。');
}, { passive: true });

renderList();

/* 顶栏「下一题」：换到下一段对话，不判完成、不加统计、不清空已完成记录 */
function skipDialogue() {
  clearTimeout(state.timer);
  state.locked = false;
  var list = scenesOf(state.grade);
  if (!list.length) return;
  var next = list[0].i;
  if (state.si >= 0) {
    var at = -1;
    for (var i = 0; i < list.length; i++) { if (list[i].i === state.si) { at = i; break; } }
    next = list[(at + 1) % list.length].i;
  }
  elSummary.classList.remove('show');
  elSummary.innerHTML = '';
  playScene(next);
}
window.XNLY_NEXT = skipDialogue;

window.DG = { S: S, get state() { return state; }, scenesOf: scenesOf, playScene: playScene,
  choose: choose, finishScene: finishScene, completed: completed };
</script>
