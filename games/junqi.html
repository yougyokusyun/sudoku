<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🚩 军棋 · 翻开版 · 小脑袋乐园</title>
<style>
:root{--ink:#243b53;--muted:#6b7f95;--accent:#2f5bd6;--red:#cf3b3b;--blue:#2f5bd6;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;color:var(--ink);
  height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;overflow:hidden;user-select:none;
  background:radial-gradient(900px 520px at 0% 0%,#eef2ff,transparent 62%),
             radial-gradient(900px 520px at 100% 0%,#fff1f1,transparent 58%),
             linear-gradient(160deg,#fbfaff,#fff8f8);}
header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
h1{font-size:1.08rem;white-space:nowrap;}
.back{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(36,59,83,.1);color:var(--accent);font-weight:800;font-size:.76rem;
  text-decoration:none;box-shadow:0 4px 12px rgba(36,59,83,.08);order:-1;}
.spacer{flex:1;}
.seg{display:flex;gap:3px;padding:3px;border-radius:999px;background:#fff;
  border:1px solid rgba(36,59,83,.09);box-shadow:0 4px 12px rgba(36,59,83,.07);}
.seg button{border:0;background:none;font-family:inherit;font-weight:800;font-size:.74rem;color:var(--muted);
  padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.seg button.on{background:linear-gradient(135deg,#4f7cf0,#2f5bd6);color:#fff;box-shadow:0 3px 9px rgba(47,91,214,.32);}
.iconbtn{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(36,59,83,.1);background:#fff;
  color:var(--ink);font-family:inherit;font-weight:800;font-size:.76rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(36,59,83,.08);white-space:nowrap;}
.iconbtn:active{transform:scale(.96);}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;
  background:rgba(255,255,255,.72);border:2px solid rgba(36,59,83,.07);border-radius:20px;padding:6px 8px 4px;
  box-shadow:0 10px 26px rgba(36,59,83,.09);}
.hud{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;min-height:26px;}
.turn{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:800;color:#43586f;}
.dot{width:14px;height:14px;border-radius:50%;background:#a4b3c6;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.16);}
.dot.r{background:radial-gradient(circle at 32% 28%,#ff8a80,#c62828 72%);}
.dot.b{background:radial-gradient(circle at 32% 28%,#8fb0ff,#2f5bd6 72%);}
.chip{font-size:.68rem;font-weight:800;color:var(--muted);background:#fff;border:1px solid rgba(36,59,83,.08);
  border-radius:999px;padding:4px 9px;box-shadow:0 3px 9px rgba(36,59,83,.06);white-space:nowrap;}
.chip b.r{color:var(--red);}
.chip b.b{color:var(--blue);}

.boardWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;}
.board{position:relative;border-radius:14px;border:3px solid #cdb489;
  background:linear-gradient(165deg,#fdf7e6,#f6ead0);
  box-shadow:0 10px 24px rgba(120,95,45,.18),inset 0 0 0 2px rgba(255,255,255,.7);}
.lines{position:absolute;left:0;top:0;pointer-events:none;}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:calc(var(--cw) * .15);border:1.4px solid rgba(150,125,80,.26);
  background:rgba(255,255,255,.42);cursor:pointer;font-weight:900;line-height:1;
  transition:transform .08s ease;overflow:hidden;font-family:inherit;color:#4a3b25;}
.cell:active{transform:scale(.96);}
.cell.empty{cursor:default;background:transparent;border-style:dashed;border-color:rgba(160,135,90,.28);}
.cell.camp{border-style:dashed;border-color:rgba(196,140,40,.62);
  background:rgba(255,235,175,.55);border-radius:calc(var(--cw) * .3);}
.cell.camp .clab{font-size:calc(var(--ch) * .19);font-weight:800;color:rgba(160,120,50,.82);letter-spacing:.04em;}
.cell.hidden{background:linear-gradient(150deg,#5c7099,#33486b);border-color:rgba(25,40,65,.55);
  color:#eaf1ff;box-shadow:0 2px 6px rgba(30,45,75,.22);}
.cell.hidden .bk{font-size:calc(var(--cw) * .38);opacity:.92;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.cell.red{background:linear-gradient(150deg,#fff8f7,#ffe3e0);border-color:rgba(207,59,59,.62);}
.cell.blue{background:linear-gradient(150deg,#f7f9ff,#dfe9ff);border-color:rgba(47,91,214,.62);}
.cell.red .nm{color:#c22d2d;}
.cell.blue .nm{color:#2246b8;}
.cell .nm{font-size:var(--fs);letter-spacing:.02em;}
.cell.safe{box-shadow:0 0 0 2px rgba(230,170,50,.5),0 2px 6px rgba(140,110,50,.18);}
.cell.sel{outline:3px solid #ffb020;outline-offset:1px;z-index:5;transform:translateY(-1px);}
.cell.tgt::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:32%;height:32%;border-radius:50%;background:rgba(40,160,90,.85);box-shadow:0 1px 4px rgba(0,0,0,.2);}
.cell.tgt.cap{background:linear-gradient(150deg,#fff3f1,#ffdcd6);}
.cell.tgt.cap::after{background:rgba(214,60,60,.85);}
.cell.last{box-shadow:0 0 0 2px rgba(80,140,255,.6),0 3px 8px rgba(47,91,214,.22);}

.foot{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  font-size:.68rem;color:#8d9cb0;min-height:18px;text-align:center;line-height:1.3;}
.foot b{color:#2f5bd6;}

.toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%) translateY(6px);z-index:30;
  background:rgba(36,59,83,.93);color:#fff;font-size:.78rem;font-weight:800;
  padding:8px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:all .2s ease;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:20;
  background:rgba(255,255,255,.97);border:2px solid rgba(47,91,214,.3);border-radius:22px;
  padding:18px 26px;box-shadow:0 18px 46px rgba(36,59,83,.24);text-align:center;
  opacity:0;pointer-events:none;transition:all .22s ease;}
.banner.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.banner .big{font-size:1.3rem;font-weight:900;margin-bottom:6px;}
.banner .sm{font-size:.8rem;color:var(--muted);margin-bottom:14px;}
.banner button{min-height:40px;padding:0 22px;border:0;border-radius:999px;
  background:linear-gradient(135deg,#4f7cf0,#2f5bd6);color:#fff;font-family:inherit;font-weight:800;
  font-size:.86rem;cursor:pointer;box-shadow:0 6px 16px rgba(47,91,214,.32);}

@media (max-width:430px){
  header{gap:5px;}
  h1{font-size:.93rem;}
  .back,.iconbtn{min-height:31px;padding:0 9px;font-size:.69rem;}
  .seg button{padding:6px 9px;font-size:.69rem;}
  .chip{font-size:.62rem;padding:3px 7px;}
  .turn{font-size:.76rem;}
  .foot{font-size:.62rem;}
  #undoBtn{margin-left:auto;}
}
@media (max-height:600px){
  body{padding:5px 8px 6px;gap:4px;}
  h1{font-size:.92rem;}
  .back,.iconbtn{min-height:30px;font-size:.69rem;}
  .seg button{padding:5px 9px;font-size:.69rem;}
  .stage{padding:4px 6px 2px;border-radius:14px;}
  .hud{min-height:22px;}
  .foot{font-size:.62rem;}
}
</style>

<body>
<header>
  <a class="back" href="../index.html">🏠 首页</a>
  <h1>🚩 军棋 · 翻开版</h1>
  <div class="spacer"></div>
  <div class="seg" id="seg">
    <button type="button" data-mode="pve" class="on">🤖 人机</button>
    <button type="button" data-mode="pvp">👥 双人</button>
  </div>
  <button class="iconbtn" id="undoBtn" type="button">↩ 悔棋</button>
  <button class="iconbtn" id="restartBtn" type="button">🔄 新局</button>
</header>

<div class="stage">
  <div class="hud">
    <span class="turn"><span class="dot" id="turnDot"></span><span id="turnText">轮流翻牌定阵营</span></span>
    <span class="chip" id="campChip">阵营未定</span>
    <span class="chip" id="mineChip">已挖 <b class="r">0</b>/3 · <b class="b">0</b>/3</span>
  </div>
  <div class="boardWrap" id="boardWrap">
    <div class="board" id="board"><svg class="lines" id="lines"></svg></div>
  </div>
  <div class="foot">公路 1 格 · 铁路工兵任意走、其他直走 · 行营安全 · 挖完 3 雷夺旗</div>
</div>

<div class="toast" id="toast"></div>

<div class="banner" id="banner">
  <div class="big" id="bannerTitle">🎉 获胜</div>
  <div class="sm" id="bannerSub">再来一局试试？</div>
  <button type="button" id="bannerBtn">🔄 再来一局</button>
</div>

<script>
/* ============ 军棋 · 纸质翻开版（5 列 × 12 行经典棋盘） ============ */
var COLS = 5, ROWS = 12, TOTAL = COLS * ROWS;
var RED = 0, BLUE = 1;

var CAMP_IDX = {};
[[2, 1], [2, 3], [3, 0], [3, 2], [3, 4], [8, 1], [8, 3], [9, 0], [9, 2], [9, 4]]
  .forEach(function (p) { CAMP_IDX[p[0] * COLS + p[1]] = true; });

var RAIL_ROW = { 1: 1, 5: 1, 6: 1, 10: 1 };

var RANK_DEFS = [
  { name: '司令', rank: 9, count: 1 },
  { name: '军长', rank: 8, count: 1 },
  { name: '师长', rank: 7, count: 2 },
  { name: '旅长', rank: 6, count: 2 },
  { name: '团长', rank: 5, count: 2 },
  { name: '营长', rank: 4, count: 2 },
  { name: '连长', rank: 3, count: 3 },
  { name: '排长', rank: 2, count: 3 },
  { name: '工兵', rank: 1, count: 3 },
  { name: '地雷', rank: 0, count: 3 },
  { name: '炸弹', rank: 0, count: 2 },
  { name: '军旗', rank: 0, count: 1 }
];

var mode = 'pve';
var state = null;
var selected = -1;
var targets = [];
var lastAction = null;
var moveHistory = [];
var thinking = false;
var aiToken = 0;
var CW = 60, CH = 46, GAP = 8;

/* ---------- 基础工具 ---------- */
function ix(r, c) { return r * COLS + c; }
function rowOf(i) { return Math.floor(i / COLS); }
function colOf(i) { return i % COLS; }
function isCamp(i) { return !!CAMP_IDX[i]; }
function isRailRow(r) { return !!RAIL_ROW[r]; }
function colorName(c) { return c === RED ? '红' : '蓝'; }
function playerName(p) {
  if (mode === 'pve') return p === 0 ? '你' : '电脑';
  return p === 0 ? '玩家一' : '玩家二';
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function neighbors(i) {
  var r = rowOf(i), c = colOf(i), out = [];
  if (r > 0) out.push(ix(r - 1, c));
  if (r < ROWS - 1) out.push(ix(r + 1, c));
  if (c > 0) out.push(ix(r, c - 1));
  if (c < COLS - 1) out.push(ix(r, c + 1));
  return out;
}
/* 两格之间是否是铁路线（粗线） */
function railPair(a, b) {
  var ra = rowOf(a), ca = colOf(a), rb = rowOf(b), cb = colOf(b);
  if (ra === rb) return isRailRow(ra) && Math.abs(ca - cb) === 1;
  if (ca === cb) return (ca === 0 || ca === COLS - 1) && Math.abs(ra - rb) === 1;
  return false;
}

/* ---------- 开局 ---------- */
function newState() {
  var pieces = [];
  for (var color = 0; color < 2; color++) {
    RANK_DEFS.forEach(function (d) {
      for (var n = 0; n < d.count; n++) {
        pieces.push({ c: color, n: d.name, r: d.rank, hidden: true });
      }
    });
  }
  shuffle(pieces);
  var stations = [];
  for (var i = 0; i < TOTAL; i++) if (!isCamp(i)) stations.push(i);
  shuffle(stations);
  var cells = new Array(TOTAL);
  for (var k = 0; k < TOTAL; k++) cells[k] = null;
  for (var s = 0; s < pieces.length; s++) cells[stations[s]] = pieces[s];
  return { cells: cells, owner: [null, null], turn: 0, over: 0, reason: '' };
}

function cloneState(st) {
  return {
    cells: st.cells.map(function (c) { return c ? { c: c.c, n: c.n, r: c.r, hidden: c.hidden } : null; }),
    owner: [st.owner[0], st.owner[1]],
    turn: st.turn,
    over: st.over,
    reason: st.reason
  };
}

/* ---------- 统计 ---------- */
function minesLeft(st, color) {
  var n = 0;
  for (var i = 0; i < TOTAL; i++) {
    var c = st.cells[i];
    if (c && c.c === color && c.n === '地雷') n++;
  }
  return n;
}
function revealedCount(st, color) {
  var n = 0;
  for (var i = 0; i < TOTAL; i++) {
    var c = st.cells[i];
    if (c && !c.hidden && c.c === color) n++;
  }
  return n;
}
function movableCount(st, color) {
  var n = 0;
  for (var i = 0; i < TOTAL; i++) {
    var c = st.cells[i];
    if (c && c.c === color && c.n !== '地雷' && c.n !== '军旗') n++;
  }
  return n;
}

/* ---------- 定阵营：谁先翻出 2 张同色牌，那色就归他 ---------- */
function tryAssign(st, flipper) {
  if (st.owner[0] !== null) return null;
  var red = revealedCount(st, RED), blue = revealedCount(st, BLUE);
  var color = red >= 2 ? RED : (blue >= 2 ? BLUE : null);
  if (color === null) return null;
  st.owner[flipper] = color;
  st.owner[1 - flipper] = 1 - color;
  return { flipper: flipper, color: color };
}

/* ---------- 走棋 ---------- */
function canEnter(st, att, to) {
  var def = st.cells[to];
  if (!def) return true;
  if (isCamp(to)) return false;                 /* 行营里的棋子是安全的，吃不到 */
  if (def.hidden) return false;                 /* 暗牌不能吃，先翻开 */
  if (def.c === att.c) return false;            /* 不能吃自己 */
  if (def.n === '军旗' && minesLeft(st, def.c) > 0) return false;  /* 军旗有地雷保护 */
  return true;
}

function movesFrom(st, from) {
  var att = st.cells[from];
  if (!att || att.hidden) return [];
  if (att.n === '地雷' || att.n === '军旗') return [];
  var out = [], seen = {};
  function push(k) { if (!seen[k]) { seen[k] = 1; out.push(k); } }

  /* 公路：相邻走 1 格 */
  var ns = neighbors(from);
  for (var i = 0; i < ns.length; i++) if (canEnter(st, att, ns[i])) push(ns[i]);

  /* 铁路：工兵可拐弯任意走；其他棋子只能直线走 */
  var onRail = isRailRow(rowOf(from)) || colOf(from) === 0 || colOf(from) === COLS - 1;
  if (onRail) {
    if (att.n === '工兵') {
      var q = [from], vis = {};
      vis[from] = 1;
      while (q.length) {
        var cur = q.shift();
        var cns = neighbors(cur);
        for (var m = 0; m < cns.length; m++) {
          var k = cns[m];
          if (vis[k] || !railPair(cur, k)) continue;
          vis[k] = 1;
          if (st.cells[k]) {
            if (canEnter(st, att, k)) push(k);
          } else {
            push(k); q.push(k);
          }
        }
      }
    } else {
      var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (var d = 0; d < dirs.length; d++) {
        var r = rowOf(from), c = colOf(from), prev = from;
        while (true) {
          var nr = r + dirs[d][0], nc = c + dirs[d][1];
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) break;
          var kk = ix(nr, nc);
          if (!railPair(prev, kk)) break;
          if (st.cells[kk]) {
            if (canEnter(st, att, kk)) push(kk);
            break;
          }
          push(kk);
          prev = kk; r = nr; c = nc;
        }
      }
    }
  }
  return out;
}

/* 吃子结果：win 吃 / lose 被吃 / both 同归 / dig 工兵挖雷 / flag 夺旗 */
function outcome(att, def) {
  if (att.n === '炸弹' || def.n === '炸弹') return 'both';
  if (def.n === '地雷') return att.n === '工兵' ? 'dig' : 'lose';
  if (def.n === '军旗') return 'flag';
  if (att.r > def.r) return 'win';
  if (att.r === def.r) return 'both';
  return 'lose';
}

function applyAction(st, a) {
  if (a.type === 'flip') {
    var cell = st.cells[a.i];
    if (!cell || !cell.hidden) return { ok: false };
    cell.hidden = false;
    return { ok: true, type: 'flip', revealed: cell, assign: tryAssign(st, st.turn) };
  }

  var att = st.cells[a.from];
  if (!att || att.hidden) return { ok: false };
  if (st.owner[0] === null || att.c !== st.owner[st.turn]) return { ok: false };
  if (movesFrom(st, a.from).indexOf(a.to) < 0) return { ok: false };

  var def = st.cells[a.to];
  if (!def) {
    st.cells[a.to] = att;
    st.cells[a.from] = null;
    return { ok: true, type: 'move', outcome: 'move', attName: att.n };
  }

  var o = outcome(att, def);
  var res = { ok: true, type: 'move', outcome: o, defName: def.n, defColor: def.c, attName: att.n };
  if (o === 'win' || o === 'dig' || o === 'flag') {
    st.cells[a.to] = att;
    st.cells[a.from] = null;
    if (o === 'flag') {
      st.over = st.turn + 1;
      st.reason = 'flag';
    }
  } else if (o === 'both') {
    st.cells[a.to] = null;
    st.cells[a.from] = null;
  } else {
    st.cells[a.from] = null;
  }
  return res;
}

function genActions(st, side) {
  var acts = [];
  for (var i = 0; i < TOTAL; i++) if (st.cells[i] && st.cells[i].hidden) acts.push({ type: 'flip', i: i });
  if (st.owner[0] === null) return acts;          /* 阵营没定只能翻牌 */
  var color = st.owner[side];
  for (var j = 0; j < TOTAL; j++) {
    var c = st.cells[j];
    if (!c || c.hidden || c.c !== color) continue;
    var mv = movesFrom(st, j);
    for (var k = 0; k < mv.length; k++) acts.push({ type: 'move', from: j, to: mv[k] });
  }
  return acts;
}

function afterAction(st) {
  if (st.over) return;
  if (st.owner[0] !== null) {
    var a = movableCount(st, st.owner[0]), b = movableCount(st, st.owner[1]);
    if (a === 0 && b === 0) { st.over = 3; st.reason = 'flat'; return; }
    if (a === 0) { st.over = 2; st.reason = 'dead'; return; }
    if (b === 0) { st.over = 1; st.reason = 'dead'; return; }
  }
  st.turn = 1 - st.turn;
  if (!genActions(st, st.turn).length) st.turn = 1 - st.turn;   /* 无棋可动就跳过 */
}

/* ================= 电脑对手（只看已翻开的牌，不偷看暗牌） ================= */
function pieceValue(p) {
  if (p.n === '军旗') return 14;
  if (p.n === '炸弹') return 9;
  if (p.n === '地雷') return 4;
  return p.r;
}
function threatAt(st, idx) {
  var me = st.cells[idx];
  if (!me) return 0;
  var worst = 0, ns = neighbors(idx);
  for (var i = 0; i < ns.length; i++) {
    var e = st.cells[ns[i]];
    if (!e || e.hidden || e.c === me.c) continue;
    var o = outcome(e, me);
    if (o === 'win' || o === 'flag' || o === 'dig') worst = Math.max(worst, pieceValue(me));
    else if (o === 'both') worst = Math.max(worst, pieceValue(me) * 0.6);
  }
  return worst;
}
function scoreMove(st, side, a) {
  var att = st.cells[a.from], def = st.cells[a.to];
  var sc = 0;
  if (def) {
    var o = outcome(att, def);
    if (o === 'flag') return 1e8;
    if (o === 'win') sc += 30 + pieceValue(def) * 12;
    else if (o === 'dig') sc += 220;
    else if (o === 'both') sc += pieceValue(def) * 11 - pieceValue(att) * 9;
    else sc -= 150 + pieceValue(att) * 14;
  } else {
    sc += 4;
    if (isCamp(a.to)) sc += 30;
    if (isCamp(a.from)) sc -= 28;
    sc -= threatAt(st, a.to) * 20;
  }
  return sc;
}
function aiChoose(st, side) {
  var acts = genActions(st, side);
  if (!acts.length) return null;
  var revealedOwn = 0;
  if (st.owner[side] !== null) {
    for (var i = 0; i < TOTAL; i++) {
      var c = st.cells[i];
      if (c && !c.hidden && c.c === st.owner[side] && c.n !== '地雷' && c.n !== '军旗') revealedOwn++;
    }
  }
  var best = null, bestSc = -1e9;
  for (var k = 0; k < acts.length; k++) {
    var a = acts[k], sc;
    if (a.type === 'flip') {
      sc = 8 + Math.random() * 10;
      if (st.owner[0] === null) sc += 50;            /* 定阵营阶段只有翻牌 */
      else if (revealedOwn < 6) sc += 24;            /* 自己牌太少时先翻牌 */
    } else {
      sc = scoreMove(st, side, a) + Math.random() * 9;
    }
    if (sc > bestSc) { bestSc = sc; best = a; }
  }
  return best;
}

/* ================= 专属音效：炸弹 / 工兵（WebAudio 合成，无外部文件） ================= */
var audioCtx = null;
function audio() {
  if (audioCtx) return audioCtx;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { audioCtx = new AC(); } catch (e) { return null; }
  return audioCtx;
}
function resumeAudio() {
  var ac = audio();
  if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) { } }
  return ac;
}
/* 造一段带衰减的白噪声（用作爆裂 / 铲土） */
function noiseBuffer(ac, sec, decay) {
  var len = Math.floor(ac.sampleRate * sec);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

/* 炸弹：低频闷响 + 噪声爆裂，尾音快速压低 */
function sfxBomb() {
  var ac = resumeAudio();
  if (!ac) return;
  var t = ac.currentTime;

  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.45);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.6);

  var src = ac.createBufferSource();
  src.buffer = noiseBuffer(ac, 0.7, 2.4);
  var lp = ac.createBiquadFilter(), ng = ac.createGain();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2400, t);
  lp.frequency.exponentialRampToValueAtTime(220, t + 0.7);
  ng.gain.setValueAtTime(0.42, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  src.connect(lp); lp.connect(ng); ng.connect(ac.destination);
  src.start(t); src.stop(t + 0.72);
}

/* 工兵走棋：轻快的铲土声 + 一声脆叮（短、轻，不吵） */
function sfxEngineerMove() {
  var ac = resumeAudio();
  if (!ac) return;
  var t = ac.currentTime;

  var src = ac.createBufferSource();
  src.buffer = noiseBuffer(ac, 0.13, 1.4);
  var bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(1400, t);
  bp.frequency.linearRampToValueAtTime(2600, t + 0.12);
  bp.Q.value = 1.8;
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.17, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + 0.14);

  var o = ac.createOscillator(), og = ac.createGain();
  o.type = 'sine';
  o.frequency.value = 1760;
  og.gain.setValueAtTime(0.0001, t + 0.02);
  og.gain.exponentialRampToValueAtTime(0.1, t + 0.035);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(og); og.connect(ac.destination);
  o.start(t + 0.02); o.stop(t + 0.13);
}

/* 工兵挖雷：三下铲土 + 起雷的金属脆响 */
function sfxDig() {
  var ac = resumeAudio();
  if (!ac) return;
  var t = ac.currentTime;

  for (var k = 0; k < 3; k++) {
    var st = t + k * 0.13;
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.11, 1.6);
    var bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 900 + k * 260;
    bp.Q.value = 1.1;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.3 - k * 0.05, st + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.1);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(st); src.stop(st + 0.12);
  }

  var o = ac.createOscillator(), og = ac.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(1180, t + 0.4);
  o.frequency.exponentialRampToValueAtTime(760, t + 0.52);
  og.gain.setValueAtTime(0.0001, t + 0.4);
  og.gain.exponentialRampToValueAtTime(0.26, t + 0.415);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  o.connect(og); og.connect(ac.destination);
  o.start(t + 0.4); o.stop(t + 0.56);
}

/* 按动作结果挑选音效：炸弹优先，其次工兵 */
function playMoveSfx(r) {
  if (!r || r.type !== 'move') return;
  if (r.attName === '炸弹' || r.defName === '炸弹') { sfxBomb(); return; }
  if (r.attName === '工兵') {
    if (r.outcome === 'dig') sfxDig();
    else sfxEngineerMove();
  }
}

/* ================= 界面 ================= */
var SVGNS = 'http://www.w3.org/2000/svg';
var elBoard = document.getElementById('board');
var elLines = document.getElementById('lines');
var elBoardWrap = document.getElementById('boardWrap');
var elTurnText = document.getElementById('turnText');
var elTurnDot = document.getElementById('turnDot');
var elCampChip = document.getElementById('campChip');
var elMineChip = document.getElementById('mineChip');
var elBanner = document.getElementById('banner');
var elTitle = document.getElementById('bannerTitle');
var elSub = document.getElementById('bannerSub');
var elToast = document.getElementById('toast');
var cellEls = [];
var toastTimer = 0;

function buildCells() {
  cellEls = [];
  for (var i = 0; i < TOTAL; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell';
    b.dataset.i = String(i);
    elBoard.appendChild(b);
    cellEls.push(b);
  }
}

function centerOf(i) {
  return [colOf(i) * (CW + GAP) + CW / 2, rowOf(i) * (CH + GAP) + CH / 2];
}
function addLine(a, b) {
  var rail = railPair(a, b);
  var A = centerOf(a), B = centerOf(b);
  function line(w, color) {
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('x1', A[0]); l.setAttribute('y1', A[1]);
    l.setAttribute('x2', B[0]); l.setAttribute('y2', B[1]);
    l.setAttribute('stroke', color);
    l.setAttribute('stroke-width', w);
    l.setAttribute('stroke-linecap', 'round');
    elLines.appendChild(l);
  }
  if (rail) { line(7, 'rgba(160,115,55,.5)'); line(2.6, '#fcf5e4'); }
  else line(1.4, 'rgba(160,135,90,.42)');
}
function drawLines(w, h) {
  while (elLines.firstChild) elLines.removeChild(elLines.firstChild);
  var mid = document.createElementNS(SVGNS, 'line');
  mid.setAttribute('x1', 0); mid.setAttribute('x2', w);
  var my = 6 * CH + 5.5 * GAP;
  mid.setAttribute('y1', my); mid.setAttribute('y2', my);
  mid.setAttribute('stroke', 'rgba(170,120,60,.3)');
  mid.setAttribute('stroke-width', 2);
  mid.setAttribute('stroke-dasharray', '6 5');
  elLines.appendChild(mid);
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var i = ix(r, c);
      if (c < COLS - 1) addLine(i, ix(r, c + 1));
      if (r < ROWS - 1) addLine(i, ix(r + 1, c));
    }
  }
}

function layoutBoard() {
  var rect = elBoardWrap.getBoundingClientRect();
  var availW = Math.max(140, rect.width - 4);
  var availH = Math.max(140, rect.height - 4);
  var x = Math.min(availW / 7.16, availH / 14.09);
  x = Math.max(17, Math.min(x, 84));
  CW = x * 1.28; CH = x; GAP = x * 0.19;
  var w = Math.floor(CW * COLS + GAP * (COLS - 1));
  var h = Math.floor(CH * ROWS + GAP * (ROWS - 1));
  elBoard.style.width = w + 'px';
  elBoard.style.height = h + 'px';
  elBoard.style.setProperty('--cw', CW + 'px');
  elBoard.style.setProperty('--ch', CH + 'px');
  elBoard.style.setProperty('--fs', Math.min(CW * 0.31, 26) + 'px');
  elLines.setAttribute('width', w);
  elLines.setAttribute('height', h);
  for (var i = 0; i < TOTAL; i++) {
    var el = cellEls[i];
    el.style.left = Math.floor(colOf(i) * (CW + GAP)) + 'px';
    el.style.top = Math.floor(rowOf(i) * (CH + GAP)) + 'px';
    el.style.width = Math.floor(CW) + 'px';
    el.style.height = Math.floor(CH) + 'px';
  }
  drawLines(w, h);
}

function render() {
  for (var i = 0; i < TOTAL; i++) {
    var el = cellEls[i], c = state.cells[i];
    var cls = 'cell', inner = '';
    if (isCamp(i)) cls += ' camp';
    if (!c) {
      if (isCamp(i)) inner = '<span class="clab">行营</span>';
      else cls += ' empty';
    } else if (c.hidden) {
      cls += ' hidden';
      inner = '<span class="bk">军</span>';
    } else {
      cls += c.c === RED ? ' red' : ' blue';
      inner = '<span class="nm">' + c.n + '</span>';
      if (isCamp(i)) cls += ' safe';
    }
    if (selected === i) cls += ' sel';
    if (targets.indexOf(i) >= 0) {
      cls += ' tgt';
      if (c && !c.hidden && state.owner[state.turn] !== null && c.c !== state.owner[state.turn]) cls += ' cap';
    }
    if (lastAction && (lastAction.i === i || lastAction.from === i || lastAction.to === i)) cls += ' last';
    el.className = cls;
    if (el.innerHTML !== inner) el.innerHTML = inner;
  }
  updateHUD();
}

function updateHUD() {
  var assigned = state.owner[0] !== null;
  var p = state.turn;
  var dotColor = assigned ? state.owner[p] : null;
  elTurnDot.className = 'dot' + (dotColor === RED ? ' r' : dotColor === BLUE ? ' b' : '');

  if (state.over) {
    elTurnText.textContent = state.over === 3 ? '平局' : (playerName(state.over - 1) + '获胜');
  } else if (thinking) {
    elTurnText.textContent = '电脑思考中…';
  } else if (!assigned) {
    elTurnText.textContent = playerName(p) + ' 翻牌 · 定阵营';
  } else if (mode === 'pve') {
    elTurnText.textContent = p === 0
      ? '轮到你（' + colorName(state.owner[0]) + '方）'
      : '轮到电脑（' + colorName(state.owner[1]) + '方）';
  } else {
    elTurnText.textContent = '轮到 ' + colorName(state.owner[p]) + '方';
  }

  if (!assigned) {
    elCampChip.innerHTML = '未定 · 红 ' + revealedCount(state, RED) + ' / 蓝 ' + revealedCount(state, BLUE);
  } else {
    var redOwner = state.owner[0] === RED ? 0 : 1;
    var blueOwner = 1 - redOwner;
    elCampChip.innerHTML = '<b class="r">红</b>→' + playerName(redOwner) + ' · <b class="b">蓝</b>→' + playerName(blueOwner);
  }

  var dugR = 3 - minesLeft(state, RED), dugB = 3 - minesLeft(state, BLUE);
  elMineChip.innerHTML = '挖雷 <b class="r">' + dugR + '</b>/3 · <b class="b">' + dugB + '</b>/3';
}

function toast(msg, ms) {
  elToast.textContent = msg;
  elToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { elToast.classList.remove('show'); }, ms || 1300);
}

function showEnd() {
  var t, s;
  if (state.over === 3) { t = '🤝 平局'; s = '双方都没有能走的棋子了'; }
  else {
    var winner = state.over - 1;
    if (mode === 'pve') t = winner === 0 ? '🎉 你赢了！' : '💻 电脑赢了';
    else t = '🎉 ' + playerName(winner) + ' 获胜！';
    s = state.reason === 'flag' ? '工兵挖完地雷，军旗被夺走' : '对方已经没有能走的棋子了';
  }
  elTitle.textContent = t;
  elSub.textContent = s;
  elBanner.classList.add('show');
}

function isHumanTurn() {
  return state && !state.over && !thinking && (mode === 'pvp' || state.turn === 0);
}

function doAction(a) {
  if (!state || state.over) return;
  var snap = cloneState(state);
  var r = applyAction(state, a);
  if (!r.ok) return;
  moveHistory.push(snap);
  lastAction = { type: a.type, from: a.from, to: a.to, i: a.i };
  selected = -1;
  targets = [];

  if (r.type === 'flip') {
    if (r.assign) toast(colorName(r.assign.color) + '方归 ' + playerName(r.assign.flipper), 1900);
    else toast('翻出 ' + colorName(r.revealed.c) + '方 ' + r.revealed.n, 1000);
  } else if (r.outcome === 'win') toast(r.attName + ' 吃掉 ' + r.defName);
  else if (r.outcome === 'dig') toast('工兵挖掉一个地雷！');
  else if (r.outcome === 'both') toast('同归于尽');
  else if (r.outcome === 'lose') toast(r.attName + ' 被 ' + r.defName + ' 吃掉');
  else if (r.outcome === 'flag') toast('军旗被夺走！');

  playMoveSfx(r);
  afterAction(state);
  render();
  if (state.over) { showEnd(); return; }
  if (mode === 'pve' && state.turn === 1) scheduleAI();
}

function scheduleAI() {
  thinking = true;
  updateHUD();
  var token = ++aiToken;
  setTimeout(function () {
    if (token !== aiToken || !state || state.over) { thinking = false; updateHUD(); return; }
    var a = aiChoose(state, 1);
    thinking = false;
    if (a) doAction(a); else updateHUD();
  }, 420);
}

function resetGame() {
  aiToken++;
  thinking = false;
  state = newState();
  selected = -1;
  targets = [];
  lastAction = null;
  moveHistory = [];
  elBanner.classList.remove('show');
  elToast.classList.remove('show');
  render();
  layoutBoard();
  setTimeout(function () {
    if (state && !state.over && state.owner[0] === null) toast('先翻出 2 张同色牌，那个颜色全归你', 1800);
  }, 300);
}

function undo() {
  if (!moveHistory.length) return;
  aiToken++;
  thinking = false;
  elBanner.classList.remove('show');
  selected = -1;
  targets = [];
  lastAction = null;
  var steps = mode === 'pve' ? 2 : 1;
  while (steps > 0 && moveHistory.length) {
    state = moveHistory.pop();
    steps--;
    if (mode === 'pve' && state.turn === 0) break;
  }
  render();
  if (mode === 'pve' && state.turn === 1) scheduleAI();
}

function handleCell(i) {
  if (!isHumanTurn()) return;
  var c = state.cells[i];

  if (c && c.hidden) { doAction({ type: 'flip', i: i }); return; }

  if (state.owner[0] === null) { toast('阵营还没定，只能先翻牌'); return; }

  if (c && c.c === state.owner[state.turn]) {
    if (c.n === '地雷' || c.n === '军旗') { toast(c.n + ' 不能移动'); return; }
    if (selected === i) { selected = -1; targets = []; render(); return; }
    selected = i;
    targets = movesFrom(state, i);
    if (!targets.length) toast('这枚棋子暂时没有可走的格子', 1000);
    render();
    return;
  }

  if (selected >= 0 && targets.indexOf(i) >= 0) {
    doAction({ type: 'move', from: selected, to: i });
    return;
  }

  if (selected >= 0) { selected = -1; targets = []; render(); }
}

elBoard.addEventListener('click', function (e) {
  var t = e.target.closest('.cell');
  if (!t) return;
  handleCell(parseInt(t.dataset.i, 10));
});

document.getElementById('seg').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var m = btn.getAttribute('data-mode');
  if (m === mode) return;
  mode = m;
  var all = this.querySelectorAll('button');
  for (var k = 0; k < all.length; k++) all[k].classList.toggle('on', all[k] === btn);
  resetGame();
});
document.getElementById('restartBtn').addEventListener('click', resetGame);
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('bannerBtn').addEventListener('click', resetGame);
elBanner.addEventListener('click', function (e) {
  if (e.target === elBanner) elBanner.classList.remove('show');
});

window.addEventListener('resize', layoutBoard);
if (window.ResizeObserver) new ResizeObserver(function () { layoutBoard(); }).observe(elBoardWrap);

buildCells();
resetGame();
setTimeout(layoutBoard, 60);

/* 测试钩子 */
window.__junqi = {
  reset: resetGame,
  setMode: function (m) { mode = m; resetGame(); },
  getState: function () { return cloneState(state); },
  flip: function (i) { doAction({ type: 'flip', i: i }); },
  move: function (f, t) { doAction({ type: 'move', from: f, to: t }); },
  moves: function (i) { return movesFrom(state, i); },
  actions: function () { return genActions(state, state.turn); },
  ai: function () { return aiChoose(state, 1); },
  pick: function (side) { return aiChoose(state, side); },
  outcome: outcome,
  setState: function (st) { state = st; selected = -1; targets = []; lastAction = null; render(); },
  board: function () { return { cols: COLS, rows: ROWS, total: TOTAL, camps: Object.keys(CAMP_IDX).map(Number), cw: CW, ch: CH }; }
};</script>
