<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>家长面板 · 小脑袋乐园</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8fbe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小脑袋乐园">
<link rel="apple-touch-icon" href="games/img/icon-180.png">
<link rel="icon" type="image/png" href="games/img/icon-192.png">
<script src="voice.js"></script>
<script src="sound.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;color:#243b53;
  background:radial-gradient(900px 500px at 0% 0%,#ffe9f2,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#e5f3ff,transparent 55%),
             linear-gradient(160deg,#fff9f4,#f3f9ff);
  min-height:100dvh;padding:18px 16px 40px;}
.wrap{max-width:820px;margin:0 auto;}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
h1{font-size:1.35rem;}
.back{margin-left:auto;text-decoration:none;background:#fff;color:#243b53;border-radius:999px;
  display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;font-weight:800;font-size:.88rem;
  box-shadow:0 3px 10px rgba(36,59,83,.10);}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;
  box-shadow:0 8px 20px rgba(36,59,83,.08);border:1px solid rgba(36,59,83,.06);}
.card h2{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.hint{font-size:.8rem;color:#7b8ea8;line-height:1.6;margin-top:8px;}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:100px;min-height:58px;border-radius:14px;border:2px solid rgba(36,59,83,.10);
  background:#fff;font-family:inherit;font-size:1.05rem;font-weight:900;color:#3b5370;cursor:pointer;}
.seg button.on{background:#7c5cff;border-color:#7c5cff;color:#fff;box-shadow:0 8px 18px rgba(124,92,255,.28);}
.seg button small{display:block;font-size:.68rem;font-weight:700;opacity:.75;margin-top:2px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.kpi{background:#f7fafd;border-radius:14px;padding:12px;text-align:center;}
.kpi b{display:block;font-size:1.5rem;color:#7c5cff;line-height:1.2;}
.kpi span{font-size:.72rem;color:#7b8ea8;font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:.86rem;}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #eef3f9;}
th{font-size:.74rem;color:#8aa0b8;font-weight:800;white-space:nowrap;}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;color:#3b5370;font-weight:700;}
td.name{font-weight:800;}
.bar{height:6px;border-radius:3px;background:#eef3f9;overflow:hidden;margin-top:4px;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fe3b0,#4cc98a);}
.empty{text-align:center;color:#8aa0b8;font-size:.86rem;padding:18px 0;font-weight:700;}
.warn{background:#fff7e3;border:1px solid #ffe1a8;color:#a06b1f;border-radius:12px;
  padding:10px 12px;font-size:.82rem;font-weight:700;margin-bottom:14px;line-height:1.6;}
footer{text-align:center;font-size:.74rem;color:#9fb1c6;margin-top:10px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👨‍👩‍👧 家长面板</h1>
    <a class="back" href="index.html">🏠 回到首页</a>
  </header>

  <div class="warn" id="storeWarn" hidden>
    当前是「文件方式」打开（file://），浏览器不保存数据，所以这里看不到统计。<br>
    用网页地址打开（或加到主屏）后再玩，就能记录了。
  </div>

  <div class="card" id="age">
    <h2>👶 年龄档</h2>
    <div class="seg" id="seg">
      <button type="button" data-stage="kid">🍼 幼儿园<small>3~6 岁 · 28 个游戏</small></button>
      <button type="button" data-stage="low">📚 低年级<small>1~3 年级 · 10 个游戏</small></button>
      <button type="button" data-stage="high">🚀 高年级<small>4~6 年级 · 29 个游戏</small></button>
    </div>
    <div class="hint">首页会按这里的选择显示游戏，和首页顶部的 tab 是同一个设置，改完回首页即可看到。</div>
  </div>

  <div class="card" id="stats">
    <h2>📊 最近 7 天</h2>
    <div class="kpis" id="kpis"></div>
    <div class="hint">只统计本机浏览器里的记录；换设备、清理缓存会清零。</div>
  </div>

  <div class="card" id="games">
    <h2>🎮 每个游戏</h2>
    <div id="tableWrap"><div class="empty">还没有记录，去首页玩一会儿吧～</div></div>
  </div>

  <footer>
    正确率 = 点对次数 ÷（点对 + 点错）· 「—」表示这几天没有答对/答错的记录<br>
    小脑袋乐园 · 无广告 · 无排行 · 不扣分
  </footer>
</div>

<script>
(function () {
  var X = window.XNLY || {};
  var seg = document.getElementById('seg');

  /* ---------- 年龄档（与首页 tab 共用 xnly_stage） ---------- */
  function readStage() {
    try {
      var v = localStorage.getItem('xnly_stage');
      if (v === 'kid' || v === 'low' || v === 'high') return v;
      var old = localStorage.getItem('xnly_age');
      if (old === '4') return 'low';
      if (old === '5') return 'high';
    } catch (e) { }
    return 'kid';
  }
  function renderStage() {
    var s = readStage();
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.dataset.stage === s);
    });
  }
  seg.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    try { localStorage.setItem('xnly_stage', b.dataset.stage); } catch (err) { }
    renderStage();
    var X = window.XNLY || {};
    if (X.voice) X.voice.speak(['幼儿园', '低年级', '高年级'][['kid', 'low', 'high'].indexOf(b.dataset.stage)] + '。');
  });

  if (X.canStore === false) document.getElementById('storeWarn').hidden = false;

  /* ---------- 数据 ---------- */
  function lastDays(n) {
    var out = [], now = new Date();
    for (var i = 0; i < n; i++) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var m = d.getMonth() + 1, day = d.getDate();
      out.push(d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day));
    }
    return out;
  }

  function fmtTime(ms) {
    if (!ms) return '—';
    var min = Math.round(ms / 60000);
    if (min < 1) return '不到 1 分钟';
    if (min < 60) return min + ' 分钟';
    var h = Math.floor(min / 60);
    return h + ' 小时 ' + (min % 60) + ' 分';
  }

  function fmtPct(r, w) {
    var total = (r || 0) + (w || 0);
    if (!total) return '—';
    return Math.round((r / total) * 100) + '%';
  }

  function collect(days) {
    var raw = (X.stats && X.stats.load) ? X.stats.load() : {};
    var map = {}, total = { ms: 0, right: 0, wrong: 0 };
    days.forEach(function (dk) {
      var dayObj = raw[dk];
      if (!dayObj) return;
      Object.keys(dayObj).forEach(function (g) {
        var e = dayObj[g] || {};
        var m = map[g] || (map[g] = { ms: 0, right: 0, wrong: 0, title: '' });
        m.ms += (e.ms || 0);
        m.right += (e.right || 0);
        m.wrong += (e.wrong || 0);
        if (!m.title && e.title) m.title = e.title;
        total.ms += (e.ms || 0);
        total.right += (e.right || 0);
        total.wrong += (e.wrong || 0);
      });
    });
    return { map: map, total: total, today: raw[days[0]] || {} };
  }

  function render() {
    var days = lastDays(7);
    var data = collect(days);
    var list = Object.keys(data.map).map(function (k) {
      var v = data.map[k];
      return { key: k, title: v.title || k.replace(/^games\//, '').replace(/\.html$/, ''), ms: v.ms, right: v.right, wrong: v.wrong };
    }).filter(function (x) { return x.ms > 0 || x.right > 0 || x.wrong > 0; })
      .sort(function (a, b) { return b.ms - a.ms; });

    /* 顶部概览 */
    var kpis = document.getElementById('kpis');
    kpis.innerHTML =
      '<div class="kpi"><b>' + fmtTime(data.total.ms) + '</b><span>7 天总时长</span></div>' +
      '<div class="kpi"><b>' + (data.total.right + data.total.wrong) + '</b><span>7 天答题次数</span></div>' +
      '<div class="kpi"><b>' + fmtPct(data.total.right, data.total.wrong) + '</b><span>7 天正确率</span></div>' +
      '<div class="kpi"><b>' + list.length + '</b><span>玩过的游戏</span></div>';

    var wrap = document.getElementById('tableWrap');
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">还没有记录，去首页玩一会儿吧～</div>';
      return;
    }

    var maxMs = list.reduce(function (m, x) { return Math.max(m, x.ms); }, 1);
    var rows = list.map(function (x) {
      var pct = (x.right + x.wrong) ? Math.round((x.right / (x.right + x.wrong)) * 100) : null;
      var bar = Math.max(3, Math.round((x.ms / maxMs) * 100));
      return '<tr>' +
        '<td class="name">' + x.title +
          '<div class="bar"><i style="width:' + bar + '%"></i></div>' +
        '</td>' +
        '<td class="n">' + fmtTime(x.ms) + '</td>' +
        '<td class="n">' + (x.right + x.wrong ? (x.right + x.wrong) + ' 次' : '—') + '</td>' +
        '<td class="n">' + (pct === null ? '—' : pct + '%') + '</td>' +
      '</tr>';
    }).join('');

    wrap.innerHTML = '<table><thead><tr>' +
      '<th>游戏</th><th>7 天时长</th><th>答题</th><th>正确率</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  renderStage();
  render();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') render();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
}
</script>
</body>
</html>
